<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="description" content="ویجت آمار بازدیدکنندگان دیار - نمایش زنده آمار بازدید سایت">
    <meta name="theme-color" content="#6750A4">
    <title>آمار بازدید | Diyar Widgets</title>

    <!-- Google Fonts: Vazirmatn (Persian optimized font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Widget Styles -->
    <link rel="stylesheet" href="visitor.css">
</head>
<body>

    <!-- ==========================================================
         VISITOR STATISTICS WIDGET
         Root container - theme is applied via data-theme attribute
         and toggled dynamically by visitor.js
    =========================================================== -->
    <main
        class="visitor-widget"
        id="visitorWidget"
        data-theme="auto"
        role="region"
        aria-label="ویجت آمار بازدیدکنندگان"
    >

        <!-- ==================== HEADER ==================== -->
        <header class="visitor-widget__header">
            <h1 class="visitor-widget__title">
                <span class="visitor-widget__title-icon" aria-hidden="true">📊</span>
                <span>آمار بازدید</span>
            </h1>

            <div class="visitor-widget__header-actions">
                <!-- Live status indicator -->
                <div class="visitor-widget__status" role="status" aria-live="polite">
                    <span class="visitor-widget__status-dot" aria-hidden="true"></span>
                    <span class="visitor-widget__status-text">زنده</span>
                </div>

                <!-- Theme toggle -->
                <button
                    type="button"
                    class="visitor-widget__theme-toggle"
                    id="visitorThemeToggle"
                    aria-label="تغییر حالت نمایش (روشن/تیره)"
                    title="تغییر حالت نمایش"
                >
                    <span class="visitor-widget__theme-icon" aria-hidden="true">🌓</span>
                </button>
            </div>
        </header>

        <!-- ==================== STATS GRID ==================== -->
        <section
            class="visitor-widget__grid"
            id="visitorGrid"
            aria-label="آمار تفصیلی بازدیدکنندگان"
        >

            <!-- Today -->
            <article class="visitor-card" data-stat="today" tabindex="0" aria-label="بازدید امروز">
                <div class="visitor-card__icon" aria-hidden="true">👁</div>
                <div class="visitor-card__content">
                    <span class="visitor-card__label">امروز</span>
                    <span class="visitor-card__value" data-count-target="0">۰</span>
                </div>
            </article>

            <!-- Yesterday -->
            <article class="visitor-card" data-stat="yesterday" tabindex="0" aria-label="بازدید دیروز">
                <div class="visitor-card__icon" aria-hidden="true">📅</div>
                <div class="visitor-card__content">
                    <span class="visitor-card__label">دیروز</span>
                    <span class="visitor-card__value" data-count-target="0">۰</span>
                </div>
            </article>

            <!-- This Week -->
            <article class="visitor-card" data-stat="week" tabindex="0" aria-label="بازدید این هفته">
                <div class="visitor-card__icon" aria-hidden="true">📈</div>
                <div class="visitor-card__content">
                    <span class="visitor-card__label">این هفته</span>
                    <span class="visitor-card__value" data-count-target="0">۰</span>
                </div>
            </article>

            <!-- This Month -->
            <article class="visitor-card" data-stat="month" tabindex="0" aria-label="بازدید این ماه">
                <div class="visitor-card__icon" aria-hidden="true">🗓</div>
                <div class="visitor-card__content">
                    <span class="visitor-card__label">این ماه</span>
                    <span class="visitor-card__value" data-count-target="0">۰</span>
                </div>
            </article>

            <!-- Total -->
            <article class="visitor-card visitor-card--highlight" data-stat="total" tabindex="0" aria-label="کل بازدید">
                <div class="visitor-card__icon" aria-hidden="true">🌍</div>
                <div class="visitor-card__content">
                    <span class="visitor-card__label">کل بازدید</span>
                    <span class="visitor-card__value" data-count-target="0">۰</span>
                </div>
            </article>

            <!-- Online Now -->
            <article class="visitor-card visitor-card--online" data-stat="online" tabindex="0" aria-label="کاربران آنلاین">
                <div class="visitor-card__icon" aria-hidden="true">🟢</div>
                <div class="visitor-card__content">
                    <span class="visitor-card__label">کاربران آنلاین</span>
                    <span class="visitor-card__value" data-count-target="0">۰</span>
                </div>
            </article>

        </section>

        <!-- ==================== FOOTER ==================== -->
        <footer class="visitor-widget__footer">
            <span class="visitor-widget__footer-label">آخرین بروزرسانی:</span>
            <time class="visitor-widget__footer-time" id="visitorUpdatedTime" datetime="">
                --:--
            </time>
        </footer>

    </main>

    <!-- ==========================================================
         SCRIPTS
         config.js must load before visitor.js (dependency order)
    =========================================================== -->
    <script src="config.js"></script>
    <script src="visitor.js"></script>

</body>
</html>
