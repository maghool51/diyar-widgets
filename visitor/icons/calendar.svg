<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24">

  <!-- background -->
  <rect x="2" y="2" width="20" height="20" rx="6"
        fill="#4285F4"
        opacity="0.15"/>

  <!-- calendar body -->
  <rect x="5" y="6.5" width="14" height="12"
        rx="3"
        fill="none"
        stroke="#4285F4"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- top rings -->
  <path d="M8 4.5V8"
        stroke="#4285F4"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <path d="M16 4.5V8"
        stroke="#4285F4"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- divider -->
  <path d="M5 10.5H19"
        stroke="#4285F4"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- date dots -->
  <circle cx="9" cy="13.5" r="1"
          fill="#4285F4"/>

  <circle cx="12" cy="13.5" r="1"
          fill="#4285F4"/>

  <circle cx="15" cy="13.5" r="1"
          fill="#4285F4"/>

  <circle cx="9" cy="16.5" r="1"
          fill="#4285F4"/>

  <circle cx="12" cy="16.5" r="1"
          fill="#4285F4"/>

</svg>
