<style>
*{

}

html{

.container{

/* =========================
   HEADER
========================= */

.header{
    position:relative;

}

.header-subtitle{

}

.live-light{

    border-radius:50%;

    box-shadow:0 0 8px rgba(244,67,54,.8);

}

@keyframes blink{
    0%,100%{

    }
    50%{

    }
}

/* =========================
   CONTROLS
========================= */

.controls{

========================= */

.toast{

<script>

/* =========================================================
   SETTINGS
========================================================= */

const SUMMARY_URL =
"https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";

const RUBIKA_PAGE_URL =
"https://maghool51.github.io/diyar-widgets/diyar-news/rubika-news.html";

const NEWS_COUNT = 10;

const MAX_SUMMARY_LENGTH = 150;

const ADMIN_STORAGE_KEY =
"diyarRubikaPublisherV1";

const DEFAULT_ADMIN_NAME =
"ادمین";

const DEFAULT_ADMIN_RUBIKA =
"";


/* =========================================================
   STATE
========================================================= */

let allNews = [];

let currentCategory = "all";

let publisherName =
DEFAULT_ADMIN_NAME;

let publisherRubika =
DEFAULT_ADMIN_RUBIKA;


/* =========================================================
   BASIC HELPERS
========================================================= */

function normalizeText(value){

    return String(value ?? "")
        .toLowerCase()
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/ة/g,"ه")
        .replace(/\u200c/g," ")
        .replace(/\s+/g," ")
        .trim();

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function toPersianDigits(value){

    return String(value)
        .replace(/\d/g,function(d){
            return "۰۱۲۳۴۵۶۷۸۹"[Number(d)];
        });

}


/* =========================================================
   KEYWORD MATCHING
   جلوگیری از اشتباه‌هایی مثل پزشکی ← پزشکیان
========================================================= */

function keywordMatches(text, keyword){

    const source =
        normalizeText(text);

    const kw =
        normalizeText(keyword);

    if(!source || !kw){
        return false;
    }

    const escaped =
        kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

    try{

        return new RegExp(
            `(^|[^\\p{L}\\p{N}])${escaped}(?=$|[^\\p{L}\\p{N}])`,
            "u"
        ).test(source);

    }catch{

        return source
            .split(/\s+/)
            .includes(kw);

    }

}


function keywordScore(text, keywords){

    let score = 0;

    for(const keyword of keywords){

        if(keywordMatches(text,keyword)){

            /*
             * واژه‌های طولانی‌تر ارزش بیشتری دارند.
             * مثلاً «پزشکیان» از «پزشکی» دقیق‌تر است.
             */

            score += Math.max(
                1,
                normalizeText(keyword).length / 4
            );

        }

    }

    return score;

}


/* =========================================================
   SMART CATEGORY
========================================================= */

function smartCategory(item){

    const title =
        normalizeText(item.title || "");

    const summary =
        normalizeText(
            item.summary ||
            item.description ||
            ""
        );

    const text =
        `${title} ${summary}`;


    /* -----------------------------------------
       سیاسی
    ----------------------------------------- */

    const politicalKeywords = [

        "پزشکیان",
        "رئیس جمهور",
        "رییس جمهور",
        "دولت",
        "مجلس",
        "نماینده مجلس",
        "نمایندگان مجلس",
        "قالیباف",
        "جلیلی",
        "روحانی",
        "رئیسی",
        "احمدی نژاد",
        "احمدی‌نژاد",
        "ظریف",
        "وزیر",
        "وزارت",
        "انتخابات",

        "شورای نگهبان",

        "رئیس دولت",

        "کابینه",
        "استیضاح",
        "تحقیق و تفحص",
        "سیاست داخلی"

    ];


    /* -----------------------------------------
       اجتماعی
    ----------------------------------------- */

    const socialKeywords = [

        "اجتماعی",
        "جامعه",
        "خانواده",
        "آموزش و پرورش",
        "مدرسه",
        "دانش آموز",
        "دانش‌آموز",
        "دانشجو",

        "تصادف",

        "آلودگی هوا",

    ];


    /* -----------------------------------------

    ----------------------------------------- */

    const sportKeywords = [

        "ورزش",

        "فوتبال",
        "والیبال",
        "بسکتبال",
        "کشتی",
        "تیم ملی",

    ];


    /* -----------------------------------------
       اقتصادی
    ----------------------------------------- */

    const economyKeywords = [

        "اقتصاد",
        "اقتصادی",
        "بانک",
        "بانکی",
        "بورس",
        "سهام",
        "ارز",
        "دلار",
        "یورو",
        "طلا",
        "سکه",
        "بازار",
        "قیمت",
        "تورم",
        "تولید",
        "صادرات",
        "واردات",
        "سرمایه گذاری",
        "سرمایه‌گذاری",
        "مسکن",
        "وام",
        "تسهیلات"

    ];


    /* -----------------------------------------
       فناوری
    ----------------------------------------- */

    const technologyKeywords = [

        "فناوری",
        "تکنولوژی",
        "هوش مصنوعی",
        "اینترنت",

    ];


    /* -----------------------------------------

    ----------------------------------------- */

    const internationalKeywords = [

    ];


    /* -----------------------------------------
       علمی و پزشکی
    ----------------------------------------- */

    const scienceKeywords = [

        "پزشکی",
        "پزشک",
        "بیمارستان",
        "بیماری",
        "درمان",
        "دارو",
        "سلامت",
        "بهداشت",
        "واکسن",
        "پژوهش",
        "دانشگاه",
        "علمی",
        "علوم",
        "سلول",
        "ژن",

        "سرطان",

        "پزشکان",

        "آزمایشگاه"

    ];


    const politicalScore =
        keywordScore(text,politicalKeywords);

    const socialScore =
        keywordScore(text,socialKeywords);

    const sportScore =
        keywordScore(text,sportKeywords);

    const economyScore =
        keywordScore(text,economyKeywords);

    const technologyScore =
        keywordScore(text,technologyKeywords);

    const internationalScore =
        keywordScore(text,internationalKeywords);

    const scienceScore =
        keywordScore(text,scienceKeywords);


    /*
     * اولویت ویژه:
     * پزشکیان باید سیاسی باشد،
     * حتی اگر در بخشی از عنوان/خلاصه
     * واژه‌های مشابه پزشکی وجود داشته باشد.
     */

    if(
        keywordMatches(text,"پزشکیان") ||
        keywordMatches(text,"قالیباف") ||
        keywordMatches(text,"جلیلی") ||
        keywordMatches(text,"روحانی") ||
        keywordMatches(text,"رئیسی") ||
        keywordMatches(text,"احمدی نژاد") ||
        keywordMatches(text,"ظریف")
    ){

        return "سیاسی";

    }


    if(
        sportScore >= 2 &&
        sportScore >= politicalScore
    ){

        return "ورزشی";

    }


    if(
        internationalScore >= 2 &&
        internationalScore >= politicalScore
    ){

        return "بین‌الملل";

    }


    if(
        politicalScore >= 2
    ){

        return "سیاسی";

    }


    if(
        economyScore >= 2
    ){

        return "اقتصادی";

    }


    if(
        technologyScore >= 2
    ){

        return "فناوری";

    }


    if(
        scienceScore >= 2
    ){

        return "علمی و پزشکی";

    }


    if(
        socialScore >= 2
    ){

        return "اجتماعی";

    }


    /*
     * اگر امتیازها پایین بود،
     * دسته اصلی خبر را نگه می‌داریم.
     */

    const original =
        String(
            item.category ||
            item.cat ||

        ).trim();


    const map = {

        "سیاسی":"سیاسی",

        "بین‌الملل":"بین‌الملل",
        "بین الملل":"بین‌الملل",

        "اقتصادی":"اقتصادی",

        "اجتماعی":"اجتماعی",

        "علمی":"علمی و پزشکی",
        "پزشکی":"علمی و پزشکی",

        "فرهنگی":"فرهنگی و هنری",
        "فرهنگی و هنری":"فرهنگی و هنری",

        "متفرقه":"متفرقه"

    };


    return map[original] || "متفرقه";

}


/* =========================================================
   SUMMARY
========================================================= */

function cleanSummary(value){

    let text =
        String(value ?? "")
        .replace(/<[^>]*>/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!text){
        return "";
    }


    if(text.length > MAX_SUMMARY_LENGTH){

        text =
            text.substring(
                0,
                MAX_SUMMARY_LENGTH
            ).trim() + "…";

    }


    return text;

}


/* =========================================================
   DATE / TIME
========================================================= */

function getPersianDate(){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"numeric",
                day:"numeric"
            }
        ).format(new Date());

    }catch{

        return "";

    }

}


function getPersianTime(){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(new Date());

    }catch{

        return "";

    }

}


function formatDate(value){

    if(!value){
        return "";
    }

    try{

        const date =
            new Date(value);

        if(Number.isNaN(date.getTime())){
            return "";
        }

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"numeric",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(date);

    }catch{

        return "";

    }

}


/* =========================================================
   ADMIN / PUBLISHER SETTINGS
========================================================= */

function sanitizePublisherName(value){

    const name =
        String(value ?? "")
        .replace(/\s+/g," ")
        .trim();

    return name ||
        DEFAULT_ADMIN_NAME;

}


function normalizeRubikaUrl(value){

    const raw =
        String(value ?? "")
        .trim();

    if(!raw){
        return "";
    }


    try{

        const url =
            new URL(raw);


        const host =
            url.hostname.toLowerCase();


        if(
            url.protocol !== "https:" ||
            ![
                "rubika.ir",
                "www.rubika.ir"
            ].includes(host)
        ){

            return "";

        }


        let path =
            url.pathname
            .replace(/^\/+/,"")
            .replace(/\/+$/,"");


        if(!path){
            return "";
        }


        return (
            "https://rubika.ir/" +
            path +
            (url.search || "")
        );

    }catch{

        return "";

    }

}

        if(
            saved &&
            typeof saved === "object"
        ){

                    saved.rubika
                );

    }catch{

            DEFAULT_ADMIN_NAME;

        publisherRubika =
            DEFAULT_ADMIN_RUBIKA;

    }


    updatePublisherUI();

function savePublisherSettings(){

    const nameInput =
        document.getElementById(
            "adminName"
        );

    const rubikaInput =
        document.getElementById(
            "adminRubika"
        );


    const rawName =
        nameInput
            ? nameInput.value
            : "";


    const rawRubika =
        rubikaInput
            ? rubikaInput.value
            : "";


    const normalizedRubika =
        normalizeRubikaUrl(
            rawRubika
        );


    if(
        rawRubika.trim() &&
        !normalizedRubika
    ){

        showToast(
            "⚠️ لینک باید از rubika.ir باشد."
        );

        if(rubikaInput){
            rubikaInput.focus();
        }

        return;

    }


    publisherName =
        sanitizePublisherName(
            rawName
        );


    publisherRubika =
        normalizedRubika;


    try{

        localStorage.setItem(

            ADMIN_STORAGE_KEY,

            JSON.stringify({

                name:
                    publisherName,

                rubika:
                    publisherRubika

            })

        );

    }catch{

        /*
         * اگر localStorage در مرورگر
         * در دسترس نبود، برنامه همچنان
         * به کار خود ادامه می‌دهد.
         */

    }


    updatePublisherUI();

    showToast(
        "✅ مشخصات انتشار ذخیره شد."
    );

/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews(){

    const list =
        document.getElementById(
            "newsList"
        );

    const info =
        document.getElementById(
            "updateInfo"
        );


    list.innerHTML = `
        <div class="empty">
            ⏳ در حال دریافت اخبار...
        </div>
    `;


    try{

        const response =
            await fetch(
                SUMMARY_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * پشتیبانی از ساختارهای مختلف
         */

        let items = [];


        if(Array.isArray(data)){

            items = data;

        }else if(
            Array.isArray(data.news)
        ){

            items = data.news;

        }else if(
            Array.isArray(data.items)
        ){

            items = data.items;

        }


        allNews =
            items
            .map(function(item){

                const normalized = {

                    ...item,

                    title:
                        String(
                            item.title ||
                            item.name ||
                            "بدون عنوان"
                        ).trim(),

                    source:
                        String(
                            item.source ||
                            item.publisher ||
                            "منبع نامشخص"
                        ).trim(),

                    summary:
                        cleanSummary(
                            item.summary ||
                            item.description ||
                            item.content ||
                            ""
                        ),

                    date:
                        item.date ||
                        item.pubDate ||
                        item.publishedAt ||
                        item.published ||
                        item.isoDate ||
                        "",

                    link:
                        item.link ||
                        item.url ||
                        "#"

                };


                normalized.category =
                    smartCategory(
                        normalized
                    );


                return normalized;

            })
            .filter(function(item){

                return item.title;

            });


        /*
         * جدیدترین خبرها ابتدا
         */

        allNews.sort(function(a,b){

            const da =
                new Date(a.date).getTime();

            const db =
                new Date(b.date).getTime();


            if(
                Number.isNaN(da) &&
                Number.isNaN(db)
            ){

                return 0;

            }


            if(Number.isNaN(da)){
                return 1;
            }


            if(Number.isNaN(db)){
                return -1;
            }


            return db - da;

        });


        buildCategories();

        renderNews();


        const lastUpdate =
            data.lastUpdatePersian ||
            data.lastUpdate ||
            "";


        info.textContent =
            lastUpdate
                ? "🕐 آخرین بروزرسانی: " + lastUpdate
                : "🕐 اخبار با موفقیت بروزرسانی شد.";


        document.getElementById(
            "dateText"
        ).textContent =
            "🏡 دیار قدمگاه • " +
            getPersianDate();


    }catch(error){

        console.error(
            "News loading error:",
            error
        );


        list.innerHTML = `
            <div class="empty">
                ❌ دریافت اخبار با مشکل مواجه شد.<br>
                لطفاً دوباره بروزرسانی کنید.
            </div>
        `;


        info.textContent =
            "❌ خطا در دریافت اخبار";

    }

}

function buildCategories(){

    const container =
        document.getElementById(
            "categories"
        );


    const counts = {};


    allNews.forEach(function(item){

        const category =
            item.category ||
            "متفرقه";


        counts[category] =
            (counts[category] || 0) + 1;

    });


    const categories = [

        {
            id:"all",
            title:"همه"
        },

        {
            id:"سیاسی",
            title:"سیاسی"
        },

        {
            id:"بین‌الملل",
            title:"بین‌الملل"
        },

        {
            id:"اقتصادی",
            title:"اقتصادی"
        },

        {
            id:"اجتماعی",
            title:"اجتماعی"
        },

        {
            id:"ورزشی",
            title:"ورزشی"
        },

        {
            id:"فناوری",
            title:"فناوری"
        },

        {
            id:"علمی و پزشکی",
            title:"علمی و پزشکی"
        },

        {
            id:"فرهنگی و هنری",
            title:"فرهنگی و هنری"
        },

        {
            id:"متفرقه",
            title:"متفرقه"
        }

    ];


    container.innerHTML = "";


    categories.forEach(function(category){

        if(
            category.id !== "all" &&
            !counts[category.id]
        ){

            return;

        }


        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "category-btn" +
            (
                currentCategory === category.id
                    ? " active"
                    : ""
            );


        const count =
            category.id === "all"
                ? allNews.length
                : counts[category.id] || 0;


        button.textContent =
            category.title +
            " (" +
            toPersianDigits(count) +
            ")";


        button.addEventListener(
            "click",
            function(){

                currentCategory =
                    category.id;

                buildCategories();

                renderNews();

            }
        );


        container.appendChild(button);

    });

}


/* =========================================================
   FILTER
========================================================= */

function getVisibleNews(){

    let items =
        allNews;


    if(
        currentCategory !== "all"
    ){

        items =
            allNews.filter(function(item){

                return (
                    item.category ===
                    currentCategory
                );

            });

    }


    return items.slice(
        0,
        NEWS_COUNT
    );

}


/* =========================================================
   NEW NEWS
========================================================= */

function isNewNews(item){

    if(!item.date){
        return false;
    }


    const date =
        new Date(item.date);


    if(Number.isNaN(date.getTime())){
        return false;
    }


    const diff =
        Date.now() -
        date.getTime();


    return (
        diff >= 0 &&
        diff <= 24 * 60 * 60 * 1000
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderNews(){

    const list =
        document.getElementById(
            "newsList"
        );


    const items =
        getVisibleNews();


    if(!items.length){

        list.innerHTML = `
            <div class="empty">
                📭 خبری در این دسته وجود ندارد.
            </div>
        `;

        return;

    }


    list.innerHTML = "";


    items.forEach(function(item,index){

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "news-card";


        const title =
            document.createElement(
                "h2"
            );


        title.className =
            "news-title";


        title.textContent =
            toPersianDigits(
                (index + 1) +
                ". "
            ) +
            item.title;


        if(isNewNews(item)){

            const badge =
                document.createElement(
                    "span"
                );


            badge.className =
                "fresh-badge";


            badge.textContent =
                "جدید";


            title.appendChild(badge);

        }


        card.appendChild(title);


        const meta =
            document.createElement(
                "div"
            );


        meta.className =
            "news-meta";


        const dateText =
            formatDate(item.date);


        meta.textContent =
            "📰 " +
            item.source +
            "  •  🏷 " +
            item.category +
            (
                dateText
                    ? "  •  🕐 " + dateText
                    : ""
            );


        card.appendChild(meta);


        if(item.summary){

            const summary =
                document.createElement(
                    "div"
                );


            summary.className =
                "news-summary";


            summary.textContent =
                "📝 " +
                item.summary;


            card.appendChild(summary);

        }


        if(
            item.link &&
            item.link !== "#"
        ){

            card.style.cursor =
                "pointer";


            card.addEventListener(
                "click",
                function(event){

                    if(
                        event.target.closest("a")
                    ){

                        return;

                    }


                    window.open(
                        item.link,
                        "_blank",
                        "noopener"
                    );

                }
            );

        }


        list.appendChild(card);

    });

}

function rubikaFooter(){

/* =========================================================
   RUBIKA TEXT
========================================================= */

function createRubikaText(){

    const NL = "\n";

    const items =
        getVisibleNews();


    if(!items.length){

        return [
            rubikaHeader(),
            "",
            "📭 در حال حاضر خبری برای انتشار وجود ندارد.",
            "",
            rubikaFooter()

        ].join(NL);

    }


    const parts = [

        rubikaHeader(),

        ""

    ];


    items.forEach(function(item,index){

        parts.push(

            "🔴 " +
            toPersianDigits(
                index + 1
            ) +
            ". " +
            item.title

        );


        parts.push(

            "   📰 " +
            item.source +
            "  •  🏷 " +
            item.category

        );


        if(item.summary){

            parts.push(

                "   📝 " +
                item.summary

            );

        }


        parts.push("");

        parts.push(
            "──────────────────────────"
        );

        parts.push("");

    });


    parts.push(
        rubikaFooter()
    );


    return parts.join(NL);

}


/* =========================================================
   COPY
========================================================= */

async function copyForRubika(){

    const text =
        createRubikaText();


    try{

        /*
         * روش استاندارد
         */

        if(
            navigator.clipboard &&
            window.ClipboardItem
        ){

            const blob =
                new Blob(
                    [text],
                    {
                        type:
                            "text/plain"
                    }
                );


            const item =
                new ClipboardItem({

                    "text/plain":
                        blob

                });


            await navigator.clipboard.write([
                item
            ]);


            showToast(
                "✅ متن اخبار برای روبیکا کپی شد."
            );

            return;

        }


        /*
         * روش دوم
         */

        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                text
            );


            showToast(
                "✅ متن اخبار برای روبیکا کپی شد."
            );

            return;

        }


        throw new Error(
            "Clipboard unavailable"
        );


    }catch(error){

        /*
         * روش جایگزین برای موبایل
         */

        try{

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                text;


            textarea.style.position =
                "fixed";

            textarea.style.opacity =
                "0";

            textarea.style.pointerEvents =
                "none";


            document.body.appendChild(
                textarea
            );


            textarea.focus();

            textarea.select();


            const success =
                document.execCommand(
                    "copy"
                );


            textarea.remove();


            if(success){

                showToast(
                    "✅ متن اخبار برای روبیکا کپی شد."
                );

            }else{

                throw new Error(
                    "Copy failed"
                );

            }

        }catch(error2){

            console.error(
                error2
            );


            showToast(
                "❌ کپی خودکار انجام نشد؛ متن را دستی انتخاب کنید."
            );

        }

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){
        return;
    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}
