<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#263238"
>

<title>انتخاب اخبار روبیکا | دیار قدمگاه</title>

<style>

* {
    box-sizing: border-box;
}

html {
    direction: rtl;
}

body {
    margin: 0;
    padding: 0;
    background: #f4f6f7;
    color: #263238;
    font-family: Tahoma, Arial, sans-serif;
    line-height: 1.8;
}

button,
select,
input,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: min(1100px, calc(100% - 24px));
    margin: 0 auto;
}

/* =========================
   HEADER
========================= */

.site-header {
    background:
        linear-gradient(
            135deg,
            #263238,
            #37474f
        );
    color: #fff;
    padding: 22px 16px;
    box-shadow:
        0 3px 12px rgba(0,0,0,.16);
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    text-align: center;
}

.header-title {
    font-size: 24px;
    font-weight: bold;
    margin: 0;
}

.header-subtitle {
    margin-top: 5px;
    font-size: 13px;
    opacity: .88;
}

/* =========================
   MAIN
========================= */

main {
    padding: 18px 0 35px;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 16px;
}

.stat {
    background: #fff;
    border-radius: 14px;
    padding: 13px 8px;
    text-align: center;
    box-shadow:
        0 2px 8px rgba(0,0,0,.07);
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
    color: #263238;
}

.stat-label {
    font-size: 11px;
    color: #607d8b;
}

/* =========================
   CONTROL BOX
========================= */

.control-box {
    background: #fff;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 16px;
    box-shadow:
        0 2px 9px rgba(0,0,0,.07);
}

.control-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* =========================
   CATEGORY BUTTONS
========================= */

.category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.category-btn {
    border: 1px solid #cfd8dc;
    background: #fff;
    color: #455a64;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    transition: .2s;
}

.category-btn:hover {
    background: #eceff1;
}

.category-btn.active {
    background: #263238;
    color: #fff;
    border-color: #263238;
}

.category-count {
    opacity: .8;
    margin-right: 3px;
}

/* =========================
   COUNT
========================= */

.count-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.count-row label {
    font-size: 13px;
    font-weight: bold;
}

#newsCount {
    border: 1px solid #cfd8dc;
    background: #fff;
    border-radius: 9px;
    padding: 8px 12px;
    color: #263238;
    outline: none;
}

/* =========================
   ACTION BUTTONS
========================= */

.action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 13px;
}

.action-btn {
    border: none;
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 12px;
    font-weight: bold;
}

.btn-select {
    background: #e8f5e9;
    color: #2e7d32;
}

.btn-clear {
    background: #ffebee;
    color: #c62828;
}

.btn-refresh {
    background: #eceff1;
    color: #37474f;
}

.btn-copy {
    background: #263238;
    color: #fff;
}

.action-btn:active {
    transform: scale(.98);
}

/* =========================
   SELECTION INFO
========================= */

.selection-info {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f5f7f8;
    border-radius: 10px;
    font-size: 12px;
    color: #455a64;
}

/* =========================
   NEWS LIST
========================= */

.news-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.news-card {
    background: #fff;
    border-radius: 15px;
    padding: 13px;
    box-shadow:
        0 2px 8px rgba(0,0,0,.07);
    border: 2px solid transparent;
    transition: .2s;
}

.news-card.selected {
    border-color: #607d8b;
    background: #fafcfd;
}

.news-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.news-checkbox {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    margin-top: 3px;
    accent-color: #263238;
}

.news-content {
    min-width: 0;
    flex: 1;
}

.news-title {
    font-size: 15px;
    font-weight: bold;
    color: #263238;
    margin: 0;
    line-height: 1.8;
}

.news-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
}

.meta-item {
    background: #f1f3f4;
    color: #546e7a;
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 10px;
}

.news-summary {
    margin-top: 8px;
    font-size: 12px;
    color: #607d8b;
    line-height: 1.9;
}

.news-link {
    display: inline-block;
    margin-top: 8px;
    color: #1565c0;
    font-size: 11px;
    text-decoration: none;
    font-weight: bold;
}

.news-link:hover {
    text-decoration: underline;
}

/* =========================
   EMPTY / LOADING
========================= */

.status-box {
    background: #fff;
    border-radius: 15px;
    padding: 25px 15px;
    text-align: center;
    color: #607d8b;
    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.loading {
    font-size: 14px;
}

.error {
    color: #c62828;
}

/* =========================
   PUBLISHER
========================= */

.publisher-box {
    margin-top: 18px;
}

.field {
    margin-bottom: 12px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
}

.field input {
    width: 100%;
    border: 1px solid #cfd8dc;
    border-radius: 9px;
    padding: 9px 10px;
    outline: none;
    direction: rtl;
}

.field input:focus {
    border-color: #607d8b;
}

/* =========================
   PREVIEW
========================= */

.preview-box {
    margin-top: 18px;
}

.preview-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

#preview {
    width: 100%;
    min-height: 480px;
    resize: vertical;
    border: 1px solid #cfd8dc;
    border-radius: 12px;
    padding: 13px;
    background: #fff;
    color: #263238;
    direction: rtl;
    text-align: right;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.9;
    outline: none;
}

.preview-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 9px;
}

/* =========================
   FOOTER
========================= */

.site-footer {
    text-align: center;
    padding: 20px 10px 30px;
    color: #78909c;
    font-size: 11px;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform:
        translateX(-50%)
        translateY(120px);

    background: #263238;
    color: #fff;

    padding: 10px 16px;
    border-radius: 10px;

    font-size: 12px;
    max-width: calc(100% - 30px);

    box-shadow:
        0 4px 15px rgba(0,0,0,.22);

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .25s,
        transform .25s;

    z-index: 9999;
}

.toast.show {
    opacity: 1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .header-title {
        font-size: 28px;
    }

    .news-title {
        font-size: 16px;
    }

    .news-card {
        padding: 15px;
    }

}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 420px) {

    .container {
        width: min(
            100% - 14px,
            1100px
        );
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 9px 4px;
    }

    .stat-number {
        font-size: 18px;
    }

    .stat-label {
        font-size: 9px;
    }

    .category-btn {
        padding: 6px 9px;
        font-size: 11px;
    }

    .action-btn {
        flex: 1 1 auto;
    }

}

</style>

</head>


<body>

<header class="site-header">

    <div class="header-inner">

        <h1 class="header-title">
            📰 اخبار روبیکا | دیار قدمگاه
        </h1>

        <div class="header-subtitle">
            انتخاب و آماده‌سازی اخبار برای انتشار در روبیکا
        </div>

    </div>

</header>


<main>

<div class="container">


    <!-- =========================
         STATS
    ========================== -->

    <section class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totalCount"
            >
                ۰
            </div>

            <div class="stat-label">
                کل اخبار
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="categoryCount"
            >
                ۰
            </div>

            <div class="stat-label">
                این دسته
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="selectedCount"
            >
                ۰
            </div>

            <div class="stat-label">
                انتخاب‌شده
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="displayCount"
            >
                ۰
            </div>

            <div class="stat-label">
                در حال نمایش
            </div>

        </div>

    </section>


    <!-- =========================
         CONTROLS
    ========================== -->

    <section class="control-box">

        <div class="control-title">

        <div

        <div class="count-row">

            <select id="newsCount">

                <option value="5">
                    ۵ خبر

                <option value="10" selected>

                <option value="15">

                <option value="20">

        <div class="action-row">

            <button

        <div

    <!-- =========================

    <!-- =========================

    ========================== -->

    <section class="control-box preview-box">

        <div class="preview-title">
            👁️ پیش‌نمایش متن آماده انتشار در روبیکا

        <div class="preview-actions">

                class="action-btn btn-copy"

</main>


<footer class="site-footer">

    🏡 دیار قدمگاه
    <br>
    اخبار ایران و جهان

</footer>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   CONSTANTS
========================================================= */

const SUMMARY_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";

const RUBIKA_PAGE_URL =
    "https://maghool51.github.io/diyar-widgets/diyar-news/news.html";

const MAX_SUMMARY_LENGTH = 150;

const DEFAULT_NEWS_COUNT = 10;

const ADMIN_STORAGE_KEY =
    "diyarRubikaPublisherV1";

const DEFAULT_ADMIN_NAME =
    "ادمین";

const DEFAULT_ADMIN_RUBIKA =
    "";


/* =========================================================
   CATEGORIES
========================================================= */

const CATEGORY_LIST = [

    {
        id: "all",
        title: "همه"
    },

    {
        id: "سیاسی",
        title: "سیاسی"
    },

    {
        id: "بین‌الملل",
        title: "بین‌الملل"
    },

    {
        id: "اقتصادی",
        title: "اقتصادی"
    },

    {
        id: "اجتماعی",
        title: "اجتماعی"
    },

    {
        id: "ورزشی",
        title: "ورزشی"
    },

    {
        id: "علمی و فناوری",
        title: "علمی و فناوری"
    },

    {
        id: "فرهنگی و هنری",
        title: "فرهنگی و هنری"
    },

    {
        id: "متفرقه",
        title: "متفرقه"
    }

];


/* =========================================================
   STATE
========================================================= */

let allNews = [];

let currentCategory = "all";

let newsCountSetting =
    DEFAULT_NEWS_COUNT;

let selectedKeys = new Set();

let publisherName =
    DEFAULT_ADMIN_NAME;

let publisherRubika =
    DEFAULT_ADMIN_RUBIKA;


/* =========================================================
   DOM
========================================================= */

const categoryButtons =
    document.getElementById(
        "categoryButtons"
    );

const newsContainer =
    document.getElementById(
        "newsContainer"
    );

const newsCount =
    document.getElementById(
        "newsCount"
    );

const selectAllBtn =
    document.getElementById(
        "selectAllBtn"
    );

const clearAllBtn =
    document.getElementById(
        "clearAllBtn"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );

const copyBtn =
    document.getElementById(
        "copyBtn"
    );

const preview =
    document.getElementById(
        "preview"
    );

const publisherNameInput =
    document.getElementById(
        "publisherName"
    );

const publisherRubikaInput =
    document.getElementById(
        "publisherRubika"
    );


/* =========================================================
   PERSIAN DIGITS
========================================================= */

function toPersianDigits(value) {

    return String(value)
        .replace(
            /\d/g,
            digit =>
                "۰۱۲۳۴۵۶۷۸۹"[digit]
        );
}


/* =========================================================
   TEXT CLEANING
========================================================= */

function decodeHtmlEntities(text) {

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.innerHTML =
        String(text || "");

    return textarea.value;
}


function cleanText(text) {

    return decodeHtmlEntities(
        String(text || "")
    )
        .replace(
            /<[^>]*>/g,
            " "
        )
        .replace(
            /[\r\n\t]+/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


function cleanSummary(text) {

    let result =
        cleanText(text);

    if (!result) {
        return "";
    }

    if (
        result.length >
        MAX_SUMMARY_LENGTH
    ) {

        result =
            result.substring(
                0,
                MAX_SUMMARY_LENGTH
            );

        const lastSpace =
            result.lastIndexOf(" ");

        if (
            lastSpace >
            MAX_SUMMARY_LENGTH * 0.7
        ) {

            result =
                result.substring(
                    0,
                    lastSpace
                );

        }

        result += "…";
    }

    return result;
}


/* =========================================================
   URL SAFETY
========================================================= */

function isSafeHttpUrl(url) {

    try {

        const parsed =
            new URL(
                String(url || "")
            );

        return (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        );

    } catch {

        return false;

    }
}


/* =========================================================
   RUBIKA URL
========================================================= */

function normalizeRubikaUrl(url) {

    const value =
        String(url || "")
            .trim();

    if (!value) {
        return "";
    }

    if (
        !/^https?:\/\//i.test(value)
    ) {
        return "";
    }

    if (
        !/^https?:\/\/(www\.)?rubika\.ir(\/|$)/i.test(
            value
        )
    ) {
        return "";
    }

    return value;
}


/* =========================================================
   PUBLISHER
========================================================= */

function sanitizePublisherName(name) {

    let value =
        cleanText(name);

    if (!value) {
        return DEFAULT_ADMIN_NAME;
    }

    return value.substring(
        0,
        60
    );
}


function loadPublisherSettings() {

    try {

        const raw =
            localStorage.getItem(
                ADMIN_STORAGE_KEY
            );

        if (!raw) {
            return;
        }

        const data =
            JSON.parse(raw);

        publisherName =
            sanitizePublisherName(
                data.name
            );

        publisherRubika =
            normalizeRubikaUrl(
                data.rubika
            );

    } catch {

        publisherName =
            DEFAULT_ADMIN_NAME;

        publisherRubika =
            DEFAULT_ADMIN_RUBIKA;

    }


    publisherNameInput.value =
        publisherName;

    publisherRubikaInput.value =
        publisherRubika;
}


function savePublisherSettings() {

    publisherName =
        sanitizePublisherName(
            publisherNameInput.value
        );

    publisherRubika =
        normalizeRubikaUrl(
            publisherRubikaInput.value
        );


    publisherNameInput.value =
        publisherName;

    publisherRubikaInput.value =
        publisherRubika;


    try {

        localStorage.setItem(
            ADMIN_STORAGE_KEY,
            JSON.stringify({
                name: publisherName,
                rubika: publisherRubika
            })
        );

    } catch {
        /* localStorage unavailable */
    }


    updatePreview();
}


/* =========================================================
   NEWS KEY
========================================================= */

function getItemKey(item) {

    const link =
        cleanText(item.link);

    if (link) {
        return "link:" + link;
    }

    const title =
        cleanText(item.title);

    const date =
        cleanText(item.date);

    return (
        "title:" +
        title +
        "|" +
        date
    );
}


/* =========================================================
   FILTER
========================================================= */

function getFilteredNews() {

    if (
        currentCategory ===
        "all"
    ) {

        return [
            ...allNews
        ];

    }

    return allNews.filter(
        item =>
            cleanText(
                item.category
            ) ===
            currentCategory
    );
}


function getDisplayedNews() {

    const filtered =
        getFilteredNews();

    if (
        newsCountSetting ===
        "all"
    ) {

        return filtered;

    }

    return filtered.slice(
        0,
        Number(
            newsCountSetting
        )
    );
}


/* =========================================================
   PUBLISH NEWS
========================================================= */

function getPublishNews() {

    return allNews.filter(
        item => {

            const key =
                getItemKey(item);

            return (
                key &&
                selectedKeys.has(key)
            );

        }
    );

}


/* =========================================================
   CATEGORY COUNTS
========================================================= */

function getCategoryCount(
    category
) {

    if (
        category === "all"
    ) {

        return allNews.length;

    }

    return allNews.filter(
        item =>
            cleanText(
                item.category
            ) === category
    ).length;

}


/* =========================================================
   BUILD CATEGORY BUTTONS
========================================================= */

function buildCategoryButtons() {

    categoryButtons.innerHTML = "";


    CATEGORY_LIST.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "category-btn" +
                (
                    category.id ===
                    currentCategory
                        ? " active"
                        : ""
                );


            const count =
                getCategoryCount(
                    category.id
                );


            button.textContent =
                category.title +
                " (" +
                toPersianDigits(
                    count
                ) +
                ")";


            button.addEventListener(
                "click",
                () => {

                    currentCategory =
                        category.id;

                    buildCategoryButtons();

                    renderAll();

                }
            );


            categoryButtons.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   SAFE ELEMENT TEXT
========================================================= */

function setText(
    element,
    text
) {

    element.textContent =
        cleanText(text);

}


/* =========================================================
   IS NEW NEWS
========================================================= */

function isNewNews(item) {

    if (!item.date) {
        return false;
    }

    const date =
        new Date(
            item.date
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return false;
    }

    const age =
        Date.now() -
        date.getTime();

    return (
        age >= 0 &&
        age <
        6 * 60 * 60 * 1000
    );
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatNewsDate(
    value
) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }


    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return "";

    }
}


/* =========================================================
   FORMAT PERSIAN DATE/TIME
========================================================= */

function formatPersianDate(
    date
) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year: "numeric",
                month: "numeric",
                day: "numeric"
            }
        ).format(date);

    } catch {

        return "";

    }
}


function formatPersianTime(
    date
) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return "";

    }
}


/* =========================================================
   RENDER NEWS
========================================================= */

function renderNews() {

    const displayedNews =
        getDisplayedNews();


    newsContainer.innerHTML = "";


    if (
        !displayedNews.length
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "status-box";

        empty.textContent =
            "ℹ️ در این دسته خبری وجود ندارد.";

        newsContainer.appendChild(
            empty
        );

        return;

    }


    const list =
        document.createElement(
            "div"
        );

    list.className =
        "news-list";


    displayedNews.forEach(
        item => {

            const key =
                getItemKey(item);

            const selected =
                selectedKeys.has(key);


            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "news-card" +
                (
                    selected
                        ? " selected"
                        : ""
                );


            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "news-top";


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "news-checkbox";

            checkbox.checked =
                selected;

            checkbox.setAttribute(
                "aria-label",
                "انتخاب خبر"
            );


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        selectedKeys.add(
                            key
                        );

                    } else {

                        selectedKeys.delete(
                            key
                        );

                    }


                    renderAll();

                }
            );


            top.appendChild(
                checkbox
            );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "news-content";


            const title =
                document.createElement(
                    "h2"
                );

            title.className =
                "news-title";

            setText(
                title,
                item.title
            );


            content.appendChild(
                title
            );


            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "news-meta";


            if (item.source) {

                const source =
                    document.createElement(
                        "span"
                    );

                source.className =
                    "meta-item";

                source.textContent =
                    "📰 " +
                    cleanText(
                        item.source
                    );

                meta.appendChild(
                    source
                );

            }


            if (item.category) {

                const category =
                    document.createElement(
                        "span"
                    );

                category.className =
                    "meta-item";

                category.textContent =
                    "🏷 " +
                    cleanText(
                        item.category
                    );

                meta.appendChild(
                    category
                );

            }


            if (item.date) {

                const date =
                    formatNewsDate(
                        item.date
                    );

                if (date) {

                    const dateElement =
                        document.createElement(
                            "span"
                        );

                    dateElement.className =
                        "meta-item";

                    dateElement.textContent =
                        "🕐 " +
                        date;

                    meta.appendChild(
                        dateElement
                    );

                }

            }


            if (
                isNewNews(item)
            ) {

                const newBadge =
                    document.createElement(
                        "span"
                    );

                newBadge.className =
                    "meta-item";

                newBadge.textContent =
                    "🆕 جدید";

                meta.appendChild(
                    newBadge
                );

            }


            content.appendChild(
                meta
            );


            const summary =
                cleanSummary(
                    item.summary
                );


            if (summary) {

                const summaryElement =
                    document.createElement(
                        "div"
                    );

                summaryElement.className =
                    "news-summary";

                summaryElement.textContent =
                    "📝 " +
                    summary;

                content.appendChild(
                    summaryElement
                );

            }


            if (
                isSafeHttpUrl(
                    item.link
                )
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "news-link";

                link.href =
                    item.link;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    "🔗 مشاهده متن کامل خبر";

                content.appendChild(
                    link
                );

            }


            top.appendChild(
                content
            );


            card.appendChild(
                top
            );


            list.appendChild(
                card
            );

        }
    );


    newsContainer.appendChild(
        list
    );

}


/* =========================================================
   SELECTION INFO
========================================================= */

function updateSelectionInfo() {

    const selectedTotal =
        selectedKeys.size;

    const current =
        getFilteredNews();


    const selectedCurrent =
        current.filter(
            item =>
                selectedKeys.has(
                    getItemKey(item)
                )
        ).length;


    document.getElementById(
        "selectedCount"
    ).textContent =
        toPersianDigits(
            selectedTotal
        );


    const info =
        document.getElementById(
            "selectionInfo"
        );


    if (!selectedTotal) {

        info.textContent =
            "هیچ خبری انتخاب نشده است.";

        return;

    }


    info.textContent =
        "✅ " +
        toPersianDigits(
            selectedTotal
        ) +
        " خبر در مجموع انتخاب شده است؛ " +
        toPersianDigits(
            selectedCurrent
        ) +
        " خبر از دسته فعلی.";

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats() {

    const filtered =
        getFilteredNews();

    const displayed =
        getDisplayedNews();


    document.getElementById(
        "totalCount"
    ).textContent =
        toPersianDigits(
            allNews.length
        );


    document.getElementById(
        "categoryCount"
    ).textContent =
        toPersianDigits(
            filtered.length
        );


    document.getElementById(
        "displayCount"
    ).textContent =
        toPersianDigits(
            displayed.length
        );


    updateSelectionInfo();

}


/* =========================================================
   RUBIKA HEADER
========================================================= */

function rubikaHeader(
    publishNews
) {

    const now =
        new Date();


    let text = "";


    text +=
        "╔══════════════════════════╗\n";


    text +=
        "     🌸🕌💫 اخبار دیار قدمگاه 💫🕌🌸\n\n";


    text +=
        "        📅 " +
        formatPersianDate(now) +
        "\n";


    text +=
        "             🕐 " +
        formatPersianTime(now) +
        "\n\n";


    text +=
        "╚══════════════════════════╝\n\n";


    return text;

}


/* =========================================================
   RUBIKA FOOTER
========================================================= */

function rubikaFooter() {

    let text = "";


    text += "\n";


    text +=
        "╔══════════════════════════╗\n";


    text +=
        "          📖 متن کامل اخبار\n\n";


    text +=
        "       🔗 مشاهده و مطالعه خبرها:\n";


    text +=
        "       " +
        RUBIKA_PAGE_URL +
        "\n\n";


    text +=
        "╚══════════════════════════╝\n\n";


    text +=
        "🏡 دیار قدمگاه\n";

        publisherName;


    if (
        publisherRubika
    ) {

        text +=
            "\n🔗 " +

    }

}


/* =========================================================
   CREATE RUBIKA TEXT
========================================================= */

function createRubikaText() {

    const publishNews =
        getPublishNews();


    if (
        !publishNews.length
    ) {

        return (
            "🌸🕌💫 اخبار دیار قدمگاه 💫🕌🌸\n\n" +
            "هنوز خبری برای انتشار انتخاب نشده است."
        );

    }


    let text =
        rubikaHeader(
            publishNews
        );


    publishNews.forEach(
        (
            item,
            index
        ) => {

            const title =
                cleanText(
                    item.title
                );


            const source =
                cleanText(
                    item.source
                );


            const category =
                cleanText(
                    item.category
                );


            const summary =
                cleanSummary(
                    item.summary
                );


            /*
             * بدون شماره ردیف
             * فقط علامت 🔴
             */

            text +=
                "🔴 " +
                title +
                "\n";


            let meta = "";


            if (source) {

                meta +=
                    "   📰 " +
                    source;

            }


            if (category) {

                if (meta) {

                    meta +=
                        "  •  ";

                }


                meta +=
                    "🏷 " +
                    category;

            }


            if (meta) {

                text +=
                    meta +
                    "\n";

            }


            if (summary) {

                text +=
                    "   📝 " +
                    summary +
                    "\n";

            }


            /*
             * جداکننده بین خبرها
             */

            if (
                index <
                publishNews.length - 1
            ) {

                text +=
                    "\n" +
                    "──────────────────────────" +
                    "\n\n";

            }

        }
    );


    text +=
        rubikaFooter();


    return text;

}


/* =========================================================
   UPDATE PREVIEW
========================================================= */

function updatePreview() {

    preview.value =
        createRubikaText();

}


/* =========================================================
   SELECT ALL CURRENT CATEGORY
========================================================= */

function selectAllNews() {

    /*
     * بسیار مهم:
     *
     * فقط اخبار فیلتر فعلی انتخاب می‌شوند.
     *
     * اگر روی «همه» باشیم:
     * تمام اخبار انتخاب می‌شوند.
     *
     * اگر روی یک دسته باشیم:
     * فقط همان دسته انتخاب می‌شود.
     *
     * تعداد نمایش هیچ نقشی ندارد.
     */

    const targetNews =
        getFilteredNews();


    targetNews.forEach(
        item => {

            const key =
                getItemKey(item);

            if (key) {

                selectedKeys.add(
                    key
                );

            }

        }
    );


    renderAll();


    if (
        targetNews.length
    ) {

        showToast(
            "✅ " +
            toPersianDigits(
                targetNews.length
            ) +
            " خبر این دسته انتخاب شد."
        );

    } else {

        showToast(
            "ℹ️ در این دسته خبری وجود ندارد."
        );

    }

}


/* =========================================================
   CLEAR ALL CURRENT CATEGORY
========================================================= */

function clearAllNews() {

    /*
     * فقط اخبار دسته فعلی
     * از حالت انتخاب خارج می‌شوند.
     *
     * انتخاب‌های دسته‌های دیگر
     * دست‌نخورده باقی می‌مانند.
     */

    const targetNews =
        getFilteredNews();


    targetNews.forEach(
        item => {

            const key =
                getItemKey(item);

            if (key) {

                selectedKeys.delete(
                    key
                );

            }

        }
    );


    renderAll();


    showToast(
        "⬜ انتخاب اخبار این دسته لغو شد."
    );

}


/* =========================================================
   COPY FALLBACK
========================================================= */

function fallbackCopy(
    text
) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";

    textarea.style.opacity =
        "0";

    textarea.style.left =
        "-9999px";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    let success =
        false;


    try {

        success =
            document.execCommand(
                "copy"
            );

    } catch {

        success =
            false;

    }


    document.body.removeChild(
        textarea
    );


    return success;

}


/* =========================================================
   COPY RUBIKA TEXT
========================================================= */

async function copyRubikaText() {

    const text =
        createRubikaText();


    if (
        !text ||
        !getPublishNews().length
    ) {

        showToast(
            "ℹ️ ابتدا حداقل یک خبر را انتخاب کنید."
        );

        return;

    }


    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

            showToast(
                "✅ متن اخبار با موفقیت کپی شد."
            );

            return;

        }

    } catch {
        /* fallback */
    }


    if (
        fallbackCopy(text)
    ) {

        showToast(
            "✅ متن اخبار کپی شد."
        );

    } else {

        showToast(
            "❌ کپی خودکار انجام نشد؛ متن را از پیش‌نمایش کپی کنید."
        );

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2800
        );

}


/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews() {

    newsContainer.innerHTML =
        '<div class="status-box loading">⏳ در حال دریافت اخبار...</div>';


    try {

        const response =
            await fetch(
                SUMMARY_URL +
                (
                    SUMMARY_URL.includes("?")
                        ? "&"
                        : "?"
                ) +
                "_=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * news-summary.json
         * ساختار اصلی:
         *
         * {
         *   news: [...]
         * }
         */

        let news =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.news
                    )
                        ? data.news
                        : []
                );


        allNews =
            news.filter(
                item =>
                    item &&
                    cleanText(
                        item.title
                    )
            );


        /*
         * پاک‌سازی انتخاب‌های قبلی
         * فقط برای اخباری که دیگر وجود ندارند.
         */

        const validKeys =
            new Set(
                allNews.map(
                    getItemKey
                )
            );


        selectedKeys =
            new Set(
                [...selectedKeys]
                    .filter(
                        key =>
                            validKeys.has(
                                key
                            )
                    )
            );


        buildCategoryButtons();

        renderAll();

        showToast(
            "✅ اخبار بروزرسانی شد."
        );


    } catch (error) {

        console.error(
            "News loading error:",
            error
        );


        newsContainer.innerHTML =
            `
            <div class="status-box error">
                ❌ دریافت اخبار با خطا مواجه شد.
                <br>
                <small>
                    لطفاً چند لحظه بعد دوباره تلاش کنید.
                </small>
            </div>
            `;


        updateStats();

        updatePreview();

    }

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll() {

    buildCategoryButtons();

    renderNews();

    updateStats();

    updatePreview();

}
