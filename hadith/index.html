<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>ویجت حدیث روز | Diyar Widgets</title>
<meta name="description" content="ویجت مستقل و سبک حدیث روز — قابل استفاده در GitHub Pages، Blogfa و هر وب‌سایت دیگر." />

<!-- فونت فارسی وزیرمتن (اختیاری). بارگذاری غیرمسدودکننده برای رندر:
     media="print" + onload یک الگوی استاندارد است که stylesheet را در
     پس‌زمینه دانلود می‌کند بدون مسدودکردن First Paint. <noscript> برای
     مرورگرهای بدون جاوااسکریپت fallback مسدودکننده‌ی معمول را حفظ می‌کند. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
  media="print"
  onload="this.media='all'"
/>
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
</noscript>

<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#12695f" />
<link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png" />
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
<link rel="stylesheet" href="./widget.css" />
<link rel="stylesheet" href="./index.css" />
</head>
<body>

<!-- این صفحه عمداً فقط ویجت را نمایش می‌دهد (بدون تیتر/توضیحات توسعه‌دهنده)
     تا دقیقاً همان چیزی باشد که در جاسازی واقعی (iframe یا embed مستقیم)
     دیده می‌شود. راهنمای کامل جاسازی و کد نمونه در README.md و در
     embed.html (صفحه‌ی راهنمای بصری) موجود است. -->
<div id="diyar-hadith-widget"></div>

<!-- بارگذاری ماژول‌ها به همین ترتیب ضروری است (config قبل از بقیه).
     defer باعث دانلود موازی فایل‌ها می‌شود؛ اجرای هرکدام تا پایان
     HTML-parsing و به همان ترتیب نوشته‌شده به تعویق می‌افتد. کد
     راه‌اندازی درون DOMContentLoaded است چون defer روی اسکریپت
     درون‌خطی (بدون src) طبق مشخصات HTML بی‌اثر است. -->
<script src="./config.js" defer></script>
<script src="./core/storage.js" defer></script>
<script src="./core/cache.js" defer></script>
<script src="./core/utils.js" defer></script>
<script src="./widget.js" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    new DiyarHadithWidget().init();

    // ثبت Service Worker برای پشتیبانی کامل آفلاین (اختیاری و ایمن؛
    // در مرورگرهایی که پشتیبانی نمی‌کنند یا داخل iframe با محدودیت
    // اجرا می‌شوند، بی‌سروصدا نادیده گرفته می‌شود)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {
          // ثبت ناموفق (مثلاً به‌دلیل محدودیت iframe در Blogfa)؛ ویجت بدون آن هم کار می‌کند
        });
      });
    }
  });
</script>
</body>
</html>
