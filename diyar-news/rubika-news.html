<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انتخاب اخبار روبیکا | دیار قدمگاه</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    background: #f4f6f7;
    color: #263238;
    font-family: Tahoma, Arial, "Segoe UI", sans-serif;
    line-height: 1.8;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: wait;
    opacity: .65;
}

.container {
    width: min(1100px, calc(100% - 20px));
    margin: 12px auto 28px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    background: #263238;
    color: #fff;
    border-radius: 18px;
    padding: 20px 16px;
    text-align: center;
    box-shadow: 0 5px 18px rgba(0, 0, 0, .10);
}

.header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
}

.header p {
    margin: 6px 0 0;
    opacity: .9;
    font-size: 13px;
}

.header-date {
    opacity: .8 !important;
    font-size: 11px !important;
}

/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    margin: 12px 0;
}

.stat {
    background: #fff;
    border-radius: 14px;
    padding: 11px 8px;
    text-align: center;
    box-shadow: 0 2px 9px rgba(0, 0, 0, .06);
    border: 1px solid #e3e7e9;
}

.stat-number {
    display: block;
    font-size: 22px;
    font-weight: 800;
    color: #263238;
}

.stat-label {
    display: block;
    margin-top: 1px;
    color: #607078;
    font-size: 11px;
}

/* =========================================================
   PANEL
========================================================= */

.panel {
    background: #fff;
    border-radius: 17px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .06);
    border: 1px solid #e5e9eb;
}

.panel-title {
    margin: 0 0 11px;
    font-size: 16px;
    font-weight: 800;
}

/* =========================================================
   STATUS
========================================================= */

.status-box {
    margin-bottom: 12px;
    padding: 10px 13px;
    border-radius: 12px;
    background: #e8f5e9;
    color: #1b5e20;
    font-size: 12px;
    display: none;
}

.status-box.error {
    background: #ffebee;
    color: #b71c1c;
}

.status-box.loading {
    background: #e3f2fd;
    color: #0d47a1;
}

/* =========================================================
   CATEGORY
========================================================= */

.category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.category-btn {
    min-height: 43px;
    border: 1px solid #cfd8dc;
    background: #fff;
    color: #37474f;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    transition: .2s ease;
}

.category-btn:hover {
    background: #eceff1;
}

.category-btn.active {
    background: #263238;
    color: #fff;
    border-color: #263238;
}

.category-count {
    display: inline-block;
    margin-right: 4px;
    padding: 1px 6px;
    border-radius: 20px;
    background: #eceff1;
    color: #455a64;
    font-size: 10px;
}

.category-btn.active .category-count {
    background: rgba(255,255,255,.18);
    color: #fff;
}

.category-selected-count {
    display: inline-block;
    margin-right: 3px;
    padding: 1px 6px;
    border-radius: 20px;
    background: #e8f5e9;
    color: #2e7d32;
    font-size: 10px;
    font-weight: 800;
}

.category-btn.active .category-selected-count {
    background: rgba(255,255,255,.18);
    color: #fff;
}

.publisher-details {
    border: 1px solid #e5e9eb;
    border-radius: 12px;
    overflow: hidden;
}

.publisher-summary {
    cursor: pointer;
    padding: 11px 13px;
    font-size: 14px;
    font-weight: 800;
    user-select: none;
}

.publisher-details[open] .publisher-summary {
    border-bottom: 1px solid #e5e9eb;
}

.publisher-details .publisher-grid {
    padding: 12px;
}

/* =========================================================
   SEARCH
========================================================= */

.filter-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 205px;
    gap: 9px;
}

.search-wrap {
    position: relative;
}

.search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    pointer-events: none;
}

.search-input {
    width: 100%;
    min-height: 47px;
    border: 1px solid #cfd8dc;
    border-radius: 12px;
    padding: 9px 40px 9px 40px;
    outline: none;
    font-size: 13px;
    background: #fafbfc;
}

.search-input:focus {
    border-color: #607d8b;
    background: #fff;
}

.clear-search {
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #78909c;
    font-size: 17px;
    display: none;
}

.sort-select,
.count-select {
    width: 100%;
    min-height: 47px;
    border: 1px solid #cfd8dc;
    border-radius: 12px;
    background: #fafbfc;
    padding: 8px 11px;
    font-size: 12px;
    outline: none;
}

.filter-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 9px;
}

.only-selected-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 43px;
    padding: 7px 11px;
    border-radius: 11px;
    background: #f1f4f5;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    font-weight: 700;
}

.only-selected-label input {
    width: 19px;
    height: 19px;
    margin: 0;
    accent-color: #263238;
}

/* =========================================================
   ACTIONS
========================================================= */

.actions {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.action-btn {
    min-height: 47px;
    border: 0;
    border-radius: 12px;
    padding: 8px 9px;
    font-size: 12px;
    font-weight: 800;
    transition: .2s ease;
}

.action-primary {
    background: #263238;
    color: #fff;
}

.action-secondary {
    background: #eceff1;
    color: #37474f;
}

.action-danger {
    background: #ffebee;
    color: #b71c1c;
}

.action-refresh {
    background: #e8f5e9;
    color: #1b5e20;
}

.action-copy {
    background: #e3f2fd;
    color: #0d47a1;
}

/* =========================================================
   SELECTION INFO
========================================================= */

.selection-info {
    background: #f7f9fa;
    border: 1px dashed #cfd8dc;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12px;
    color: #455a64;
    margin-top: 10px;
}

.selection-summary-title {
    font-weight: 800;
    margin-bottom: 6px;
}

.selection-breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.selection-chip {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #dce2e5;
    font-size: 11px;
    color: #37474f;
}

/* =========================================================
   NEWS
========================================================= */

.news-list {
    display: grid;
    gap: 10px;
}

.news-card {
    background: #fff;
    border-radius: 15px;
    border: 1px solid #e0e5e7;
    padding: 12px;
    transition: .2s ease;
}

.news-card.selected {
    border-color: #607d8b;
    box-shadow: 0 3px 14px rgba(38,50,56,.10);
    background: #fafcfd;
}

.news-card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.news-checkbox {
    width: 22px;
    height: 22px;
    margin-top: 2px;
    flex: 0 0 auto;
    accent-color: #263238;
    cursor: pointer;
}

.news-content {
    flex: 1;
    min-width: 0;
}

.news-title {
    margin: 0;
    font-size: 15px;
    line-height: 1.8;
    font-weight: 800;
    color: #263238;
}

.news-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
}

.meta-chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 7px;
    border-radius: 999px;
    background: #f1f3f4;
    color: #546e7a;
    font-size: 10px;
}

.news-summary {
    margin: 8px 0 0;
    color: #455a64;
    font-size: 12px;
    line-height: 1.9;
}

.news-date {
    margin-top: 5px;
    color: #78909c;
    font-size: 10px;
}

.news-link {
    display: inline-block;
    margin-top: 7px;
    color: #1565c0;
    font-size: 11px;
    font-weight: 800;
    text-decoration: none;
}

.news-link:hover {
    text-decoration: underline;
}

.new-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 6px;
    background: #ffebee;
    color: #c62828;
    font-size: 9px;
    font-weight: 800;
}

.empty-state {
    background: #fff;
    border-radius: 15px;
    padding: 28px 14px;
    text-align: center;
    color: #78909c;
    border: 1px dashed #cfd8dc;
    font-size: 13px;
}

/* =========================================================
   PUBLISHER
========================================================= */

.publisher-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.field-label {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 800;
    color: #455a64;
}

.text-input {
    width: 100%;
    min-height: 45px;
    border: 1px solid #cfd8dc;
    border-radius: 11px;
    padding: 8px 11px;
    font-size: 12px;
    outline: none;
    background: #fafbfc;
}

.text-input:focus {
    border-color: #607d8b;
    background: #fff;
}

/* =========================================================
   PREVIEW
========================================================= */

.preview {
    width: 100%;
    min-height: 400px;
    resize: vertical;
    border: 1px solid #cfd8dc;
    border-radius: 13px;
    padding: 12px;
    background: #fafbfc;
    color: #263238;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 12px;
    line-height: 1.9;
    direction: rtl;
    text-align: right;
    outline: none;
}

.preview:focus {
    border-color: #607d8b;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 14px;
    background: #263238;
    color: #fff;
    border-radius: 15px;
    padding: 14px;
    text-align: center;
    font-size: 11px;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;
    right: 50%;
    bottom: 18px;
    transform: translateX(50%) translateY(120px);
    max-width: min(92vw, 520px);
    background: #263238;
    color: #fff;
    padding: 11px 16px;
    border-radius: 12px;
    box-shadow: 0 6px 25px rgba(0,0,0,.20);
    font-size: 12px;
    text-align: center;
    z-index: 9999;
    opacity: 0;
    transition: .25s ease;
    pointer-events: none;
}

.toast.show {
    transform: translateX(50%) translateY(0);
    opacity: 1;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 850px) {

    .actions {
        grid-template-columns: repeat(2, 1fr);
    }

    .action-copy {
        grid-column: 1 / -1;
    }
}

@media (max-width: 650px) {

    .container {
        width: calc(100% - 10px);
        margin-top: 5px;
    }

    .header {
        border-radius: 14px;
        padding: 17px 11px;
    }

    .header h1 {
        font-size: 20px;
    }

    .header p {
        font-size: 11px;
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 9px 5px;
    }

    .stat-number {
        font-size: 19px;
    }

    .stat-label {
        font-size: 9px;
    }

    .panel {
        border-radius: 14px;
        padding: 11px;
    }

    .filter-grid {
        grid-template-columns: 1fr;
    }

    .publisher-grid {
        grid-template-columns: 1fr;
    }

    .category-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }

    .category-btn {
        width: 100%;
        border-radius: 11px;
        padding: 8px 5px;
    }

    .actions {
        grid-template-columns: 1fr 1fr;
    }

    .action-btn {
        min-height: 50px;
        font-size: 11px;
    }

    .action-copy {
        grid-column: 1 / -1;
    }

    .news-card {
        padding: 11px;
    }

    .news-title {
        font-size: 13px;
    }

    .news-summary {
        font-size: 11px;
    }

    .filter-options {
        display: grid;
        grid-template-columns: 1fr;
    }

    .count-select {
        max-width: none !important;
    }

    .preview {
        min-height: 360px;
    }
}

@media (max-width: 420px) {

    .category-buttons {
        grid-template-columns: 1fr 1fr;
    }

    .selection-chip {
        font-size: 10px;
    }

    .only-selected-label {
        width: 100%;
        justify-content: center;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <h1>📰 اخبار روبیکا | دیار قدمگاه</h1>

        <p>
            انتخاب و آماده‌سازی اخبار برای انتشار در روبیکا
        </p>

        <p
            id="headerDate"
            class="header-date"
        ></p>

    </header>

    <!-- =====================================================
         STATS
    ====================================================== -->

    <div class="stats">

        <div class="stat">
            <span
                class="stat-number"
                id="totalCount"
            >۰</span>

            <span class="stat-label">
                کل اخبار
            </span>
        </div>

        <div class="stat">
            <span
                class="stat-number"
                id="categoryCount"
            >۰</span>

            <span class="stat-label">
                این دسته
            </span>
        </div>

        <div class="stat">
            <span
                class="stat-number"
                id="selectedCount"
            >۰</span>

            <span class="stat-label">
                انتخاب‌شده
            </span>
        </div>

        <div class="stat">
            <span
                class="stat-number"
                id="displayCount"
            >۰</span>

            <span class="stat-label">
                در حال نمایش
            </span>
        </div>

    </div>

    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="statusBox"
        class="status-box"
    ></div>

    <!-- =====================================================
         CATEGORY
    ====================================================== -->

    <section class="panel">

        <h2 class="panel-title">
            🏷 انتخاب دسته خبری
        </h2>

        <div
            id="categoryButtons"
            class="category-buttons"
        ></div>

    </section>

    <!-- =====================================================
         SEARCH / FILTER
    ====================================================== -->

    <section class="panel">

        <h2 class="panel-title">
            🔍 جستجو و فیلتر اخبار
        </h2>

        <div class="filter-grid">

            <div class="search-wrap">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    id="searchInput"
                    class="search-input"
                    type="search"
                    inputmode="search"
                    autocomplete="off"
                    placeholder="جستجو در عنوان، منبع یا دسته خبر..."
                    aria-label="جستجو در اخبار"
                >

                <button
                    id="clearSearchBtn"
                    class="clear-search"
                    type="button"
                    aria-label="پاک کردن جستجو"
                >✕</button>

            </div>

            <select
                id="sortSelect"
                class="sort-select"
                aria-label="مرتب‌سازی اخبار"
            >

                <option value="newest">
                    🕐 جدیدترین‌ها
                </option>

                <option value="oldest">
                    🕐 قدیمی‌ترین‌ها
                </option>

                <option value="selected">
                    ☑️ انتخاب‌شده‌ها در ابتدا
                </option>

            </select>

        </div>

        <div class="filter-options">

            <label class="only-selected-label">

                <input
                    type="checkbox"
                    id="onlySelected"
                >

                ☑️ فقط خبرهای انتخاب‌شده

            </label>

            <select
                id="newsCount"
                class="count-select"
                style="max-width:220px;"
            >

                <option value="5">
                    نمایش ۵ خبر
                </option>

                <option value="10" selected>
                    نمایش ۱۰ خبر
                </option>

                <option value="15">
                    نمایش ۱۵ خبر
                </option>

                <option value="20">
                    نمایش ۲۰ خبر
                </option>

                <option value="all">
                    نمایش همه
                </option>

            </select>

        </div>

    </section>

    <!-- =====================================================
         ACTIONS
    ====================================================== -->

    <section class="panel">

        <h2 class="panel-title">
            ☑️ مدیریت انتخاب‌ها
        </h2>

        <div class="actions">

            <button
                id="selectAllBtn"
                class="action-btn action-primary"
                type="button"
            >
                ☑️ انتخاب همه این دسته
            </button>

            <button
                id="clearAllBtn"
                class="action-btn action-secondary"
                type="button"
            >
                ⬜ لغو انتخاب این دسته
            </button>

            <button
                id="clearEverythingBtn"
                class="action-btn action-danger"
                type="button"
            >
                🧹 لغو انتخاب همه
            </button>

            <button
                id="refreshBtn"
                class="action-btn action-refresh"
                type="button"
            >
                🔄 بروزرسانی
            </button>

            <button
                id="copyBtn"
                class="action-btn action-copy"
                type="button"
            >
                📋 کپی متن روبیکا
            </button>

        </div>

        <div
            id="selectionInfo"
            class="selection-info"
        >
            هیچ خبری انتخاب نشده است.
        </div>

    </section>

    <!-- =====================================================
         NEWS
    ====================================================== -->

    <section class="panel">

        <h2 class="panel-title">
            📰 فهرست اخبار
        </h2>

        <div
            id="newsContainer"
            class="news-list"
        ></div>

    </section>

    <!-- =====================================================
         PUBLISHER
    ====================================================== -->

    <section class="panel">

        <details class="publisher-details">

            <summary class="publisher-summary">
                👤 مشخصات منتشرکننده
            </summary>

            <div class="publisher-grid">

            <div>

                <label
                    class="field-label"
                    for="publisherName"
                >
                    نام منتشرکننده
                </label>

                <input
                    id="publisherName"
                    class="text-input"
                    type="text"
                    maxlength="60"
                    placeholder="مثلاً ادمین"
                >

            </div>

            <div>

                <label
                    class="field-label"
                    for="publisherRubika"
                >
                    لینک روبیکا
                </label>

                <input
                    id="publisherRubika"
                    class="text-input"
                    type="url"
                    placeholder="https://rubika.ir/..."
                >

            </div>

            </div>

        </details>

    </section>

    <!-- =====================================================
         PREVIEW
    ====================================================== -->

    <section class="panel">

        <h2 class="panel-title">
            📋 پیش‌نمایش متن روبیکا
        </h2>

        <textarea
            id="preview"
            class="preview"
            readonly
            placeholder="پس از انتخاب خبرها، متن آماده انتشار در این قسمت نمایش داده می‌شود."
        ></textarea>

        <button
            id="copyBtnBottom"
            class="action-btn action-copy"
            type="button"
            style="width:100%;margin-top:9px;"
        >
            📋 کپی متن روبیکا
        </button>

    </section>

    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">
        🏡 دیار قدمگاه
    </footer>

</div>

<div
    id="toast"
    class="toast"
></div>

<script>
"use strict";

/* =========================================================
   تنظیمات اصلی
========================================================= */

/*
   مسیر اصلی:
   فایل news-summary.json در کنار همین فایل روی GitHub Pages
*/

const SUMMARY_URL =
    "./news-summary.json";

/*
   مسیر پشتیبان:
   اگر مسیر GitHub Pages به هر دلیل جواب نداد،
   از Raw GitHub استفاده می‌کنیم.
*/

const SUMMARY_FALLBACK_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";

const RUBIKA_PAGE_URL =
    "https://maghool51.github.io/diyar-widgets/diyar-news/news.html";

const MAX_SUMMARY_LENGTH = 150;

const DEFAULT_NEWS_COUNT = 10;

const ADMIN_STORAGE_KEY =
    "diyarRubikaPublisherV1";

const SELECTION_STORAGE_KEY =
    "diyarRubikaSelectedNewsV1";

const DEFAULT_ADMIN_NAME =
    "ادمین";

const DEFAULT_ADMIN_RUBIKA =
    "";

/* =========================================================
   دسته‌ها
========================================================= */

const CATEGORY_LIST = [

/* =========================================================
   ابزار متن
========================================================= */

function toPersianDigits(value) {

    return String(value ?? "")
        .replace(
            /\d/g,
            digit =>
                "۰۱۲۳۴۵۶۷۸۹"[digit]
        );
}

function decodeHtmlEntities(text) {

    if (!text) {
        return "";
    }

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.innerHTML =
        String(text);

    return textarea.value;
}

function cleanText(text) {

    if (
        text === null ||
        text === undefined
    ) {
        return "";
    }

    let result =
        decodeHtmlEntities(
            String(text)
        );

    result =
        result
            .replace(
                /<br\s*\/?>/gi,
                "\n"
            )
            .replace(
                /<\/p>/gi,
                "\n"
            )
            .replace(
                /<[^>]*>/g,
                " "
            )
            .replace(
                /\u200c+/g,
                "\u200c"
            )
            .replace(
                /[ \t]+/g,
                " "
            )
            .replace(
                /\n\s+/g,
                "\n"
            )
            .trim();

    return result;
}

function cleanSummary(text) {

    let result =
        cleanText(text);

    if (!result) {
        return "";
    }

    if (
        result.length >
        MAX_SUMMARY_LENGTH
    ) {

        result =
            result
                .slice(
                    0,
                    MAX_SUMMARY_LENGTH
                )
                .trim();

        const lastSpace =
            result.lastIndexOf(" ");

        if (lastSpace > 80) {

            result =
                result.slice(
                    0,
                    lastSpace
                );
        }

        result += "…";
    }

    return result;
}

/* =========================================================
   URL
========================================================= */

function isSafeHttpUrl(url) {

    if (!url) {
        return false;
    }

    try {

        const parsed =
            new URL(
                String(url).trim()
            );

        return (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        );

    } catch {

        return false;
    }
}

function normalizeRubikaUrl(url) {

    if (!url) {
        return "";
    }

    let value =
        String(url).trim();

    /*
       فقط https پذیرفته می‌شود؛
       اگر کاربر صراحتاً http:// وارد کرده، نامعتبر است.
    */

    if (
        /^http:\/\//i.test(value)
    ) {
        return "";
    }

    if (
        !/^https:\/\//i.test(value)
    ) {
        value =
            "https://" + value;
    }

    try {

        const parsed =
            new URL(value);

        if (
            parsed.protocol !== "https:"
        ) {
            return "";
        }

        const host =
            parsed.hostname
                .toLowerCase()
                .replace(
                    /^www\./,
                    ""
                );

        if (
            host !== "rubika.ir"
        ) {
            return "";
        }

        return parsed.toString();

    } catch {

        return "";
    }
}

function sanitizePublisherName(name) {

    let value =
        cleanText(name);

    value =
        value
            .replace(
                /\s+/g,
                " "
            )
            .trim();

    if (!value) {
        value =
            DEFAULT_ADMIN_NAME;
    }

    return value.slice(
        0,
        60
    );
}

function loadSelectionSettings() {

    try {

        const saved =
            localStorage.getItem(
                SELECTION_STORAGE_KEY
            );

        if (!saved) {

            selectedKeys =
                new Set();

            return;
        }

        const data =
            JSON.parse(saved);

        if (
            Array.isArray(data)
        ) {

            selectedKeys =
                new Set(
                    data.filter(
                        item =>
                            typeof item ===
                            "string"
                    )
                );

        } else {

            selectedKeys =
                new Set();
        }

    } catch (error) {

        console.warn(
            "خطا در بارگذاری انتخاب‌ها:",
            error
        );

        selectedKeys =
            new Set();
    }
}

function saveSelectionSettings() {

    try {

        localStorage.setItem(
            SELECTION_STORAGE_KEY,
            JSON.stringify(
                [...selectedKeys]
            )
        );

    } catch (error) {

        console.warn(
            "ذخیره انتخاب‌ها انجام نشد:",
            error
        );
    }
}

/* =========================================================
   کلید یکتا
========================================================= */

function getItemKey(item) {

    if (
        !item ||
        typeof item !== "object"
    ) {
        return "";
    }

    if (item.link) {

        return (
            "link:" +
            String(item.link).trim()
        );
    }

    if (
        item.id !== undefined &&
        item.id !== null
    ) {

        return (
            "id:" +
            String(item.id)
        );
    }

    return [
        item.title || "",
        item.source || "",
        item.category || "",
        item.pubDate ||
            item.date ||
            ""
    ]
        .map(
            value =>
                cleanText(value)
                    .toLowerCase()
        )
        .join("|");
}

/* =========================================================
   دسته فعلی
========================================================= */

function getFilteredNews() {

    if (
        currentCategory ===
        "all"
    ) {

        return [
            ...allNews
        ];
    }

    return allNews.filter(
        item =>
            cleanText(
                item.category
            ) ===
            currentCategory
    );
}

/* =========================================================
   جستجو
========================================================= */

function matchesSearch(item) {

    if (!searchQuery) {
        return true;
    }

    const query =
        searchQuery
            .trim()
            .toLocaleLowerCase(
                "fa"
            );

    if (!query) {
        return true;
    }

    const searchableText = [
        item.title,
        item.source,
        item.category,
        item.summary,
        item.description
    ]
        .map(
            value =>
                cleanText(value)
                    .toLocaleLowerCase(
                        "fa"
                    )
        )
        .join(" ");

    return searchableText.includes(
        query
    );
}

/* =========================================================
   تاریخ
========================================================= */

function getNewsTimestamp(item) {

    const value =
        item.pubDate ||
        item.published ||
        item.date ||
        item.createdAt ||
        item.timestamp;

    if (!value) {
        return 0;
    }

    const timestamp =
        new Date(value).getTime();

    return Number.isNaN(timestamp)
        ? 0
        : timestamp;
}

function isNewNews(item) {

    const timestamp =
        getNewsTimestamp(item);

    if (!timestamp) {
        return false;
    }

    const age =
        Date.now() -
        timestamp;

    return (
        age >= 0 &&
        age <=
            24 *
            60 *
            60 *
            1000
    );
}

function formatNewsDate(item) {

    const timestamp =
        getNewsTimestamp(item);

    if (!timestamp) {
        return "";
    }

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        ).format(
            new Date(timestamp)
        );

    } catch {

        return "";
    }
}

function formatPersianDate(
    date = new Date()
) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "numeric",
                day: "numeric"
            }
        ).format(date);

    } catch {

        return "";
    }
}

function formatPersianTime(
    date = new Date()
) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return "";
    }
}

/* =========================================================
   مرتب‌سازی
========================================================= */

function sortNews(news) {

    const result =
        [
            ...news
        ];

    if (
        sortMode ===
        "selected"
    ) {

        result.sort(
            (a, b) => {

                const aSelected =
                    selectedKeys.has(
                        getItemKey(a)
                    )
                        ? 1
                        : 0;

                const bSelected =
                    selectedKeys.has(
                        getItemKey(b)
                    )
                        ? 1
                        : 0;

                if (
                    aSelected !==
                    bSelected
                ) {

                    return (
                        bSelected -
                        aSelected
                    );
                }

                return (
                    getNewsTimestamp(b) -
                    getNewsTimestamp(a)
                );
            }
        );

        return result;
    }

    if (
        sortMode ===
        "oldest"
    ) {

        result.sort(
            (a, b) =>
                getNewsTimestamp(a) -
                getNewsTimestamp(b)
        );

        return result;
    }

    result.sort(
        (a, b) =>
            getNewsTimestamp(b) -
            getNewsTimestamp(a)
    );

    return result;
}

/* =========================================================
   اخبار قابل نمایش
========================================================= */

function getDisplayedNews() {

    let result =
        getFilteredNews();

    result =
        result.filter(
            matchesSearch
        );

    if (onlySelected) {

        result =
            result.filter(
                item =>
                    selectedKeys.has(
                        getItemKey(item)
                    )
            );
    }

    result =
        sortNews(result);

    if (
        newsCountSetting !==
        "all"
    ) {

        const limit =
            Number(
                newsCountSetting
            );

        if (
            Number.isFinite(limit) &&
            limit > 0
        ) {

            result =
                result.slice(
                    0,
                    limit
                );
        }
    }

    return result;
}

function getCategoryCount(
    categoryId
) {

    if (
        categoryId ===
        "all"
    ) {

        return allNews.length;
    }

    return allNews.filter(
        item =>
            cleanText(
                item.category
            ) ===
            categoryId
    ).length;
}

function getSelectedCategoryCount(
    categoryId
) {

    if (categoryId === "all") {
        return allNews.filter(
            item => selectedKeys.has(getItemKey(item))
        ).length;
    }

    return allNews.filter(
        item =>
            cleanText(item.category) === categoryId &&
            selectedKeys.has(getItemKey(item))
    ).length;
}

/* =========================================================
   نمایش اخبار
========================================================= */

function renderNews() {

    const container =
        document.getElementById(
            "newsContainer"
        );

    if (!container) {
        return;
    }

    container.innerHTML = "";

    const news =
        getDisplayedNews();

    if (!news.length) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty-state";

        if (
            onlySelected &&
            selectedKeys.size === 0
        ) {

            empty.textContent =
                "☑️ هنوز خبری انتخاب نشده است.";

        } else if (
            searchQuery
        ) {

            empty.textContent =
                "🔍 خبری مطابق جستجوی شما پیدا نشد.";

        } else {

            empty.textContent =
                "📰 خبری برای نمایش وجود ندارد.";
        }

        container.appendChild(
            empty
        );

        return;
    }

    news.forEach(
        item => {

            const key =
                getItemKey(item);

            const selected =
                selectedKeys.has(
                    key
                );

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "news-card" +
                (
                    selected
                        ? " selected"
                        : ""
                );

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "news-card-header";

            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "news-checkbox";

            checkbox.checked =
                selected;

            checkbox.setAttribute(
                "aria-label",
                "انتخاب خبر"
            );

            checkbox.addEventListener(
                "change",
                event => {

                    if (
                        event.target.checked
                    ) {

                        selectedKeys.add(
                            key
                        );

                    } else {

                        selectedKeys.delete(
                            key
                        );
                    }

                    saveSelectionSettings();

                    renderAll();
                }
            );

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "news-content";

            const title =
                document.createElement(
                    "h3"
                );

            title.className =
                "news-title";

            title.textContent =
                cleanText(
                    item.title
                );

            content.appendChild(
                title
            );

            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "news-meta";

            if (item.source) {

                const source =
                    document.createElement(
                        "span"
                    );

                source.className =
                    "meta-chip";

                source.textContent =
                    "📰 " +
                    cleanText(
                        item.source
                    ) +
                    (
                        item.flag
                            ? " " +
                              cleanText(
                                  item.flag
                              )
                            : ""
                    );

                meta.appendChild(
                    source
                );
            }

            if (item.category) {

                const category =
                    document.createElement(
                        "span"
                    );

                category.className =
                    "meta-chip";

                category.textContent =
                    "🏷 " +
                    cleanText(
                        item.category
                    );

                meta.appendChild(
                    category
                );
            }

            if (
                isNewNews(item)
            ) {

                const badge =
                    document.createElement(
                        "span"
                    );

                badge.className =
                    "new-badge";

                badge.textContent =
                    "جدید";

                meta.appendChild(
                    badge
                );
            }

            content.appendChild(
                meta
            );

            const summary =
                cleanSummary(
                    item.summary ||
                    item.description ||
                    ""
                );

            if (summary) {

                const summaryElement =
                    document.createElement(
                        "p"
                    );

                summaryElement.className =
                    "news-summary";

                summaryElement.textContent =
                    "📝 " +
                    summary;

                content.appendChild(
                    summaryElement
                );
            }

            const date =
                formatNewsDate(
                    item
                );

            if (date) {

                const dateElement =
                    document.createElement(
                        "div"
                    );

                dateElement.className =
                    "news-date";

                dateElement.textContent =
                    "📅 " +
                    date;

                content.appendChild(
                    dateElement
                );
            }

            if (
                isSafeHttpUrl(
                    item.link
                )
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "news-link";

                link.href =
                    item.link;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    "مشاهده خبر ↗";

                /*
                   جلوگیری از انتخاب/لغو ناخواسته خبر
                   هنگام باز کردن لینک
                */

                link.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();
                    }
                );

                content.appendChild(
                    link
                );
            }

            header.appendChild(
                checkbox
            );

            header.appendChild(
                content
            );

            card.appendChild(
                header
            );

            card.addEventListener(
                "click",
                event => {

                    if (
                        event.target ===
                        checkbox
                    ) {
                        return;
                    }

                    checkbox.checked =
                        !checkbox.checked;

                    checkbox.dispatchEvent(
                        new Event(
                            "change"
                        )
                    );
                }
            );

            container.appendChild(
                card
            );
        }
    );
}

function updateSelectionInfo() {

    const element =
        document.getElementById(
            "selectionInfo"
        );

    if (!element) {
        return;
    }

    const selectedTotal =
        selectedKeys.size;

    if (!selectedTotal) {

        element.innerHTML =
            "هیچ خبری انتخاب نشده است.";

        return;
    }

    const counts = {};

    allNews.forEach(
        item => {

            const key =
                getItemKey(item);

            if (
                !selectedKeys.has(key)
            ) {
                return;
            }

            const category =
                cleanText(
                    item.category
                ) ||
                "متفرقه";

            counts[category] =
                (
                    counts[category] ||
                    0
                ) + 1;
        }
    );

    element.innerHTML = "";

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "selection-summary-title";

    title.textContent =
        "📊 وضعیت انتخاب‌ها: " +
        toPersianDigits(
            selectedTotal
        ) +
        " خبر";

    element.appendChild(
        title
    );

    const breakdown =
        document.createElement(
            "div"
        );

    breakdown.className =
        "selection-breakdown";

    CATEGORY_LIST
        .filter(
            category =>
                category.id !==
                "all"
        )
        .forEach(
            category => {

                const count =
                    counts[
                        category.id
                    ] || 0;

                if (!count) {
                    return;
                }

                const chip =
                    document.createElement(
                        "span"
                    );

                chip.className =
                    "selection-chip";

                chip.textContent =
                    category.title +
                    " " +
                    toPersianDigits(
                        count
                    ) +
                    " خبر";

                breakdown.appendChild(
                    chip
                );
            }
        );

    element.appendChild(
        breakdown
    );
}

    const now =
        new Date();

    const FRAME_WIDTH = 20;
    const frame = "╔" + "═".repeat(FRAME_WIDTH) + "╗";
    const bottom = "╚" + "═".repeat(FRAME_WIDTH) + "╝";

    return [
        frame,
        "🌸🕌💫 اخبار دیار قدمگاه",
        "📅 " + formatPersianDate(now) + "  🕐 " + formatPersianTime(now),
        bottom,
        ""
    ].join("\n");
}

   فوتر روبیکا
========================================================= */

function rubikaFooter() {

    const FRAME_WIDTH = 20;
    const frame = "╔" + "═".repeat(FRAME_WIDTH) + "╗";
    const bottom = "╚" + "═".repeat(FRAME_WIDTH) + "╝";

    const lines = [
        "",
        frame,
        "📖 متن کامل خبر",
        "🔗 مشاهده و مطالعه خبر:",
        RUBIKA_PAGE_URL,
        bottom,
        "",
        "🏡 دیار قدمگاه",
        "✍️ " + publisherName
    ];

    if (publisherRubika) {
        lines.push(
            "🔗 روبیکا: " + publisherRubika
        );
    }

    return lines.join("\n");
}

/* =========================================================
   ساخت متن روبیکا
========================================================= */

function createRubikaText() {

    const news =
        getPublishNews();

    if (!news.length) {
        return "";
    }

    const parts = [
        rubikaHeader()
    ];

    news.forEach(
        (item, index) => {

            const title =
                cleanText(item.title);

            const source =
                cleanText(item.source);

            const category =
                cleanText(item.category);

            const summary =
                cleanSummary(
                    item.summary ||
                    item.description ||
                    ""
                );

            parts.push(
                "🔴 " + title
            );

            if (source || category) {
                let meta = "";

                if (source) {
                    meta += "📰 " + source;
                }

                if (category) {
                    if (meta) {
                        meta += " | ";
                    }
                    meta += "🏷 " + category;
                }

                parts.push(meta);
            }

            if (summary) {
                parts.push("📝 " + summary);
            }

            if (index < news.length - 1) {
                parts.push(
                    "",
                    "────────────────────",
                    ""
                );
            }
        }
    );

    parts.push(
        rubikaFooter()
    );

    return parts.join("\n");
}

/* =========================================================

/* =========================================================
   کپی جایگزین
========================================================= */

async function fallbackCopy(text) {

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.value =
        text;

    textarea.style.position =
        "fixed";

    textarea.style.top =
        "-9999px";

    textarea.style.left =
        "-9999px";

    textarea.setAttribute(
        "readonly",
        ""
    );

    document.body.appendChild(
        textarea
    );

    textarea.select();

    textarea.setSelectionRange(
        0,
        textarea.value.length
    );

    let success =
        false;

    try {

        success =
            document.execCommand(
                "copy"
            );

    } catch {

        success =
            false;
    }

    document.body.removeChild(
        textarea
    );

    return success;
}

/* =========================================================
   کپی متن روبیکا
========================================================= */

async function copyRubikaText() {

    const news =
        getPublishNews();

    const count =
        news.length;

    if (!count) {

        showToast(
            "⚠️ ابتدا حداقل یک خبر را انتخاب کنید."
        );

        return;
    }

    savePublisherSettings();

    const text =
        createRubikaText();

    let copied =
        false;

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

            copied =
                true;
        }

    } catch {

        copied =
            false;
    }

    if (!copied) {

        copied =
            await fallbackCopy(
                text
            );
    }

    if (copied) {

        showToast(
            "✅ متن " +
            toPersianDigits(
                count
            ) +
            " خبر برای انتشار در روبیکا کپی شد."
        );

    } else {

        showToast(
            "❌ کپی متن انجام نشد. لطفاً دوباره تلاش کنید."
        );
    }
}

/* =========================================================
   Toast
========================================================= */

let toastTimer =
    null;

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    if (!toast) {
        return;
    }

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3200
        );
}

/* =========================================================
   Status
========================================================= */

function showStatus(
    message,
    type = "normal"
) {

    const box =
        document.getElementById(
            "statusBox"
        );

    if (!box) {
        return;
    }

    box.textContent =
        message;

    box.className =
        "status-box";

    if (
        type === "error"
    ) {

        box.classList.add(
            "error"
        );

    } else if (
        type === "loading"
    ) {

        box.classList.add(
            "loading"
        );
    }

    box.style.display =
        "block";
}

function hideStatus() {

    const box =
        document.getElementById(
            "statusBox"
        );

    if (!box) {
        return;
    }

    box.style.display =
        "none";
}

/* =========================================================
   دریافت JSON از یک URL
========================================================= */

async function fetchNewsFromUrl(
    baseUrl
) {

    const separator =
        baseUrl.includes("?")
            ? "&"
            : "?";

    const url =
        baseUrl +
        separator +
        "_=" +
        Date.now();

    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-store",
                credentials: "omit",
                headers: {
                    "Cache-Control":
                        "no-cache",
                    "Pragma":
                        "no-cache"
                }
            }
        );

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );
    }

    const text =
        await response.text();

    if (!text.trim()) {

        throw new Error(
            "فایل خالی است."
        );
    }

    let data;

    try {

        data =
            JSON.parse(text);

    } catch {

        throw new Error(
            "محتوای JSON معتبر نیست."
        );
    }

    return data;
}

/* =========================================================
   تبدیل داده دریافتی به آرایه اخبار
========================================================= */

function extractNewsArray(data) {

    if (
        Array.isArray(data)
    ) {

        return data;
    }

    if (
        data &&
        Array.isArray(
            data.news
        )
    ) {

        return data.news;
    }

    if (
        data &&
        Array.isArray(
            data.categorizedNews
        )
    ) {

        return Object.values(
            data.categorizedNews
        ).flat();
    }

    throw new Error(
        "ساختار فایل اخبار معتبر نیست."
    );
}

/* =========================================================
   نرمال‌سازی اخبار
========================================================= */

function normalizeNewsArray(
    incomingNews
) {

    return incomingNews
        .filter(
            item =>
                item &&
                cleanText(
                    item.title
                )
        )
        .map(
            item => ({

                ...item,

                title:
                    cleanText(
                        item.title
                    ),

                source:
                    cleanText(
                        item.source
                    ),

                category:
                    cleanText(
                        item.category
                    ),

                summary:
                    cleanSummary(
                        item.summary ||
                        item.description ||
                        ""
                    )
            })
        );
}

/* =========================================================
   دریافت اخبار
========================================================= */

async function loadNews(
    showMessage = true
) {

    if (isLoadingNews) {
        return;
    }

    isLoadingNews = true;

    const refreshButton =
        document.getElementById(
            "refreshBtn"
        );

    if (refreshButton) {

        refreshButton.disabled =
            true;

        refreshButton.textContent =
            "⏳ در حال دریافت...";
    }

    showStatus(
        "⏳ در حال دریافت آخرین اخبار...",
        "loading"
    );

    let data =
        null;

    let usedUrl =
        "";

    let usedFallback =
        false;

    let firstError =
        null;

    /*
       مرحله اول:
       GitHub Pages
    */

    try {

        data =
            await fetchNewsFromUrl(
                SUMMARY_URL
            );

        usedUrl =
            SUMMARY_URL;

    } catch (error) {

        firstError =
            error;

        console.warn(
            "دریافت از GitHub Pages ناموفق بود:",
            error
        );
    }

    /*
       مرحله دوم:
       Raw GitHub
    */

    if (!data) {

        try {

            data =
                await fetchNewsFromUrl(
                    SUMMARY_FALLBACK_URL
                );

            usedUrl =
                SUMMARY_FALLBACK_URL;

            usedFallback =
                true;

        } catch (error) {

            console.error(
                "دریافت از هر دو مسیر ناموفق بود:",
                error
            );

            showStatus(
                "❌ دریافت اخبار انجام نشد. اتصال اینترنت یا فایل news-summary.json را بررسی کنید.",
                "error"
            );

            if (refreshButton) {

                refreshButton.disabled =
                    false;

                refreshButton.textContent =
                    "🔄 بروزرسانی";
            }

            return;
        }
    }

    try {

        const incomingNews =
            extractNewsArray(
                data
            );

        const normalizedNews =
            normalizeNewsArray(
                incomingNews
            );

        if (
            !normalizedNews.length
        ) {

            throw new Error(
                "هیچ خبر معتبری در فایل پیدا نشد."
            );
        }

        allNews =
            normalizedNews;

        /*
           انتخاب‌های قبلی حفظ می‌شوند،
           اما فقط اگر خبر هنوز در
           news-summary.json وجود داشته باشد.
        */

        const validKeys =
            new Set(
                allNews.map(
                    getItemKey
                )
            );

        const oldSelectionCount =
            selectedKeys.size;

        selectedKeys =
            new Set(
                [...selectedKeys]
                    .filter(
                        key =>
                            validKeys.has(
                                key
                            )
                    )
            );

        /*
           پاک‌سازی انتخاب‌های قدیمی
        */

        if (
            selectedKeys.size !==
            oldSelectionCount
        ) {

            saveSelectionSettings();
        }

        buildCategoryButtons();

        renderAll();

        /*
           زمان بروزرسانی خود فایل JSON
        */

        let updateText =
            "";

        if (
            data &&
            data.lastUpdatePersian
        ) {

            updateText =
                " | بروزرسانی منبع: " +
                cleanText(
                    data.lastUpdatePersian
                );

        } else if (
            data &&
            data.lastUpdate
        ) {

            try {

                updateText =
                    " | بروزرسانی منبع: " +
                    new Intl.DateTimeFormat(
                        "fa-IR",
                        {
                            dateStyle:
                                "short",
                            timeStyle:
                                "short"
                        }
                    ).format(
                        new Date(
                            data.lastUpdate
                        )
                    );

            } catch {}
        }

        showStatus(
            "✅ " +
            toPersianDigits(
                allNews.length
            ) +
            " خبر با موفقیت دریافت شد." +
            updateText +
            (usedFallback ? " | مسیر پشتیبان" : "")
        );

        if (showMessage) {

            showToast(
                "🔄 اخبار با موفقیت بروزرسانی شد."
            );
        }

        console.log(
            "News loaded successfully from:",
            usedUrl
        );

    } catch (error) {

        console.error(
            "خطا در پردازش اخبار:",
            error
        );

        showStatus(
            "❌ فایل اخبار دریافت شد اما پردازش آن با خطا مواجه شد.",
            "error"
        );

    } finally {

        isLoadingNews = false;

        if (refreshButton) {

            refreshButton.disabled =
                false;

            refreshButton.textContent =
                "🔄 بروزرسانی";
        }
    }
}

/* =========================================================
   رندر کامل
========================================================= */

    buildCategoryButtons();

    renderNews();

    updatePreview();
}

        document.getElementById(

            "📅 " +

        }
    );

    /* -----------------------------------------
       جستجو
    ----------------------------------------- */

        document.getElementById(
            "searchInput"
        );

    const clearSearchBtn =

            "clearSearchBtn"
        );

            "sortSelect"
        );

        "change",
        event => {

        }
    );

    /* -----------------------------------------
       فقط انتخاب‌شده‌ها
    ----------------------------------------- */

    const onlySelectedCheckbox =
        document.getElementById(
            "onlySelected"
        );

    onlySelectedCheckbox.addEventListener(
        "change",
        event => {

            onlySelected =

            renderAll();
        }
    );

    /* -----------------------------------------
       انتخاب همه این دسته
    ----------------------------------------- */

    document.getElementById(
        "selectAllBtn"
    ).addEventListener(
        "click",
        selectAllNews
    );

    /* -----------------------------------------
       لغو انتخاب این دسته
    ----------------------------------------- */

    document.getElementById(
        "clearAllBtn"
    ).addEventListener(
        "click",
        clearAllNews
    );

    /* -----------------------------------------
       لغو انتخاب همه
    ----------------------------------------- */

    document.getElementById(
        "clearEverythingBtn"
    ).addEventListener(
        "click",
        clearEverything
    );

    /* -----------------------------------------
       بروزرسانی
    ----------------------------------------- */

    document.getElementById(
        "refreshBtn"
    ).addEventListener(
        "click",
        () =>
            loadNews(true)
    );

    /* -----------------------------------------
       کپی بالا
    ----------------------------------------- */

    document.getElementById(
        "copyBtn"
    ).addEventListener(
        "click",
        copyRubikaText
    );

    /* -----------------------------------------
       کپی پایین
    ----------------------------------------- */

    document.getElementById(
        "copyBtnBottom"
    ).addEventListener(
        "click",
        copyRubikaText
    );

    /* -----------------------------------------
       نام منتشرکننده
    ----------------------------------------- */

    publisherNameInput.addEventListener(
        "input",
        () => {

            publisherName =
                sanitizePublisherName(
                    publisherNameInput.value
                );

            try {

                localStorage.setItem(
                    ADMIN_STORAGE_KEY,
                    JSON.stringify({
                        name:
                            publisherName,
                        rubika:
                            publisherRubika
                    })
                );

            } catch {}

            updatePreview();
        }
    );

    /* -----------------------------------------
       لینک روبیکا
    ----------------------------------------- */

    publisherRubikaInput.addEventListener(
        "input",
        () => {

            publisherRubika =
                normalizeRubikaUrl(
                    publisherRubikaInput.value
                );

            try {

                localStorage.setItem(
                    ADMIN_STORAGE_KEY,
                    JSON.stringify({
                        name:
                            publisherName,
                        rubika:
                            publisherRubika
                    })
                );

            } catch {}

            updatePreview();
        }
    );

    /* -----------------------------------------
       رندر اولیه
    ----------------------------------------- */

    buildCategoryButtons();

    renderAll();

    /*
       دریافت اخبار
       بعد از آماده شدن کامل صفحه
    */

    loadNews(false);

    /*
       بروزرسانی خودکار هر ۱۰ دقیقه
       از اجرای هم‌زمان با Fetch قبلی جلوگیری می‌شود.
    */

    setInterval(
        () => loadNews(false),
        10 * 60 * 1000
    );
}

/* =========================================================
   شروع
========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initialize
    );

} else {

    initialize();
}
