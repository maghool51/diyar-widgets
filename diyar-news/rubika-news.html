<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اخبار دیار قدمگاه | روبیکا</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f5f7fa;
    color: #263238;
}

.container {
    max-width: 760px;
    margin: auto;
    padding: 18px;
}


/* ================================
   Header
   ================================ */

.header {
    background: linear-gradient(
        135deg,
        #263238,
        #455a64
    );

    color: white;

    border-radius: 18px;

    padding: 22px 18px;

    text-align: center;

    box-shadow:
        0 5px 18px rgba(0,0,0,.12);
}

.header h1 {
    margin: 0 0 8px;
    font-size: 23px;
}

.header p {
    margin: 0;
    opacity: .9;
    font-size: 13px;
}


/* ================================
   Controls
   ================================ */

.controls {

    margin-top: 15px;

    background: white;

    border-radius: 16px;

    padding: 14px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.categories {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

.category-btn {

    border: 1px solid #d8dee3;

    background: #fff;

    color: #455a64;

    border-radius: 20px;

    padding: 8px 13px;

    cursor: pointer;

    font-family: inherit;

    font-size: 13px;
}

.category-btn.active {

    background: #37474f;

    color: white;

    border-color: #37474f;
}


/* ================================
   Buttons
   ================================ */

.action-row {

    display: flex;

    gap: 9px;

    margin-top: 12px;
}

.action-btn {

    flex: 1;

    border: 0;

    border-radius: 12px;

    padding: 11px;

    cursor: pointer;

    font-family: inherit;

    font-size: 14px;
}

.copy-btn {

    background: #1565c0;

    color: white;
}

.refresh-btn {

    background: #eceff1;

    color: #263238;
}


/* ================================
   Update information
   ================================ */

.update {

    margin-top: 10px;

    font-size: 12px;

    color: #78909c;

    text-align: center;
}


/* ================================
   News
   ================================ */

.news-list {

    margin-top: 15px;
}

.news-card {

    background: white;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);
}

.news-number {

    display: inline-block;

    background: #eceff1;

    color: #455a64;

    border-radius: 50%;

    width: 28px;

    height: 28px;

    line-height: 28px;

    text-align: center;

    font-size: 13px;

    margin-left: 5px;
}

.news-title {

    font-size: 16px;

    font-weight: bold;

    line-height: 1.9;

    margin-top: 8px;
}

.meta {

    margin-top: 9px;

    color: #607d8b;

    font-size: 12px;

    line-height: 2;
}


/* ================================
   Summary
   ================================ */

.summary {

    margin-top: 10px;

    padding: 11px 12px;

    background: #f7f9fa;

    border-right: 3px solid #90a4ae;

    border-radius: 9px;

    color: #455a64;

    font-size: 13px;

    line-height: 2;
}

.summary-label {

    font-weight: bold;

    color: #37474f;
}


/* ================================
   Read link
   ================================ */

.read-link {

    display: block;

    margin-top: 10px;

    text-decoration: none;

    color: #1565c0;

    font-size: 13px;
}


/* ================================
   Status
   ================================ */

.status {

    text-align: center;

    padding: 25px;

    color: #78909c;
}


/* ================================
   Footer
   ================================ */

.footer {

    text-align: center;

    margin-top: 25px;

    padding: 20px 10px;

    color: #607d8b;

    font-size: 13px;
}

.footer strong {

    color: #37474f;
}


/* ================================
   Toast
   ================================ */

.toast {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    background: #263238;

    color: white;

    padding: 11px 18px;

    border-radius: 12px;

    font-size: 13px;

    display: none;

    z-index: 1000;
}


/* ================================
   Mobile
   ================================ */

@media (max-width: 500px) {

    .container {
        padding: 10px;
    }

    .header h1 {
        font-size: 20px;
    }

    .news-title {
        font-size: 15px;
    }

    .action-row {
        flex-direction: column;
    }
}

</style>
</head>


<body>

<div class="container">


<header class="header">

    <h1>
        📰 اخبار دیار قدمگاه
    </h1>

    <p>
        مهم‌ترین اخبار روز به همراه چکیده خبرها
    </p>

</header>


<section class="controls">


    <div
        id="categories"
        class="categories"
    >

        <button
            class="category-btn active"
            data-category="all"
        >
            همه اخبار
        </button>

    </div>


    <div class="action-row">


        <button
            id="copyBtn"
            class="action-btn copy-btn"
            type="button"
        >
            📋 کپی برای روبیکا
        </button>


        <button
            id="refreshBtn"
            class="action-btn refresh-btn"
            type="button"
        >
            🔄 بروزرسانی
        </button>


    </div>


    <div
        id="updateInfo"
        class="update"
    >
        در حال دریافت اخبار...
    </div>


</section>


<main
    id="newsList"
    class="news-list"
>

    <div class="status">
        در حال دریافت اخبار...
    </div>

</main>


<footer class="footer">

    🏡 <strong>دیار قدمگاه</strong>

    <br>

    ✍️ معقول

</footer>


</div>


<div
    id="toast"
    class="toast"
></div>


<script>

"use strict";


/* =========================================================
   تنظیمات
   ========================================================= */

const SUMMARY_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";


const RUBIKA_PAGE_URL =
    "https://maghool51.github.io/diyar-widgets/diyar-news/rubika-news.html";


const NEWS_COUNT = 10;


/* =========================================================
   متغیرها
   ========================================================= */

let allNews = [];

let currentCategory = "all";


/* =========================================================
   ارقام فارسی
   ========================================================= */

function toPersianDigits(value) {

    return String(value ?? "")
        .replace(
            /\d/g,
            function(digit) {

                return "۰۱۲۳۴۵۶۷۸۹"[digit];

            }
        );
}


/* =========================================================
   ایمن‌سازی HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   تشخیص دسته‌بندی هوشمند
   ========================================================= */

function smartCategory(item) {

    const title =
        String(
            item.title || ""
        )
        .toLowerCase()
        .trim();


    const originalCategory =
        String(
            item.category || ""
        )
        .trim();


    /* --------------------------------
       ورزشی
       -------------------------------- */

    const sportsKeywords = [

        "فوتبال",
        "والیبال",
        "بسکتبال",
        "فوتسال",
        "تنیس",
        "کشتی",
        "ورزش",
        "لیگ برتر",
        "لیگ قهرمانان",
        "جام جهانی",
        "جام حذفی",
        "منچستریونایتد",
        "منچستر یونایتد",
        "رئال مادرید",
        "بارسلونا",
        "استقلال",
        "پرسپولیس",
        "سپاهان",
        "تراکتور",
        "ایپسویچ",
        "مالاگا",
        "مربی",
        "بازیکن",
        "گلزنی",
        "مسابقه",
        "قهرمانی",
        "قهرمان",
        "فینال",
        "نیمه نهایی",
        "یک چهارم نهایی",
        "ساحلی"

    ];


    if (
        sportsKeywords.some(
            function(keyword) {

                return title.includes(
                    keyword
                );

            }
        )
    ) {

        return "ورزشی";
    }


    /* --------------------------------
       اقتصادی
       -------------------------------- */

    const economicKeywords = [

        "اقتصاد",
        "اقتصادی",
        "دلار",
        "یورو",
        "طلا",
        "سکه",
        "بورس",
        "بازار سرمایه",
        "بانک",
        "بانکی",
        "وام",
        "تسهیلات",
        "تورم",
        "قیمت",
        "ارز",
        "سهام",
        "مالیات",
        "صادرات",
        "واردات",
        "خودرو",
        "مسکن",
        "اجاره",
        "نفت",
        "گاز",
        "پتروشیمی"

    ];


    if (
        economicKeywords.some(
            function(keyword) {

                return title.includes(
                    keyword
                );

            }
        )
    ) {

        return "اقتصادی";
    }


    /* --------------------------------
       علمی و فناوری
       -------------------------------- */

    const technologyKeywords = [

        "فناوری",
        "تکنولوژی",
        "هوش مصنوعی",
        "اینترنت",
        "موبایل",
        "گوشی",
        "کامپیوتر",
        "رایانه",
        "نرم افزار",
        "نرم‌افزار",
        "سخت افزار",
        "سخت‌افزار",
        "ربات",
        "علمی",
        "دانشگاه",
        "پژوهش",
        "تحقیقات",
        "فضا",
        "ماهواره",
        "نجوم",
        "استارتاپ"

    ];


    if (
        technologyKeywords.some(
            function(keyword) {

                return title.includes(
                    keyword
                );

            }
        )
    ) {

        return "علمی و فناوری";
    }


    /* --------------------------------
       اجتماعی
       -------------------------------- */

    const socialKeywords = [

        "مدرسه",
        "دانش‌آموز",
        "دانش آموز",
        "معلم",
        "آموزش",
        "اجتماعی",
        "سلامت",
        "بهداشت",
        "بیمارستان",
        "پزشکی",
        "درمان",
        "حوادث",
        "تصادف",
        "آتش‌سوزی",
        "آتش سوزی",
        "شهرداری",
        "استانداری",
        "شهرستان",
        "روستا",
        "فرهنگی"

    ];


    if (
        socialKeywords.some(
            function(keyword) {

                return title.includes(
                    keyword
                );

            }
        )
    ) {

        return "اجتماعی";
    }


    /* --------------------------------
       بین‌الملل
       -------------------------------- */

    const internationalKeywords = [

        "آمریکا",
        "آمریکایی",
        "اروپا",
        "اروپایی",
        "آلمان",
        "فرانسه",
        "انگلیس",
        "بریتانیا",
        "روسیه",
        "اوکراین",
        "چین",
        "اسرائیل",
        "فلسطین",
        "غزه",
        "لبنان",
        "سوریه",
        "عراق",
        "افغانستان",
        "پاکستان",
        "ترکیه",
        "سازمان ملل",
        "ناتو",
        "کاخ سفید",
        "صدر اعظم آلمان",
        "بین‌الملل",
        "بین الملل",
        "جهان"

    ];


    if (
        internationalKeywords.some(
            function(keyword) {

                return title.includes(
                    keyword
                );

            }
        )
    ) {

        return "بین‌الملل";
    }


    /* --------------------------------
       سیاسی
       -------------------------------- */

    const politicalKeywords = [

        "سیاسی",
        "دولت",
        "مجلس",
        "نماینده",
        "وزیر",
        "وزارت",
        "رئیس جمهور",
        "رئیس‌جمهور",
        "رییس جمهور",
        "رییس‌جمهور",
        "سخنگوی دولت",
        "انتخابات",
        "انتخاباتی",
        "قانون",
        "مذاکره",
        "دیپلماسی",
        "رئیس مجلس",
        "رهبر",
        "استاندار",
        "استانداری"

    ];


    if (
        politicalKeywords.some(
            function(keyword) {

                return title.includes(
                    keyword

    }


    return (
        originalCategory ||
        "متفرقه"
    );
}


/* =========================================================
   تاریخ
   ========================================================= */

function formatDate(
    dateString
) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(
            dateString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return dateString;
    }


    return new Intl.DateTimeFormat(
        "fa-IR",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    ).format(date);
}


/* =========================================================
   دریافت news-summary.json
   ========================================================= */

async function loadNews() {

    const newsList =
        document.getElementById(
            "newsList"
        );


    const updateInfo =
        document.getElementById(
            "updateInfo"
        );


    newsList.innerHTML =
        '<div class="status">' +
        'در حال دریافت اخبار و چکیده‌ها...' +
        '</div>';


    try {

        const response =
            await fetch(
                SUMMARY_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت news-summary.json"
            );
        }


        const data =
            await response.json();


        allNews =
            Array.isArray(
                data.news
            )
                ? data.news
                : [];


        buildCategories();


        renderNews();


        if (
            data.lastUpdate
        ) {

            updateInfo.textContent =
                "آخرین بروزرسانی چکیده‌ها: " +
                formatDate(
                    data.lastUpdate
                );

        } else {

            updateInfo.textContent =
                "تعداد اخبار: " +
                toPersianDigits(
                    allNews.length
                );
        }


    } catch (error) {

        console.error(error);


        newsList.innerHTML =
            '<div class="status">' +
            '❌ دریافت اخبار با مشکل روبه‌رو شد.' +
            '<br><br>' +
            'لطفاً دوباره بروزرسانی کنید.' +
            '</div>';


        updateInfo.textContent =
            "خطا در دریافت اطلاعات";
    }
}


/* =========================================================
   دسته‌بندی‌ها
   ========================================================= */

function buildCategories() {

    const container =
        document.getElementById(
            "categories"
        );


    container.innerHTML = "";


    const allButton =
        document.createElement(
            "button"
        );


    allButton.className =
        "category-btn active";


    allButton.dataset.category =
        "all";


    allButton.textContent =
        "همه اخبار";


    allButton.onclick =
        function() {

            currentCategory =
                "all";


            setActiveCategory(
                allButton
            );


            renderNews();
        };


    container.appendChild(
        allButton
    );


    const categories = [

        "سیاسی",
        "اقتصادی",
        "اجتماعی",
        "بین‌الملل",
        "ورزشی",
        "علمی و فناوری"

    ];


    categories.forEach(
        function(category) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn";


            button.dataset.category =
                category;


            button.textContent =
                category;


            button.onclick =
                function() {

                    currentCategory =
                        category;


                    setActiveCategory(
                        button
                    );


                    renderNews();
                };


            container.appendChild(
                button
            );

        }
    );
}


/* =========================================================
   فعال کردن دسته
   ========================================================= */

function setActiveCategory(
    button
) {

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            function(btn) {

                btn.classList.remove(
                    "active"
                );
            }
        );


    button.classList.add(
        "active"
    );
}


/* =========================================================
   اخبار قابل نمایش
   ========================================================= */

function getVisibleNews() {

    let filteredNews;


    if (
        currentCategory === "all"
    ) {

        filteredNews =
            allNews;

    } else {

        filteredNews =
            allNews.filter(
                function(news) {

                    return (
                        smartCategory(news) ===
                        currentCategory
                    );
                }
            );
    }


    return filteredNews.slice(
        0,
        NEWS_COUNT
    );
}


/* =========================================================
   نمایش اخبار
   ========================================================= */

function renderNews() {

    const container =
        document.getElementById(
            "newsList"
        );


    const news =
        getVisibleNews();


    if (!news.length) {

        container.innerHTML =
            '<div class="status">' +
            'خبری برای نمایش وجود ندارد.' +
            '</div>';

        return;
    }


    container.innerHTML =
        news.map(
            function(item, index) {

                const title =
                    escapeHTML(
                        item.title
                    );


                const source =
                    escapeHTML(
                        item.source ||
                        "منبع نامشخص"
                    );


                const category =
                    escapeHTML(
                        smartCategory(item)
                    );


                const date =
                    escapeHTML(
                        formatDate(
                            item.date
                        )
                    );


                const link =
                    escapeHTML(
                        item.link
                    );


                const flag =
                    escapeHTML(
                        item.flag ||
                        "📰"
                    );


                const summary =
                    String(
                        item.summary || ""
                    ).trim();


                let summaryHTML =
                    "";


                if (summary) {

                    summaryHTML =
                        `
                        <div class="summary">

                            <span class="summary-label">
                                📝 چکیده:
                            </span>

                            ${escapeHTML(
                                summary
                            )}

                        </div>
                        `;
                }


                return `

                    <article class="news-card">

                        <div>

                            <span class="news-number">

                                ${toPersianDigits(
                                    index + 1
                                )}

                            </span>

                            ${flag}

                        </div>


                        <div class="news-title">

                            ${title}

                        </div>


                        <div class="meta">

                            📰 ${source}

                            <br>

                            🏷 ${category}

                            ${
                                date
                                ? "<br>📅 " + date
                                : ""
                            }

                        </div>


                        ${summaryHTML}


                        <a
                            class="read-link"
                            href="${link}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            🔗 مطالعه متن کامل خبر

                        </a>

                    </article>

                `;
            }
        ).join("");
}


/* =========================================================
   متن روبیکا
   ========================================================= */

function createRubikaText() {

    const news =
        getVisibleNews();


    if (!news.length) {

        return "";
    }


    let text =
        "📰 مهم‌ترین اخبار روز | دیار قدمگاه\n\n";


    news.forEach(
        function(item, index) {

            const category =
                smartCategory(item);


            text +=
                "🔴 " +
                toPersianDigits(
                    index + 1
                ) +
                ". " +
                (
                    item.title ||
                    ""
                ) +
                "\n";


            text +=
                "📰 " +
                (
                    item.source ||
                    "منبع نامشخص"
                ) +
                " | 🏷 " +
                category +
                "\n";


            /*
             * فقط اگر چکیده واقعی وجود داشته باشد
             * آن را به پیام اضافه می‌کنیم.
             */

            if (
                item.summary &&
                String(
                    item.summary
                ).trim()
            ) {

                text +=
                    "📝 " +
                    String(
                        item.summary
                    ).trim() +
                    "\n";
            }


            text += "\n";

        }
    );


    /*
     * فقط یک لینک در انتهای پیام
     */

    text +=
        "ــــــــــــــــــــــــــــ\n" +
        "📰 مشاهده متن کامل اخبار:\n" +
        RUBIKA_PAGE_URL +
        "\n\n" +
        "🏡 دیار قدمگاه\n" +
        "✍️ معقول";


    return text;
}


/* =========================================================
   کپی برای روبیکا
   ========================================================= */

async function copyForRubika() {

    const text =
        createRubikaText();


    if (!text) {

        showToast(
            "خبری برای کپی وجود ندارد."
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            text
        );


        showToast(
            "✅ متن اخبار و چکیده‌ها کپی شد."
        );


    } catch (error) {

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();


        textarea.select();


        try {

            document.execCommand(
                "copy"
            );


            showToast(
                "✅ متن اخبار و چکیده‌ها کپی شد."
            );


        } catch (copyError) {

            showToast(
                "❌ کپی خودکار انجام نشد."
            );
        }


        textarea.remove();
    }
}


/* =========================================================
   Toast
   ========================================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function() {

                toast.style.display =
                    "none";

            },
            2500
        );
}


/* =========================================================
   رویدادها
   ========================================================= */

document
    .getElementById(
        "copyBtn"
    )
    .addEventListener(
        "click",
        copyForRubika
    );


document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        loadNews
    );


/* =========================================================
   شروع
   ========================================================= */

loadNews();
