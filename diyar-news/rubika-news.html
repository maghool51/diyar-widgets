/* =====================================================
   NORMALIZE TEXT
===================================================== */

function normalizeText(value){

    return String(value ?? "")
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/ۀ/g,"ه")
        .replace(/\u200c/g," ")
        .replace(/\s+/g," ")
        .trim()
        .toLowerCase();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   PERSIAN DIGITS
===================================================== */

function toPersianDigits(value){

    return String(value ?? "")
        .replace(
            /\d/g,
            d => "۰۱۲۳۴۵۶۷۸۹"[d]
        );

}


/* =====================================================
   KEYWORD SCORE
===================================================== */

function keywordScore(title,keywords){

    let score = 0;

    keywords.forEach(word => {

        if(
            title.includes(
                normalizeText(word)
            )
        ){

            score++;

        }

    });

    return score;

}

/* =====================================================
   CLEAN SUMMARY
===================================================== */

function cleanSummary(text){

    let result =
        String(text || "")
        .replace(/\s+/g," ")
        .trim();


    result =
        result.replace(
            /^(📝|خلاصه:|چکیده:)\s*/i,
            ""
        );


    result =
        result.replace(
            /^[^،:]{2,25}\s*[-–—]\s*/,
            ""
        );


    result =
        result.replace(
            /^(گفت|اظهار کرد|اعلام کرد|بیان کرد|تأکید کرد|تاکید کرد)\s*[:：]\s*/i,
            ""
        );


    if(
        result.length >
        MAX_SUMMARY_LENGTH
    ){

        result =
            result.substring(
                0,
                MAX_SUMMARY_LENGTH
            );


        const lastSpace =
            result.lastIndexOf(" ");


        if(lastSpace > 90){

            result =
                result.substring(
                    0,
                    lastSpace
                );

        }


        result += "…";

    }


    return result;

}


/* =====================================================
   PERSIAN DATE
===================================================== */

function getPersianDate(){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        ).format(
            new Date()
        );

    }catch{

        return "";

    }

}


/* =====================================================
   PERSIAN TIME
===================================================== */

function getPersianTime(){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour:"2-digit",
                minute:"2-digit",
                hour12:false
            }
        ).format(
            new Date()
        );

    }catch{

        return "";

    }

}


/* =====================================================
   RUBIKA SAFE DATE
   کنترل جهت برای جلوگیری از جابجایی
===================================================== */

function rubikaDate(){

    const date =
        getPersianDate();

    /*
       RLM در ابتدا و انتها باعث می‌شود
       روبیکا ترتیب عبارت فارسی را
       به‌صورت RTL نگه دارد.
    */

    return (
        "\u200F" +
        date +
        "\u200F"
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    if(!value)
        return "";


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(date);

    }catch{

        return String(value);

    }

}


/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews(){

    const newsList =
        document.getElementById(
            "newsList"
        );


    const updateInfo =
        document.getElementById(
            "updateInfo"
        );


    newsList.innerHTML = `

        <div class="status">

            📰 در حال دریافت مهم‌ترین اخبار...

        </div>

    `;


    try{

        const response =
            await fetch(
                SUMMARY_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "JSON error"
            );

        }


        const data =
            await response.json();


        if(
            Array.isArray(data)
        ){

            allNews = data;

        }

        else if(
            Array.isArray(data.news)
        ){

            allNews =
                data.news;

        }

        else if(
            Array.isArray(data.items)
        ){

            allNews =
                data.items;

        }

        else{

            allNews = [];

        }


        buildCategories();

        renderNews();


        if(data.lastUpdate){

            updateInfo.textContent =
                "🕐 آخرین بروزرسانی: " +
                formatDate(
                    data.lastUpdate
                );

        }else{

            updateInfo.textContent =
                "📰 " +
                toPersianDigits(
                    allNews.length
                ) +
                " خبر دریافت شد";

        }


    }catch(error){

        console.error(error);


        newsList.innerHTML = `

            <div class="status">

                ❌ دریافت اخبار با مشکل مواجه شد.

                <br><br>

                لطفاً دوباره تلاش کنید.

            </div>

        `;


        updateInfo.textContent =
            "❌ خطا در دریافت اخبار";

    }

}


/* =====================================================
   CATEGORIES
===================================================== */

function buildCategories(){

    const container =
        document.getElementById(
            "categories"
        );


    container.innerHTML = "";


    const categories = [

        ["all","📰 همه"],

        ["سیاسی","🏛 سیاسی"],

        ["اقتصادی","💰 اقتصادی"],

        ["اجتماعی","👥 اجتماعی"],

        ["بین‌الملل","🌍 بین‌الملل"],

        ["ورزشی","⚽ ورزشی"],

        ["علمی و فناوری","💻 فناوری"],

        ["متفرقه","📌 متفرقه"]

    ];


    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";


            button.className =
                "category-btn";


            button.textContent =
                category[1];


            if(
                category[0] ===
                currentCategory
            ){

                button.classList.add(
                    "active"
                );

            }


            button.addEventListener(
                "click",
                () => {

                    currentCategory =
                        category[0];


                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    renderNews();

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   VISIBLE NEWS
===================================================== */

function getVisibleNews(){

    let filtered;


    if(
        currentCategory ===
        "all"
    ){

        filtered =
            allNews;

    }else{

        filtered =
            allNews.filter(
                item =>
                    smartCategory(item) ===
                    currentCategory
            );

    }


    return filtered.slice(
        0,
        NEWS_COUNT
    );

}


/* =====================================================
   NEW NEWS
===================================================== */

function isNewNews(item){

    if(!item)
        return false;


    if(
        item.isNew === true
    )
        return true;


    if(
        item.new === true
    )
        return true;


    if(item.publishedAt){

        const date =
            new Date(
                item.publishedAt
            );


        if(
            !Number.isNaN(
                date.getTime()
            )
        ){

            const hours =
                (
                    Date.now() -
                    date.getTime()
                ) /
                3600000;


            return (
                hours >= 0 &&
                hours <= 6
            );

        }

    }


    return false;

}


/* =====================================================
   RENDER NEWS
===================================================== */

function renderNews(){

    const container =
        document.getElementById(
            "newsList"
        );


    const news =
        getVisibleNews();


    if(!news.length){

        container.innerHTML = `

            <div class="status">

                📭 خبری برای این دسته وجود ندارد.

            </div>

        `;

        return;

    }


    container.innerHTML =

        news.map(
            (item,index) => {

                const title =
                    escapeHTML(
                        item.title
                    );


                const source =
                    escapeHTML(
                        item.source ||
                        "منبع نامشخص"
                    );


                const category =
                    escapeHTML(
                        smartCategory(item)
                    );


                const link =
                    escapeHTML(
                        item.link ||
                        "#"
                    );


                const summary =
                    cleanSummary(
                        item.summary
                    );


                const fresh =
                    isNewNews(item);


                return `

                    <article
                        class="news-card
                        ${fresh ? "new-news" : ""}"
                    >

                        <div
                            class="news-title"
                        >

                            <span
                                class="news-light"
                            ></span>

                            <span
                                class="news-number"
                            >
                                ${toPersianDigits(index+1)}.
                            </span>

                            ${title}

                            ${
                                fresh
                                ?
                                `<span class="fresh-badge">
                                    تازه
                                </span>`
                                :
                                ""
                            }

                        </div>


                        <div class="meta">

                            📰 ${source}

                            &nbsp; • &nbsp;

                            🏷 ${category}

                        </div>


                        ${
                            summary
                            ?
                            `
                            <div class="summary">

                                📝
                                ${escapeHTML(summary)}

                            </div>
                            `
                            :
                            ""
                        }


                        ${
                            link !== "#"
                            ?
                            `
                            <a
                                class="read-link"
                                href="${link}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                🔗 مطالعه متن کامل خبر

                            </a>
                            `
                            :
                            ""
                        }

                    </article>

                `;

            }
        ).join("");

}

/* =====================================================
   CREATE RUBIKA TEXT
===================================================== */

function createRubikaText(){

    const news =
        getVisibleNews();


    if(!news.length)
        return "";


    const NL =
        "\r\n";


    let text =

        rubikaHeader() +

        NL +
        NL;


    news.forEach(
        (item,index) => {


            const title =

                String(
                    item.title || ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


            const source =

                String(
                    item.source ||
                    "منبع نامشخص"
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


            const category =

                smartCategory(item);


            const summary =

                cleanSummary(
                    item.summary
                );


            text +=

                "🔴 " +

                toPersianDigits(
                    index + 1
                ) +

                ". " +

                title +

                NL;


            text +=

                "   📰 " +

                source +

                "  •  🏷 " +

                category;


            if(summary){

                text +=

                    NL +

                    "   📝 " +

                    summary;

            }


            if(
                index <
                news.length - 1
            ){

                text +=

                    NL +

                    "────────────────────────────" +

                    NL +
                    NL;

            }else{

                text +=
                    NL;

            }

        }
    );


    text +=

        NL +

        rubikaFooter();


    return text;

}


/* =====================================================
   COPY RUBIKA
===================================================== */

async function copyForRubika(){

    const text =
        createRubikaText();


    if(!text){

        showToast(
            "📭 خبری برای کپی وجود ندارد."
        );

        return;

    }


    try{

        if(
            navigator.clipboard &&
            window.ClipboardItem
        ){

            const item =
                new ClipboardItem({

                    "text/plain":
                        new Blob(
                            [text],
                            {
                                type:
                                "text/plain"
                            }
                        )

                });


            await navigator.clipboard.write(
                [item]
            );


            showToast(
                "✅ متن آماده روبیکا کپی شد."
            );


            return;

        }

    }catch(error){

        console.log(
            "ClipboardItem failed:",
            error
        );

    }


    try{

        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                text
            );


            showToast(
                "✅ متن آماده روبیکا کپی شد."
            );


            return;

        }

    }catch(error){

        console.log(
            "writeText failed:",
            error
        );

    }


    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.setAttribute(
        "readonly",
        ""
    );


    textarea.style.position =
        "fixed";


    textarea.style.top =
        "0";


    textarea.style.left =
        "-9999px";


    textarea.style.opacity =
        "0";


    textarea.style.whiteSpace =
        "pre";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    try{

        const success =
            document.execCommand(
                "copy"
            );


        if(success){

            showToast(
                "✅ متن آماده روبیکا کپی شد."
            );

        }else{

            showToast(
                "❌ کپی انجام نشد."
            );

        }

    }catch(error){

        console.error(
            error
        );


        showToast(
            "❌ کپی انجام نشد."
        );

    }


    textarea.remove();

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.style.display =
                    "none";

            },
            2500
        );

}
