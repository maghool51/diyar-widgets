<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>اخبار دیار قدمگاه</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Tahoma,Arial,sans-serif;
    direction:rtl;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#b71c1c;
    font-size:24px;
    margin:0 0 10px;
}

.date{
    text-align:center;
    color:#555;
    margin-bottom:20px;
}

.news{
    margin-bottom:20px;
    padding-bottom:18px;
    border-bottom:2px dashed #bbb;
}

.title{
    font-size:18px;
    font-weight:bold;
    line-height:1.9;
}

.info{
    color:#555;
    margin-top:5px;
    line-height:1.8;
}

.summary{
    color:#333;
    line-height:2;
    margin-top:5px;
}

.copy-box{
    margin-top:30px;
    padding:18px;
    background:#fafafa;
    border-radius:14px;
    border:1px solid #ddd;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    font-size:17px;
    cursor:pointer;
    background:#b71c1c;
    color:white;
}

textarea{
    width:100%;
    min-height:500px;
    margin-top:15px;
    box-sizing:border-box;
    padding:15px;
    border:1px solid #ccc;
    border-radius:12px;
    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;
    line-height:1.9;
    direction:rtl;
    resize:vertical;
}

.status{
    text-align:center;
    color:#388e3c;
    margin-top:10px;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>📰 اخبار دیار قدمگاه</h1>

<div class="date" id="date"></div>

<div id="news-container">
در حال دریافت اخبار...
</div>

<div class="copy-box">

<button onclick="copyRubikaNews()">
📋 کپی متن مخصوص روبیکا
</button>

<textarea id="rubikaText" readonly></textarea>

<div id="status" class="status">
✅ متن با موفقیت کپی شد
</div>

</div>

</div>

<script>

const NEWS_URL = "news-summary.json";
const MAX_NEWS = 10;
const SUMMARY_MAX_LENGTH = 170;


/* تبدیل اعداد انگلیسی به فارسی */
function toPersianDigits(text){

    const en = "0123456789";
    const fa = "۰۱۲۳۴۵۶۷۸۹";

    return String(text).replace(/[0-9]/g,function(d){
        return fa[en.indexOf(d)];
    });
}


/* کوتاه کردن خلاصه */
function shorten(text,max){

    if(!text) return "";

    text = text.replace(/\s+/g," ").trim();

    if(text.length <= max)
        return text;

    return text.substring(0,max).trim() + "…";
}


/* تاریخ شمسی */
function getPersianDate(){

    const now = new Date();

    try{

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        ).format(now);

    }catch(e){

        return "";

    }
}


/* ساعت */
function getPersianTime(){

    const now = new Date();

    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour:"2-digit",
                minute:"2-digit",
                hour12:false
            }
        ).format(now);

    }catch(e){

        return "";

    }
}


/* خط جداکننده */
function separator(){

    return "────────────────────────────";
}


/* سربرگ روبیکا */
function makeHeader(){

    return [
        "╔══════════════════════════╗",
        "     🌸🕌💫 اخبار دیار قدمگاه 💫🕌🌸",
        "",
        "       📅 " + getPersianDate(),
        "              🕐 " + getPersianTime(),
        "",
        "╚══════════════════════════╝",
        ""
    ].join("\n");
}


/* کادر انتهایی */
function makeFooter(){

    return [
        "",
        "╔══════════════════════════╗",
        "          📖 متن کامل اخبار",
        "",
        " 🔗 مشاهده و مطالعه خبرها:",
        " https://maghool51.github.io/diyar-widgets/diyar-news/rubika-news.html",
        "",
        "╚══════════════════════════╝",
        "",
        "🏡 دیار قدمگاه",
        "✍️ معقول"
    ].join("\n");
}


/* ساخت متن هر خبر */
function makeNewsText(news,index){

    const number =
        toPersianDigits(index + 1);

    const title =
        news.title || "";

    const source =
        news.source || "";

    const category =
        news.category || "";

    let summary =
        news.summary ||
        news.description ||
        "";

    summary =
        shorten(
            summary,
            SUMMARY_MAX_LENGTH
        );

    const lines = [];

    lines.push(
        "🔴 " + number + ". " + title
    );

    lines.push(
        "   📰 " +
        source +
        "  •  🏷 " +
        category
    );

    if(summary){

        lines.push(
            "   📝 " + summary
        );

    }

    return lines.join("\n");
}


/* ساخت متن نهایی */
function buildRubikaText(newsList){

    const output = [];

    output.push(makeHeader());

    const list =
        newsList.slice(0,MAX_NEWS);

    list.forEach(function(news,index){

        output.push(
            makeNewsText(news,index)
        );

        if(index < list.length - 1){

            output.push("");
            output.push(separator());
            output.push("");

        }

    });

    output.push(makeFooter());

    return output.join("\n");
}


/* نمایش اخبار در صفحه */
function renderNews(newsList){

    const container =
        document.getElementById(
            "news-container"
        );

    container.innerHTML = "";

    newsList
        .slice(0,MAX_NEWS)
        .forEach(function(news,index){

            const div =
                document.createElement("div");

            div.className = "news";

            const title =
                news.title || "";

            const source =
                news.source || "";

            const category =
                news.category || "";

            const summary =
                shorten(
                    news.summary ||
                    news.description ||
                    "",
                    SUMMARY_MAX_LENGTH
                );

            div.innerHTML =

                `<div class="title">
                    🔴 ${toPersianDigits(index+1)}. ${title}
                </div>

                <div class="info">
                    📰 ${source} &nbsp; • &nbsp; 🏷 ${category}
                </div>

                ${
                    summary
                    ?
                    `<div class="summary">
                        📝 ${summary}
                    </div>`
                    :
                    ""
                }`;

            container.appendChild(div);

        });
}


/* دریافت اخبار */
async function loadNews(){

    try{

        const response =
            await fetch(
                NEWS_URL +
                "?t=" +
                Date.now()
            );

        if(!response.ok)
            throw new Error(
                "خطا در دریافت اخبار"
            );

        const data =
            await response.json();

        const newsList =
            Array.isArray(data)
            ? data
            : (
                data.news ||
                data.items ||
                data.articles ||
                []
            );

        if(!newsList.length)
            throw new Error(
                "هیچ خبری پیدا نشد"
            );

        renderNews(newsList);

        document.getElementById(
            "rubikaText"
        ).value =
            buildRubikaText(newsList);

    }catch(error){

        document.getElementById(
            "news-container"
        ).innerHTML =
            "❌ خطا در دریافت اخبار";

        console.error(error);

    }
}


/* کپی متن مخصوص روبیکا */
async function copyRubikaNews(){

    const textarea =
        document.getElementById(
            "rubikaText"
        );

    /*
       قبل از کپی دوباره متن ساخته می‌شود
       تا ساعت کاملاً به‌روز باشد.
    */

    try{

        const response =
            await fetch(
                NEWS_URL +
                "?t=" +
                Date.now()
            );

        const data =
            await response.json();

        const newsList =
            Array.isArray(data)
            ? data
            : (
                data.news ||
                data.items ||
                data.articles ||
                []
            );

        textarea.value =
            buildRubikaText(newsList);

    }catch(e){

        /*
           اگر هنگام کپی اینترنت در دسترس نبود،
           متن قبلی حفظ می‌شود.
        */

    }

    const text =
        textarea.value;

    try{

        await navigator.clipboard.writeText(
            text
        );

    }catch(e){

        textarea.removeAttribute(
            "readonly"
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.setAttribute(
            "readonly",
            ""
        );

    }

    const status =
        document.getElementById(
            "status"
        );

    status.style.display =
        "block";

    setTimeout(function(){

        status.style.display =
            "none";

    },2500);
}


/* نمایش تاریخ در صفحه */
document.getElementById(
    "date"
).textContent =
    "📅 " +
    getPersianDate() +
    "  |  🕐 " +
    getPersianTime();


/* اجرای اولیه */
loadNews();

</script>

</body>
</html>
