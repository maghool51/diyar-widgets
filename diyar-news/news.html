<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#263238"
>

<meta
    name="description"
    content="مهم‌ترین اخبار روز ایران و جهان | دیار قدمگاه"
>

<meta
    name="robots"
    content="index, follow"
>

<title>مهم‌ترین اخبار روز | دیار قدمگاه</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html{
    direction:rtl;
}

body{

    margin:0;

    padding:7px;

    background:#f1f4f6;

    color:#263238;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    line-height:1.8;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:100%;

    max-width:780px;

    margin:0 auto;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:relative;

    overflow:hidden;

    text-align:center;

    color:#fff;

    padding:18px 12px;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #263238,
            #455a64
        );

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.14);

}

.header h1{

    margin:0;

    font-size:21px;

    font-weight:bold;

}

.header-subtitle{

    margin-top:3px;

    font-size:12px;

    opacity:.92;

}

.live-light{

    display:inline-block;

    width:11px;

    height:11px;

    margin-left:5px;

    border-radius:50%;

    background:#ff1744;

    box-shadow:
        0 0 5px #ff1744,
        0 0 12px rgba(255,23,68,.8);

    animation:
        liveBlink 1.2s infinite;

}

@keyframes liveBlink{

    0%,
    100%{

        opacity:1;

        transform:scale(1);

    }

    50%{

        opacity:.25;

        transform:scale(.8);

    }

}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    margin-top:8px;

    padding:10px;

    border-radius:17px;

    background:#fff;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

}


/* =====================================================
   CATEGORIES
===================================================== */

.categories{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

}

.category-btn{

    border:1px solid #d7dde0;

    background:#fff;

    color:#455a64;

    padding:6px 10px;

    border-radius:20px;

    font-family:inherit;

    font-size:11px;

    cursor:pointer;

    transition:
        background .2s,
        color .2s,
        border-color .2s;

}

.category-btn:hover{

    background:#f5f7f8;

}

.category-btn.active{

    color:#fff;

    background:#37474f;

    border-color:#37474f;

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.action-row{

    display:flex;

    gap:7px;

    margin-top:9px;

}

.action-btn{

    flex:1;

    border:0;

    border-radius:12px;

    padding:9px;

    font-family:inherit;

    font-size:12px;

    cursor:pointer;

}

.copy-btn{

    color:#fff;

    background:#1565c0;

}

.refresh-btn{

    color:#263238;

    background:#eceff1;

}

.action-btn:disabled{

    opacity:.65;

    cursor:wait;

}


/* =====================================================
   UPDATE INFO
===================================================== */

.update-info{

    margin-top:7px;

    color:#78909c;

    text-align:center;

    font-size:10px;

}


/* =====================================================
   NEWS LIST
===================================================== */

.news-list{

    margin-top:8px;

}


/* =====================================================
   NEWS CARD
===================================================== */

.news-card{

    position:relative;

    overflow:hidden;

    margin-bottom:7px;

    padding:10px 12px;

    border-radius:16px;

    background:#fff;

    box-shadow:
        0 2px 9px
        rgba(0,0,0,.06);

    transition:
        transform .2s,
        box-shadow .2s;

}

.news-card:hover{

    transform:translateY(-1px);

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.09);

}


/* خط قرمز سمت راست */

.news-card::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    width:4px;

    height:100%;

    background:#ef5350;

}


/* =====================================================
   TITLE
===================================================== */

.news-title{

    padding-right:2px;

    font-size:14px;

    font-weight:bold;

    line-height:1.9;

}

.news-title a{

    color:#263238;

    text-decoration:none;

}

.news-title a:hover{

    color:#1565c0;

}

.news-number{

    color:#d32f2f;

    font-weight:bold;

}


/* =====================================================
   META
===================================================== */

.meta{

    margin-top:3px;

    color:#607d8b;

    font-size:10px;

    line-height:1.8;

}


/* =====================================================
   SUMMARY
===================================================== */

.summary{

    margin-top:6px;

    padding:6px 8px;

    border-right:3px solid #90a4ae;

    border-radius:7px;

    background:#f7f9fa;

    color:#455a64;

    font-size:11px;

    line-height:1.9;

}


/* =====================================================
   READ LINK
===================================================== */

.read-link{

    display:inline-block;

    margin-top:5px;

    color:#1565c0;

    font-size:10px;

    text-decoration:none;

}

.read-link:hover{

    text-decoration:underline;

}


/* =====================================================
   FRESH BADGE
===================================================== */

.fresh-badge{

    display:inline-block;

    margin-right:5px;

    padding:1px 6px;

    border-radius:10px;

    color:#fff;

    background:#e53935;

    font-size:9px;

    vertical-align:middle;

}


/* =====================================================
   FRESH CARD
===================================================== */

.news-card.fresh{

    animation:
        freshPulse 2.5s infinite;

}

@keyframes freshPulse{

    0%,
    100%{

        box-shadow:
            0 2px 9px
            rgba(0,0,0,.06);

    }

    50%{

        box-shadow:
            0 3px 16px
            rgba(229,57,53,.16);

    }

}


/* =====================================================
   STATUS
===================================================== */

.status{

    padding:28px 12px;

    border-radius:16px;

    background:#fff;

    color:#78909c;

    text-align:center;

    font-size:13px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    padding:15px 8px;

    color:#607d8b;

    text-align:center;

    font-size:11px;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    z-index:9999;

    right:50%;

    bottom:18px;

    display:none;

    max-width:90%;

    transform:translateX(50%);

    padding:9px 15px;

    border-radius:11px;

    color:#fff;

    background:#263238;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.25);

    font-size:11px;

    text-align:center;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{

        padding:5px;

    }

    .header{

        padding:17px 8px;

    }

    .header h1{

        font-size:19px;

    }

    .categories{

        gap:5px;

    }

    .category-btn{

        padding:5px 8px;

        font-size:10px;

    }

    .action-row{

        flex-direction:column;

    }

    .news-title{

        font-size:13px;

    }

}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none !important;

        transition:none !important;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">

    <h1>

        <span class="live-light"></span>

        📰 مهم‌ترین اخبار روز

    </h1>

    <div class="header-subtitle">

        🏡 دیار قدمگاه

    </div>

</header>


<!-- ===================================================
     CONTROLS
=================================================== -->

<section class="controls">


    <div
        id="categories"
        class="categories"
    ></div>


    <div class="action-row">


        <button
            id="copyBtn"
            class="action-btn copy-btn"
            type="button"
        >

            📋 کپی برای روبیکا

        </button>


        <button
            id="refreshBtn"
            class="action-btn refresh-btn"
            type="button"
        >

            🔄 بروزرسانی

        </button>


    </div>


    <div
        id="updateInfo"
        class="update-info"
    >

        ⏳ در حال دریافت اخبار...

    </div>


</section>


<!-- ===================================================
     NEWS
=================================================== -->

<main
    id="newsList"
    class="news-list"
>

    <div class="status">

        📰 در حال دریافت آخرین اخبار...

    </div>

</main>


<!-- ===================================================
     FOOTER
=================================================== -->

<footer class="footer">

    🏡 دیار قدمگاه

    <br>

    ✍️ معقول

</footer>


</div>


<!-- ===================================================
     TOAST
=================================================== -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =====================================================
   CONFIG
===================================================== */

"use strict";


const NEWS_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news.json";


const SUMMARY_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";


const NEWS_COUNT = 100;


const CATEGORIES = [

    "همه",

    "سیاسی",

    "اقتصادی",

    "ورزشی",

    "فرهنگی و هنری",

    "اجتماعی",

    "علمی و فناوری",

    "بین‌الملل",

    "متفرقه"

];


let allNews = [];

let summaries = {};

let selectedCategory = "همه";


/* =====================================================
   ELEMENTS
===================================================== */

const newsList =
    document.getElementById("newsList");


const categories =
    document.getElementById("categories");


const updateInfo =
    document.getElementById("updateInfo");


const refreshBtn =
    document.getElementById("refreshBtn");


const copyBtn =
    document.getElementById("copyBtn");


const toast =
    document.getElementById("toast");


/* =====================================================
   NORMALIZE TEXT
===================================================== */

function normalizeText(text){

    return String(text || "")

        .replace(/ي/g,"ی")

        .replace(/ى/g,"ی")

        .replace(/ك/g,"ک")

        .replace(/\u200c/g," ")

        .replace(/\s+/g," ")

        .trim();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    return String(text || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   SAFE URL
===================================================== */

function safeUrl(url){

    try{

        const parsed =
            new URL(url);

        if(

            parsed.protocol === "http:" ||

            parsed.protocol === "https:"

        ){

            return parsed.href;

        }

    }

    catch(error){

        console.warn(
            "URL نامعتبر:",
            url
        );

    }

    return "#";

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(dateValue){

    if(!dateValue){

        return "تاریخ نامشخص";

    }


    const date =
        new Date(dateValue);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return escapeHtml(
            dateValue
        );

    }


    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year:"numeric",
                month:"numeric",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(date);

    }

    catch(error){

        return escapeHtml(
            dateValue
        );

    }

}


/* =====================================================
   IS FRESH
===================================================== */

function isFresh(dateValue){

    const date =
        new Date(dateValue);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return false;

    }


    const difference =
        Date.now() -
        date.getTime();


    return (

        difference >= 0 &&

        difference <=
            60 * 60 * 1000

    );

}


/* =====================================================
   LOAD SUMMARIES
===================================================== */

async function loadSummaries(){

    summaries = {};


    try{

        const response =
            await fetch(

                SUMMARY_URL +
                "?t=" +
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!response.ok){

            console.warn(
                "خطا در summaries:",
                response.status
            );

            return;

        }


        const data =
            await response.json();


        let list = [];


        if(
            Array.isArray(data)
        ){

            list = data;

        }

        else if(
            Array.isArray(data.news)
        ){

            list = data.news;

        }

        else if(
            Array.isArray(data.summaries)
        ){

            list = data.summaries;

        }


        list.forEach(item => {

            if(!item){

                return;

            }


            const link =
                item.link ||
                item.url;


            const title =
                normalizeText(
                    item.title
                );


            const summary =
                item.summary || "";


            if(link){

                summaries[link] =
                    summary;

            }


            if(title){

                summaries[
                    "title:" + title
                ] =
                    summary;

            }

        });


    }

    catch(error){

        console.warn(
            "دریافت خلاصه‌ها ناموفق بود:",
            error
        );

    }

}


/* =====================================================
   GET SUMMARY
===================================================== */

function getSummary(item){

    if(!item){

        return "";

    }


    const link =
        item.link ||
        item.url;


    if(
        link &&
        summaries[link]
    ){

        return summaries[link];

    }


    const title =
        normalizeText(
            item.title
        );


    if(
        title &&
        summaries["title:" + title]
    ){

        return summaries[
            "title:" + title
        ];

    }


    return item.summary || "";

}


/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews(){

    updateInfo.textContent =
        "⏳ در حال دریافت آخرین اخبار...";


    newsList.innerHTML = `

        <div class="status">

            ⏳ در حال دریافت آخرین اخبار...

        </div>

    `;


    try{

        const response =
            await fetch(

                NEWS_URL +
                "?t=" +
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !Array.isArray(data.news)
        ){

            throw new Error(
                "ساختار news.json صحیح نیست."
            );

        }


        allNews =
            data.news
                .slice(0,NEWS_COUNT);


        await loadSummaries();


        renderCategories();

        renderNews();


        const updateDate =
            data.lastUpdatePersian ||
            formatDate(
                data.lastUpdate
            );


        const failedSources =
            Array.isArray(
                data.failedSources
            )
                ? data.failedSources.length
                : 0;


        updateInfo.innerHTML =

            "🕐 آخرین بروزرسانی: " +
            escapeHtml(updateDate) +

            " &nbsp;|&nbsp; " +

            "📰 " +
            allNews.length +
            " خبر" +

            (
                failedSources
                    ? " &nbsp;|&nbsp; ⚠️ " +
                      failedSources +
                      " منبع ناموفق"
                    : ""
            );


    }

    catch(error){

        console.error(
            "خطای دریافت اخبار:",
            error
        );


        newsList.innerHTML = `

            <div class="status">

                ❌ دریافت اخبار با مشکل مواجه شد.

                <br><br>

                <small>

                    لطفاً اتصال اینترنت را بررسی کنید.

                </small>

                <br><br>

                <button
                    onclick="loadNews()"
                    style="
                        border:0;
                        border-radius:10px;
                        padding:8px 15px;
                        background:#263238;
                        color:#fff;
                        font-family:inherit;
                        cursor:pointer;
                    "
                >

                    🔄 تلاش مجدد

                </button>

            </div>

        `;


        updateInfo.textContent =
            "❌ خطا در دریافت اطلاعات";


    }

}


/* =====================================================
   CATEGORY ICON
===================================================== */

function categoryIcon(category){

    const icons = {

        "همه":"📋",

        "سیاسی":"🏛",

        "اقتصادی":"💰",

        "ورزشی":"⚽",

        "فرهنگی و هنری":"🎭",

        "اجتماعی":"👥",

        "علمی و فناوری":"🔬",

        "بین‌الملل":"🌍",

        "متفرقه":"📌"

    };


    return (
        icons[category] ||
        "📌"
    );

}


/* =====================================================
   CATEGORY COUNT
===================================================== */

function categoryCount(category){

    if(
        category === "همه"
    ){

        return allNews.length;

    }


    return allNews.filter(
        item =>

            normalizeText(
                item.category
            ) ===

            normalizeText(
                category
            )

    ).length;

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories(){

    categories.innerHTML = "";


    CATEGORIES.forEach(
        category => {


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "category-btn" +

                (

                    selectedCategory ===
                    category

                        ? " active"

                        : ""

                );


            button.textContent =

                categoryIcon(
                    category
                ) +

                " " +

                category +

                " (" +

                categoryCount(
                    category
                ) +

                ")";


            button.addEventListener(
                "click",
                () => {

                    selectedCategory =
                        category;

                    renderCategories();

                    renderNews();

                }
            );


            categories.appendChild(
                button
            );


        }
    );

}


/* =====================================================
   RENDER NEWS
===================================================== */

function renderNews(){

    let list =
        allNews;


    if(
        selectedCategory !==
        "همه"
    ){

        list =
            allNews.filter(
                item =>

                    normalizeText(
                        item.category
                    ) ===

                    normalizeText(
                        selectedCategory
                    )

            );

    }


    if(!list.length){

        newsList.innerHTML = `

            <div class="status">

                📰 در این دسته خبری وجود ندارد.

            </div>

        `;

        return;

    }


    newsList.innerHTML =

        list.map(
            (item,index) => {


                const title =
                    escapeHtml(
                        item.title ||
                        "بدون عنوان"
                    );


                const link =
                    safeUrl(
                        item.link ||
                        item.url
                    );


                const source =
                    escapeHtml(
                        item.source ||
                        "منبع نامشخص"
                    );


                const flag =
                    escapeHtml(
                        item.flag ||
                        "📰"
                    );


                const category =
                    escapeHtml(
                        item.category ||
                        "متفرقه"
                    );


                const date =
                    formatDate(
                        item.date
                    );


                const summary =
                    escapeHtml(
                        getSummary(item)
                    );


                const fresh =
                    isFresh(
                        item.date
                    );


                return `

                    <article
                        class="news-card ${
                            fresh
                                ? "fresh"
                                : ""
                        }"
                    >


                        <div
                            class="news-title"
                        >

                            <span
                                class="news-number"
                            >

                                ${
                                    index + 1
                                }.

                            </span>


                            <a
                                href="${link}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                ${title}

                            </a>


                            ${
                                fresh
                                    ? `
                                        <span
                                            class="fresh-badge"
                                        >
                                            جدید
                                        </span>
                                      `
                                    : ""
                            }

                        </div>


                        <div
                            class="meta"
                        >

                            ${flag}

                            ${source}

                            &nbsp;|&nbsp;

                            🗂 ${category}

                            &nbsp;|&nbsp;

                            🕐 ${date}

                        </div>


                        ${
                            summary

                                ? `
                                    <div
                                        class="summary"
                                    >

                                        ${summary}

                                    </div>
                                  `

                                : ""
                        }


                        ${
                            link !== "#"

                                ? `
                                    <a
                                        class="read-link"
                                        href="${link}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >

                                        🔗 مشاهده خبر کامل

                                    </a>
                                  `

                                : ""
                        }


                    </article>

                `;

            }

        ).join("");

}


/* =====================================================
   COPY FOR RUBIKA
===================================================== */

async function copyForRubika(){

    let list =
        allNews;


    if(
        selectedCategory !==
        "همه"
    ){

        list =
            allNews.filter(
                item =>

                    normalizeText(
                        item.category
                    ) ===

                    normalizeText(
                        selectedCategory
                    )

            );

    }


    if(!list.length){

        showToast(
            "خبری برای کپی وجود ندارد."
        );

        return;

    }


    let text =
        "📰 مهم‌ترین اخبار روز\n";


    text +=
        "🏡 دیار قدمگاه\n\n";


    list.forEach(
        (item,index) => {


            text +=
                `${index + 1}. `;


            text +=
                `${item.title || "بدون عنوان"}\n`;


            text +=
                `📡 ${item.source || "منبع نامشخص"}`;


            if(item.category){

                text +=
                    ` | 🗂 ${item.category}`;

            }


            text +=
                `\n🕐 ${formatDate(item.date)}\n`;


            const summary =
                getSummary(item);


            if(summary){

                text +=
                    `\n${summary}\n`;

            }


            if(item.link){

                text +=
                    `🔗 ${item.link}\n`;

            }


            text +=
                "\n";

        }
    );


    text +=
        "🏡 دیار قدمگاه\n";


    text +=
        "✍️ معقول";


    try{

        await navigator.clipboard.writeText(
            text
        );


        showToast(
            "✅ اخبار برای روبیکا کپی شد."
        );

    }

    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        showToast(
            "✅ اخبار کپی شد."
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.style.display =
                    "none";

            },
            2500
        );

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

refreshBtn.addEventListener(
    "click",
    async () => {


        refreshBtn.disabled =
            true;


        refreshBtn.textContent =
            "⏳ در حال بروزرسانی...";


        await loadNews();


        refreshBtn.disabled =
            false;


        refreshBtn.textContent =
            "🔄 بروزرسانی";


        showToast(
            "✅ اخبار بروزرسانی شد."
        );

    }
);


/* =====================================================
   COPY BUTTON
===================================================== */

copyBtn.addEventListener(
    "click",
    copyForRubika
);


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    () => {

        loadNews();

    },
    10 * 60 * 1000
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadNews();

</script>
