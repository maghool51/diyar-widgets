<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24">

  <!-- background -->
  <rect x="2" y="2" width="20" height="20" rx="6"
        fill="#7E57C2"
        opacity="0.15"/>

  <!-- eye shape -->
  <path d="M3.8 12
           C5.8 8.5 8.6 6.8
           12 6.8
           C15.4 6.8 18.2 8.5
           20.2 12
           C18.2 15.5 15.4 17.2
           12 17.2
           C8.6 17.2 5.8 15.5 3.8 12Z"
        fill="none"
        stroke="#7E57C2"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- pupil -->
  <circle cx="12"
          cy="12"
          r="3"
          fill="#7E57C2"/>

  <!-- highlight -->
  <circle cx="11"
          cy="11"
          r="1"
          fill="#FFFFFF"/>

</svg>
