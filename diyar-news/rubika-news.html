<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>انتخاب اخبار روبیکا | دیار قدمگاه</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 0;
        background: #f4f6f7;
        color: #263238;
        font-family:
            Tahoma,
            Arial,
            "Segoe UI",
            sans-serif;
        line-height: 1.8;
    }

    button,
    input,
    select,
    textarea {
        font-family: inherit;
    }

    button {
        cursor: pointer;
    }

    .container {
        width: min(1100px, calc(100% - 24px));
        margin: 18px auto 30px;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
        background: #263238;
        color: #fff;
        border-radius: 18px;
        padding: 22px 18px;
        text-align: center;
        box-shadow: 0 5px 18px rgba(0, 0, 0, .10);
    }

    .header h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 800;
    }

    .header p {
        margin: 7px 0 0;
        opacity: .9;
        font-size: 14px;
    }

    /* =========================
       STATS
       ========================= */

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 14px 0;
    }

    .stat {
        background: #fff;
        border-radius: 14px;
        padding: 13px 10px;
        text-align: center;
        box-shadow: 0 2px 9px rgba(0, 0, 0, .06);
        border: 1px solid #e3e7e9;
    }

    .stat-number {
        display: block;
        font-size: 23px;
        font-weight: 800;
        color: #263238;
    }

    .stat-label {
        display: block;
        margin-top: 2px;
        color: #607078;
        font-size: 12px;
    }

    /* =========================
       PANEL
       ========================= */

    .panel {
        background: #fff;
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, .06);
        border: 1px solid #e5e9eb;
    }

    .panel-title {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 800;
    }

    /* =========================
       CATEGORY BUTTONS
       ========================= */

    .category-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .category-btn {
        min-height: 44px;
        border: 1px solid #cfd8dc;
        background: #fff;
        color: #37474f;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        transition: .2s ease;
    }

    .category-btn:hover {
        background: #eceff1;
    }

    .category-btn.active {
        background: #263238;
        color: #fff;
        border-color: #263238;
    }

    .category-count {
        display: inline-block;
        margin-right: 4px;
        padding: 1px 7px;
        border-radius: 20px;
        background: #eceff1;
        color: #455a64;
        font-size: 11px;
    }

    .category-btn.active .category-count {
        background: rgba(255,255,255,.18);
        color: #fff;
    }

    /* =========================
       SEARCH / FILTER
       ========================= */

    .filter-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 190px;
        gap: 10px;
        margin-bottom: 12px;
    }

    .search-wrap {
        position: relative;
    }

    .search-icon {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        pointer-events: none;
    }

    .search-input {
        width: 100%;
        min-height: 48px;
        border: 1px solid #cfd8dc;
        border-radius: 12px;
        padding: 10px 42px 10px 40px;
        outline: none;
        font-size: 14px;
        background: #fafbfc;
    }

    .search-input:focus {
        border-color: #607d8b;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(96,125,139,.10);
    }

    .clear-search {
        position: absolute;
        left: 7px;
        top: 50%;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #78909c;
        font-size: 18px;
        display: none;
    }

    .sort-select,
    .count-select {
        width: 100%;
        min-height: 48px;
        border: 1px solid #cfd8dc;
        border-radius: 12px;
        background: #fafbfc;
        padding: 8px 12px;
        font-size: 13px;
        outline: none;
    }

    .sort-select:focus,
    .count-select:focus {
        border-color: #607d8b;
    }

    .filter-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }

    .only-selected-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 7px 12px;
        border-radius: 12px;
        background: #f1f4f5;
        cursor: pointer;
        user-select: none;
        font-size: 13px;
        font-weight: 700;
    }

    .only-selected-label input {
        width: 19px;
        height: 19px;
        margin: 0;
        accent-color: #263238;
    }

    /* =========================
       ACTION BUTTONS
       ========================= */

    .actions {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 9px;
    }

    .action-btn {
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        padding: 9px 10px;
        font-size: 13px;
        font-weight: 800;
        transition: .2s ease;
    }

    .action-btn:hover {
        transform: translateY(-1px);
    }

    .action-primary {
        background: #263238;
        color: #fff;
    }

    .action-secondary {
        background: #eceff1;
        color: #37474f;
    }

    .action-danger {
        background: #ffebee;
        color: #b71c1c;
    }

    .action-refresh {
        background: #e8f5e9;
        color: #1b5e20;
    }

    .action-copy {
        background: #e3f2fd;
        color: #0d47a1;
    }

    /* =========================
       SELECTION INFO
       ========================= */

    .selection-info {
        background: #f7f9fa;
        border: 1px dashed #cfd8dc;
        border-radius: 13px;
        padding: 11px 13px;
        font-size: 13px;
        color: #455a64;
    }

    .selection-summary-title {
        font-weight: 800;
        margin-bottom: 6px;
    }

    .selection-breakdown {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .selection-chip {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #dce2e5;
        font-size: 12px;
        color: #37474f;
    }

    .selection-chip strong {
        color: #263238;
    }

    /* =========================
       NEWS
       ========================= */

    .news-list {
        display: grid;
        gap: 11px;
    }

    .news-card {
        position: relative;
        background: #fff;
        border-radius: 16px;
        border: 1px solid #e0e5e7;
        padding: 14px;
        transition: .2s ease;
    }

    .news-card.selected {
        border-color: #607d8b;
        box-shadow: 0 3px 14px rgba(38,50,56,.10);
        background: #fafcfd;
    }

    .news-card-header {
        display: flex;
        align-items: flex-start;
        gap: 11px;
    }

    .news-checkbox {
        width: 22px;
        height: 22px;
        margin-top: 2px;
        flex: 0 0 auto;
        accent-color: #263238;
        cursor: pointer;
    }

    .news-content {
        flex: 1;
        min-width: 0;
    }

    .news-title {
        margin: 0;
        font-size: 16px;
        line-height: 1.8;
        font-weight: 800;
        color: #263238;
    }

    .news-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
    }

    .meta-chip {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        background: #f1f3f4;
        color: #546e7a;
        font-size: 11px;
    }

    .news-summary {
        margin: 9px 0 0;
        color: #455a64;
        font-size: 13px;
        line-height: 1.9;
    }

    .news-date {
        margin-top: 7px;
        color: #78909c;
        font-size: 11px;
    }

    .new-badge {
        display: inline-block;
        margin-right: 5px;
        padding: 1px 6px;
        border-radius: 6px;
        background: #ffebee;
        color: #c62828;
        font-size: 10px;
        font-weight: 800;
    }

    .empty-state {
        background: #fff;
        border-radius: 16px;
        padding: 30px 16px;
        text-align: center;
        color: #78909c;
        border: 1px dashed #cfd8dc;
    }

    /* =========================
       PUBLISHER
       ========================= */

    .publisher-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .field-label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 800;
        color: #455a64;
    }

    .text-input {
        width: 100%;
        min-height: 46px;
        border: 1px solid #cfd8dc;
        border-radius: 11px;
        padding: 9px 12px;
        font-size: 13px;
        outline: none;
        background: #fafbfc;
    }

    .text-input:focus {
        border-color: #607d8b;
        background: #fff;
    }

    /* =========================
       PREVIEW
       ========================= */

    .preview {
        width: 100%;
        min-height: 430px;
        resize: vertical;
        border: 1px solid #cfd8dc;
        border-radius: 14px;
        padding: 14px;
        background: #fafbfc;
        color: #263238;
        font-family: Tahoma, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.9;
        direction: rtl;
        text-align: right;
        outline: none;
    }

    .preview:focus {
        border-color: #607d8b;
        background: #fff;
    }

    .preview-actions {
        margin-top: 10px;
    }

    /* =========================
       STATUS
       ========================= */

    .status-box {
        margin-bottom: 14px;
        padding: 11px 14px;
        border-radius: 12px;
        background: #e8f5e9;
        color: #1b5e20;
        font-size: 13px;
        display: none;
    }

    .status-box.error {
        background: #ffebee;
        color: #b71c1c;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
        margin-top: 16px;
        background: #263238;
        color: #fff;
        border-radius: 16px;
        padding: 16px;
        text-align: center;
        font-size: 12px;
        opacity: .95;
    }

    /* =========================
       TOAST
       ========================= */

    .toast {
        position: fixed;
        right: 50%;
        bottom: 22px;
        transform: translateX(50%) translateY(120px);
        max-width: min(92vw, 520px);
        background: #263238;
        color: #fff;
        padding: 12px 17px;
        border-radius: 12px;
        box-shadow: 0 6px 25px rgba(0,0,0,.20);
        font-size: 13px;
        text-align: center;
        z-index: 9999;
        opacity: 0;
        transition: .25s ease;
        pointer-events: none;
    }

    .toast.show {
        transform: translateX(50%) translateY(0);
        opacity: 1;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 800px) {
        .actions {
            grid-template-columns: repeat(2, 1fr);
        }

        .action-copy {
            grid-column: 1 / -1;
        }

        .stats {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .container {
            width: min(100% - 12px, 1100px);
            margin-top: 7px;
        }

        .header {
            border-radius: 15px;
            padding: 18px 12px;
        }

        .header h1 {
            font-size: 20px;
        }

        .header p {
            font-size: 12px;
        }

        .panel {
            border-radius: 15px;
            padding: 12px;
        }

        .filter-grid {
            grid-template-columns: 1fr;
        }

        .publisher-grid {
            grid-template-columns: 1fr;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }

        .category-btn {
            width: 100%;
            border-radius: 12px;
            padding: 9px 7px;
        }

        .actions {
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .action-btn {
            min-height: 50px;
            font-size: 12px;
        }

        .action-copy {
            grid-column: 1 / -1;
        }

        .news-card {
            padding: 12px;
            border-radius: 14px;
        }

        .news-title {
            font-size: 14px;
        }

        .news-summary {
            font-size: 12px;
        }

        .preview {
            min-height: 380px;
        }
    }

    @media (max-width: 420px) {
        .stats {
            gap: 7px;
        }

        .stat {
            padding: 10px 6px;
        }

        .stat-number {
            font-size: 20px;
        }

        .stat-label {
            font-size: 10px;
        }

        .category-buttons {
            grid-template-columns: 1fr 1fr;
        }

        .selection-chip {
            font-size: 11px;
        }

        .only-selected-label {
            width: 100%;
            justify-content: center;
        }
    }
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>📰 اخبار روبیکا | دیار قدمگاه</h1>
        <p>انتخاب و آماده‌سازی اخبار برای انتشار در روبیکا</p>
    </header>

    <div class="stats">
        <div class="stat">
            <span class="stat-number" id="totalCount">۰</span>
            <span class="stat-label">کل اخبار</span>
        </div>

        <div class="stat">
            <span class="stat-number" id="categoryCount">۰</span>
            <span class="stat-label">این دسته</span>
        </div>

        <div class="stat">
            <span class="stat-number" id="selectedCount">۰</span>
            <span class="stat-label">انتخاب‌شده</span>
        </div>

        <div class="stat">
            <span class="stat-number" id="displayCount">۰</span>
            <span class="stat-label">در حال نمایش</span>
        </div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <!-- دسته‌بندی -->
    <section class="panel">
        <h2 class="panel-title">🏷 انتخاب دسته خبری</h2>
        <div id="categoryButtons" class="category-buttons"></div>
    </section>

    <!-- جستجو و مرتب‌سازی -->
    <section class="panel">
        <h2 class="panel-title">🔍 جستجو و فیلتر اخبار</h2>

        <div class="filter-grid">

            <div class="search-wrap">
                <span class="search-icon">🔍</span>

                <input
                    id="searchInput"
                    class="search-input"
                    type="search"
                    inputmode="search"
                    autocomplete="off"
                    placeholder="جستجو در عنوان، منبع یا دسته خبر..."
                    aria-label="جستجو در اخبار"
                >

                <button
                    id="clearSearchBtn"
                    class="clear-search"
                    type="button"
                    aria-label="پاک کردن جستجو"
                >✕</button>
            </div>

            <select id="sortSelect" class="sort-select" aria-label="مرتب‌سازی اخبار">
                <option value="newest">🕐 جدیدترین‌ها</option>
                <option value="oldest">🕐 قدیمی‌ترین‌ها</option>
                <option value="selected">☑️ انتخاب‌شده‌ها در ابتدا</option>
            </select>

        </div>

        <div class="filter-options">

            <label class="only-selected-label">
                <input
                    type="checkbox"
                    id="onlySelected"
                >
                ☑️ فقط خبرهای انتخاب‌شده
            </label>

            <select id="newsCount" class="count-select" style="max-width:220px;">
                <option value="5">نمایش ۵ خبر</option>
                <option value="10" selected>نمایش ۱۰ خبر</option>
                <option value="15">نمایش ۱۵ خبر</option>
                <option value="20">نمایش ۲۰ خبر</option>
                <option value="all">نمایش همه</option>
            </select>

        </div>
    </section>

    <!-- مدیریت انتخاب -->
    <section class="panel">

        <h2 class="panel-title">☑️ مدیریت انتخاب‌ها</h2>

        <div class="actions">

            <button
                id="selectAllBtn"
                class="action-btn action-primary"
                type="button"
            >
                ☑️ انتخاب همه این دسته
            </button>

            <button
                id="clearAllBtn"
                class="action-btn action-secondary"
                type="button"
            >
                ⬜ لغو انتخاب این دسته
            </button>

            <button
                id="clearEverythingBtn"
                class="action-btn action-danger"
                type="button"
            >
                🧹 لغو انتخاب همه
            </button>

            <button
                id="refreshBtn"
                class="action-btn action-refresh"
                type="button"
            >
                🔄 بروزرسانی
            </button>

            <button
                id="copyBtn"
                class="action-btn action-copy"
                type="button"
            >
                📋 کپی متن روبیکا
            </button>

        </div>

        <div
            id="selectionInfo"
            class="selection-info"
            style="margin-top:12px;"
        >
            هیچ خبری انتخاب نشده است.
        </div>

    </section>

    <!-- اخبار -->
    <section class="panel">
        <h2 class="panel-title">📰 فهرست اخبار</h2>

        <div id="newsContainer" class="news-list"></div>
    </section>

    <!-- مشخصات منتشرکننده -->
    <section class="panel">

        <h2 class="panel-title">👤 مشخصات منتشرکننده</h2>

        <div class="publisher-grid">

            <div>
                <label class="field-label" for="publisherName">
                    نام منتشرکننده
                </label>

                <input
                    id="publisherName"
                    class="text-input"
                    type="text"
                    maxlength="60"
                    placeholder="مثلاً ادمین"
                >
            </div>

            <div>
                <label class="field-label" for="publisherRubika">
                    لینک روبیکا
                </label>

                <input
                    id="publisherRubika"
                    class="text-input"
                    type="url"
                    placeholder="https://rubika.ir/..."
                >
            </div>

        </div>

    </section>

    <!-- پیش‌نمایش -->
    <section class="panel">

        <h2 class="panel-title">📋 پیش‌نمایش متن روبیکا</h2>

        <textarea
            id="preview"
            class="preview"
            readonly
            placeholder="پس از انتخاب خبرها، متن آماده انتشار در این قسمت نمایش داده می‌شود."
        ></textarea>

        <div class="preview-actions">

            <button
                id="copyBtnBottom"
                class="action-btn action-copy"
                type="button"
                style="width:100%;"
            >
                📋 کپی متن روبیکا
            </button>

        </div>

    </section>

    <footer class="footer">
        🏡 دیار قدمگاه
    </footer>

</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   تنظیمات
   ========================================================= */

const SUMMARY_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";

const RUBIKA_PAGE_URL =
    "https://maghool51.github.io/diyar-widgets/diyar-news/news.html";

const MAX_SUMMARY_LENGTH = 150;

const DEFAULT_NEWS_COUNT = 10;

const ADMIN_STORAGE_KEY =
    "diyarRubikaPublisherV1";

const SELECTION_STORAGE_KEY =
    "diyarRubikaSelectedNewsV1";

const DEFAULT_ADMIN_NAME =
    "ادمین";

const DEFAULT_ADMIN_RUBIKA =
    "";

/* =========================================================
   دسته‌ها
   ========================================================= */

const CATEGORY_LIST = [
    { id: "all", title: "همه" },
    { id: "سیاسی", title: "سیاسی" },
    { id: "بین‌الملل", title: "بین‌الملل" },
    { id: "اقتصادی", title: "اقتصادی" },
    { id: "اجتماعی", title: "اجتماعی" },
    { id: "ورزشی", title: "ورزشی" },
    { id: "علمی و فناوری", title: "علمی و فناوری" },
    { id: "فرهنگی و هنری", title: "فرهنگی و هنری" },
    { id: "متفرقه", title: "متفرقه" }
];

/* =========================================================
   وضعیت برنامه
   ========================================================= */

let allNews = [];

let currentCategory = "all";

let newsCountSetting =
    DEFAULT_NEWS_COUNT;

let selectedKeys = new Set();

let publisherName =
    DEFAULT_ADMIN_NAME;

let publisherRubika =
    DEFAULT_ADMIN_RUBIKA;

let searchQuery = "";

let sortMode = "newest";

let onlySelected = false;

/* =========================================================
   ابزارهای عمومی
   ========================================================= */

function toPersianDigits(value) {
    return String(value ?? "")
        .replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}

function decodeHtmlEntities(text) {
    if (!text) {
        return "";
    }

    const textarea =
        document.createElement("textarea");

    textarea.innerHTML = String(text);

    return textarea.value;
}

function cleanText(text) {
    if (text === null || text === undefined) {
        return "";
    }

    let result =
        decodeHtmlEntities(String(text));

    result = result
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<\/p>/gi, "\n")
        .replace(/<[^>]*>/g, " ");

    result = result
        .replace(/\u200c+/g, "\u200c")
        .replace(/[ \t]+/g, " ")
        .replace(/\n\s+/g, "\n")
        .trim();

    return result;
}

function cleanSummary(text) {

    let result =
        cleanText(text);

    if (!result) {
        return "";
    }

    if (result.length > MAX_SUMMARY_LENGTH) {
        result =
            result.slice(0, MAX_SUMMARY_LENGTH).trim();

        const lastSpace =
            result.lastIndexOf(" ");

        if (lastSpace > 80) {
            result =
                result.slice(0, lastSpace);
        }

        result += "…";
    }

    return result;
}

function isSafeHttpUrl(url) {

    if (!url) {
        return false;
    }

    try {
        const parsed =
            new URL(String(url).trim());

        return (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        );

    } catch {
        return false;
    }
}

function normalizeRubikaUrl(url) {

    if (!url) {
        return "";
    }

    let value =
        String(url).trim();

    if (!/^https?:\/\//i.test(value)) {
        value =
            "https://" + value;
    }

    try {

        const parsed =
            new URL(value);

        const host =
            parsed.hostname
                .toLowerCase()
                .replace(/^www\./, "");

        if (host !== "rubika.ir") {
            return "";
        }

        return parsed.toString();

    } catch {
        return "";
    }
}

function sanitizePublisherName(name) {

    let value =
        cleanText(name);

    value =
        value.replace(/\s+/g, " ").trim();

    if (!value) {
        value = DEFAULT_ADMIN_NAME;
    }

    return value.slice(0, 60);
}

/* =========================================================
   کلید یکتا برای خبر
   ========================================================= */

function getItemKey(item) {

    if (!item || typeof item !== "object") {
        return "";
    }

    if (item.link) {
        return "link:" + String(item.link).trim();
    }

    if (item.id !== undefined && item.id !== null) {
        return "id:" + String(item.id);
    }

    return [
        item.title || "",
        item.source || "",
        item.category || "",
        item.pubDate || item.date || ""
    ]
        .map(value =>
            cleanText(value).toLowerCase()
        )
        .join("|");
}

/* =========================================================
   فیلتر دسته
   ========================================================= */

function getFilteredNews() {

    if (currentCategory === "all") {
        return [...allNews];
    }

    return allNews.filter(
        item =>
            cleanText(item.category) ===
            currentCategory
    );
}

/* =========================================================
   جستجو
   ========================================================= */

function matchesSearch(item) {

    if (!searchQuery) {
        return true;
    }

    const query =
        searchQuery
            .trim()
            .toLocaleLowerCase("fa");

    if (!query) {
        return true;
    }

    const searchableText = [
        item.title,
        item.source,
        item.category
    ]
        .map(value =>
            cleanText(value)
                .toLocaleLowerCase("fa")
        )
        .join(" ");

    return searchableText.includes(query);
}

/* =========================================================
   تاریخ
   ========================================================= */

function getNewsTimestamp(item) {

    const value =
        item.pubDate ||
        item.published ||
        item.date ||
        item.createdAt ||
        item.timestamp;

    if (!value) {
        return 0;
    }

    const timestamp =
        new Date(value).getTime();

    return Number.isNaN(timestamp)
        ? 0
        : timestamp;
}

function isNewNews(item) {

    const timestamp =
        getNewsTimestamp(item);

    if (!timestamp) {
        return false;
    }

    const age =
        Date.now() - timestamp;

    return (
        age >= 0 &&
        age <= 24 * 60 * 60 * 1000
    );
}

function formatNewsDate(item) {

    const timestamp =
        getNewsTimestamp(item);

    if (!timestamp) {
        return "";
    }

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        ).format(
            new Date(timestamp)
        );

    } catch {
        return "";
    }
}

function formatPersianDate(date = new Date()) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "numeric",
                day: "numeric"
            }
        ).format(date);

    } catch {

        return "";
    }
}

function formatPersianTime(date = new Date()) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return "";
    }
}

/* =========================================================
   مرتب‌سازی
   ========================================================= */

function sortNews(news) {

    const result =
        [...news];

    if (sortMode === "selected") {

        result.sort((a, b) => {

            const aSelected =
                selectedKeys.has(
                    getItemKey(a)
                ) ? 1 : 0;

            const bSelected =
                selectedKeys.has(
                    getItemKey(b)
                ) ? 1 : 0;

            if (aSelected !== bSelected) {
                return bSelected - aSelected;
            }

            return (
                getNewsTimestamp(b) -
                getNewsTimestamp(a)
            );
        });

        return result;
    }

    if (sortMode === "oldest") {

        result.sort(
            (a, b) =>
                getNewsTimestamp(a) -
                getNewsTimestamp(b)
        );

        return result;
    }

    result.sort(
        (a, b) =>
            getNewsTimestamp(b) -
            getNewsTimestamp(a)
    );

    return result;
}

/* =========================================================
   اخبار قابل نمایش
   ========================================================= */

function getDisplayedNews() {

    let result =
        getFilteredNews();

    result =
        result.filter(
            matchesSearch
        );

    if (onlySelected) {

        result =
            result.filter(
                item =>
                    selectedKeys.has(
                        getItemKey(item)
                    )
            );
    }

    result =
        sortNews(result);

    if (newsCountSetting !== "all") {

        const limit =
            Number(newsCountSetting);

        if (
            Number.isFinite(limit) &&
            limit > 0
        ) {
            result =
                result.slice(0, limit);
        }
    }

    return result;
}

/* =========================================================
   اخبار قابل انتشار
   ========================================================= */

function getPublishNews() {

    return allNews.filter(
        item =>
            selectedKeys.has(
                getItemKey(item)

    );
}

function getCategoryCount(categoryId) {

    if (categoryId === "all") {
        return allNews.length;

    return allNews.filter(

   ========================================================= */

function renderNews() {

    const container =
        document.getElementById(
            "newsContainer"
        );

    container.innerHTML = "";

    const news =
        getDisplayedNews();

    if (!news.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty-state";

        if (onlySelected && !selectedKeys.size) {

            empty.textContent =
                "☑️ هنوز خبری انتخاب نشده است.";

        } else if (searchQuery) {

            empty.textContent =
                "🔍 خبری مطابق جستجوی شما پیدا نشد.";

        } else {

            empty.textContent =
                "📰 خبری برای نمایش وجود ندارد.";
        }

        container.appendChild(empty);

        return;
    }

    news.forEach(item => {

        const key =
            getItemKey(item);

        const selected =
            selectedKeys.has(key);

        const card =
            document.createElement("article");

        card.className =
            "news-card" +
            (
                selected
                    ? " selected"
                    : ""
            );

        const header =
            document.createElement("div");

        header.className =
            "news-card-header";

        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.className =
            "news-checkbox";

        checkbox.checked =
            selected;

        checkbox.setAttribute(
            "aria-label",
            "انتخاب خبر"
        );

        checkbox.addEventListener(
            "change",
            () => {

                if (checkbox.checked) {
                    selectedKeys.add(key);
                } else {
                    selectedKeys.delete(key);
                }

                saveSelectionSettings();

                renderAll();
            }
        );

        const content =
            document.createElement("div");

        content.className =
            "news-content";

        const title =
            document.createElement("h3");

        title.className =
            "news-title";

        title.textContent =
            cleanText(item.title);

        content.appendChild(title);

        const meta =
            document.createElement("div");

        meta.className =
            "news-meta";

        if (item.source) {

            const source =
                document.createElement("span");

            source.className =
                "meta-chip";

            source.textContent =
                "📰 " +
                cleanText(item.source);

            meta.appendChild(source);
        }

        if (item.category) {

            const category =
                document.createElement("span");

            category.className =
                "meta-chip";

            category.textContent =
                "🏷 " +
                cleanText(item.category);

            meta.appendChild(category);
        }

        if (isNewNews(item)) {

            const badge =
                document.createElement("span");

            badge.className =
                "new-badge";

            badge.textContent =
                "جدید";

            meta.appendChild(badge);
        }

        content.appendChild(meta);

        const summary =
            cleanSummary(
                item.summary ||
                item.description ||
                ""
            );

        if (summary) {

            const summaryElement =
                document.createElement("p");

            summaryElement.className =
                "news-summary";

            summaryElement.textContent =
                "📝 " + summary;

            content.appendChild(
                summaryElement
            );
        }

        const date =
            formatNewsDate(item);

        if (date) {

            const dateElement =
                document.createElement("div");

            dateElement.className =
                "news-date";

            dateElement.textContent =
                "📅 " +
                date;

            content.appendChild(
                dateElement
            );
        }

        header.appendChild(checkbox);
        header.appendChild(content);

        card.appendChild(header);

        card.addEventListener(
            "click",
            event => {

                if (
                    event.target === checkbox ||
                    event.target.closest("button") ||
                    event.target.closest("a")
                ) {
                    return;
                }

                checkbox.checked =
                    !checkbox.checked;

                checkbox.dispatchEvent(
                    new Event("change")
                );
            }
        );

        container.appendChild(card);
    });
}

    title.textContent =

    element.innerHTML = "";

    element.appendChild(title);

    const breakdown =
        document.createElement("div");

    breakdown.className =
        "selection-breakdown";

/* =========================================================
   متن روبیکا
   ========================================================= */

function rubikaHeader() {

    const now =
        new Date();

    return [
        "╔══════════════════════════╗",
        "     🌸🕌💫 اخبار دیار قدمگاه 💫🕌🌸",
        "",
        "        📅 " +
            formatPersianDate(now),
        "             🕐 " +
            formatPersianTime(now),
        "",
        "╚══════════════════════════╝",
        ""
    ].join("\n");
}

function rubikaFooter() {

    const lines = [
        "",
        "╔══════════════════════════╗",
        "          📖 متن کامل اخبار",
        "",
        "       🔗 مشاهده و مطالعه خبرها:",
        RUBIKA_PAGE_URL,
        "",
        "╚══════════════════════════╝",
        "",
        "🏡 دیار قدمگاه",
        "✍️ " + publisherName
    ];

    if (publisherRubika) {

        lines.push(
            "🔗 روبیکا: " +
            publisherRubika
        );
    }

    return lines.join("\n");
}

function createRubikaText() {

    const news =
        getPublishNews();

    if (!news.length) {
        return "";
    }

    const parts = [
        rubikaHeader()
    ];

    news.forEach((item, index) => {

        const title =
            cleanText(item.title);

        const source =
            cleanText(item.source);

        const category =
            cleanText(item.category);

        const summary =
            cleanSummary(
                item.summary ||
                item.description ||
                ""
            );

        parts.push(
            "🔴 " + title
        );

        if (source || category) {

            let meta =
                "   ";

            if (source) {
                meta +=
                    "📰 " + source;
            }

            if (category) {

                if (source) {
                    meta +=
                        "  •  ";
                }

                meta +=
                    "🏷 " + category;
            }

            parts.push(meta);
        }

        if (summary) {

            parts.push(
                "   📝 " + summary
            );
        }

        if (index < news.length - 1) {

            parts.push(
                "",
                "──────────────────────────",
                ""
            );
        }
    });

    parts.push(
        rubikaFooter()
    );

    return parts.join("\n");
}

/* =========================================================
   کپی
   ========================================================= */

async function fallbackCopy(text) {

    const textarea =
        document.createElement("textarea");

    textarea.value =
        text;

    textarea.style.position =
        "fixed";

    textarea.style.top =
        "-9999px";

    textarea.style.left =
        "-9999px";

    textarea.setAttribute(
        "readonly",
        ""
    );

    document.body.appendChild(
        textarea
    );

    textarea.select();
    textarea.setSelectionRange(
        0,
        textarea.value.length
    );

    let success = false;

    try {
        success =
            document.execCommand(
                "copy"
            );
    } catch {
        success = false;
    }

    document.body.removeChild(
        textarea
    );

    return success;
}

async function copyRubikaText() {

    const news =
        getPublishNews();

    const count =
        news.length;

    if (!count) {

        showToast(
            "⚠️ ابتدا حداقل یک خبر را انتخاب کنید."
        );

        return;
    }

    savePublisherSettings();

    const text =
        createRubikaText();

    let copied =
        false;

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

            copied = true;
        }

    } catch {
        copied = false;
    }

    if (!copied) {
        copied =
            await fallbackCopy(text);
    }

    if (copied) {

        showToast(
            "✅ متن " +
            toPersianDigits(count) +
            " خبر برای انتشار در روبیکا کپی شد."
        );

    } else {

        showToast(
            "❌ کپی متن انجام نشد. لطفاً دوباره تلاش کنید."
        );
    }
}

    if (showMessage) {

        showStatus(
            "⏳ در حال دریافت آخرین اخبار..."
        );
    }

    try {

        const separator =
            SUMMARY_URL.includes("?")
                ? "&"
                : "?";

        const url =
            SUMMARY_URL +
            separator +
            "_=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache: "no-store",
                    headers: {
                        "Cache-Control":
                            "no-cache"
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        let incomingNews = [];

        if (Array.isArray(data)) {

            incomingNews =
                data;

        } else if (
            data &&
            Array.isArray(data.news)
        ) {

            incomingNews =
                data.news;

        } else {

            throw new Error(
                "ساختار فایل اخبار معتبر نیست."
            );
        }

        allNews =
            incomingNews
                .filter(
                    item =>
                        item &&
                        cleanText(item.title)
                )
                .map(item => ({
                    ...item,
                    title:
                        cleanText(item.title),
                    source:
                        cleanText(item.source),
                    category:
                        cleanText(item.category),
                    summary:
                        cleanSummary(
                            item.summary ||
                            item.description ||
                            ""
                        )
                }));

        /*
           فقط انتخاب خبرهایی که هنوز
           در news-summary.json وجود دارند
           حفظ می‌شوند.
        */

        const validKeys =
            new Set(
                allNews.map(
                    getItemKey
                )
            );

        selectedKeys =
            new Set(
                [...selectedKeys]
                    .filter(
                        key =>
                            validKeys.has(key)
                    )
            );

        saveSelectionSettings();

        buildCategoryButtons();
        renderAll();

        hideStatus();

        if (showMessage) {

            showToast(
                "🔄 اخبار با موفقیت بروزرسانی شد."
            );
        }

    } catch (error) {

        console.error(
            "خطا در دریافت اخبار:",
            error
        );

        showStatus(
            "❌ دریافت اخبار با خطا مواجه شد. لطفاً دوباره تلاش کنید.",
            true
        );

    } finally {

        if (refreshButton) {

            refreshButton.disabled =
                false;

            refreshButton.textContent =
                "🔄 بروزرسانی";
        }
    }
}

/* =========================================================
   رندر کامل
   ========================================================= */

function renderAll() {

    buildCategoryButtons();

    renderNews();

    updateSelectionInfo();

    updateStats();

    updatePreview();
}

/* =========================================================
   مقداردهی اولیه
   ========================================================= */

function initialize() {

    loadPublisherSettings();

    loadSelectionSettings();

    const publisherNameInput =
        document.getElementById(
            "publisherName"
        );

    const publisherRubikaInput =
        document.getElementById(
            "publisherRubika"
        );

    publisherNameInput.value =
        publisherName;

    publisherRubikaInput.value =
        publisherRubika;

    /* تعداد نمایش */

    const countSelect =
        document.getElementById(
            "newsCount"
        );

    countSelect.value =
        String(newsCountSetting);

    countSelect.addEventListener(
        "change",
        event => {

            newsCountSetting =
                event.target.value;

            renderAll();
        }
    );

    /* جستجو */

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const clearSearchBtn =
        document.getElementById(
            "clearSearchBtn"
        );

    searchInput.addEventListener(
        "input",
        event => {

            searchQuery =
                cleanText(
                    event.target.value
                );

            clearSearchBtn.style.display =
                searchQuery
                    ? "block"
                    : "none";

            renderAll();
        }
    );

    clearSearchBtn.addEventListener(
        "click",
        () => {

            searchInput.value =
                "";

            searchQuery =
                "";

            clearSearchBtn.style.display =
                "none";

            searchInput.focus();

            renderAll();
        }
    );

    /* مرتب‌سازی */

    const sortSelect =
        document.getElementById(
            "sortSelect"
        );

    sortSelect.addEventListener(
        "change",
        event => {

            sortMode =
                event.target.value;

            renderAll();
        }
    );

    /* فقط انتخاب‌شده‌ها */

    const onlySelectedCheckbox =
        document.getElementById(
            "onlySelected"
        );

    onlySelectedCheckbox.addEventListener(
        "change",
        event => {

            onlySelected =
                event.target.checked;

            renderAll();
        }
    );

    /* انتخاب همه دسته */

    document.getElementById(
        "selectAllBtn"
    ).addEventListener(
        "click",
        selectAllNews
    );

    /* لغو انتخاب دسته */

    document.getElementById(
        "clearAllBtn"
    ).addEventListener(
        "click",
        clearAllNews
    );

    /* لغو انتخاب همه */

    document.getElementById(
        "clearEverythingBtn"
    ).addEventListener(
        "click",
        clearEverything
    );

    /* بروزرسانی */

    document.getElementById(
        "refreshBtn"
    ).addEventListener(
        "click",
        () => loadNews(true)
    );

    /* کپی */

    document.getElementById(
        "copyBtn"
    ).addEventListener(
        "click",
        copyRubikaText
    );

    document.getElementById(
        "copyBtnBottom"
    ).addEventListener(
        "click",
        copyRubikaText
    );

    /* تنظیمات منتشرکننده */

    publisherNameInput.addEventListener(
        "input",
        () => {

            publisherName =
                sanitizePublisherName(
                    publisherNameInput.value
                );

            try {

                localStorage.setItem(
                    ADMIN_STORAGE_KEY,
                    JSON.stringify({
                        name: publisherName,
                        rubika:
                            publisherRubika
                    })
                );

            } catch {}
            
            updatePreview();
        }
    );

    publisherRubikaInput.addEventListener(
        "input",
        () => {

            publisherRubika =
                normalizeRubikaUrl(
                    publisherRubikaInput.value
                );

            try {

                localStorage.setItem(
                    ADMIN_STORAGE_KEY,
                    JSON.stringify({
                        name: publisherName,
                        rubika:
                            publisherRubika
                    })
                );

            } catch {}

            updatePreview();
        }
    );

    /* وضعیت اولیه */

    buildCategoryButtons();

    renderAll();

    loadNews(false);
}

/* =========================================================
   شروع
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    initialize
);
</script>
