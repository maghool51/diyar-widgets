<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🇮🇷 مهم‌ترین اخبار روز | دیار قدمگاه</title>

<meta name="description"
      content="مهم‌ترین اخبار روز ایران و جهان از منابع معتبر خبری">

<meta name="theme-color" content="#263238">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f1f4f6;
    color:#263238;
    direction:rtl;
    padding:10px;
}

.container{
    max-width:780px;
    margin:auto;
}

/* =====================================================
   HEADER
   ===================================================== */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:linear-gradient(135deg,#263238,#455a64);
    color:#fff;

    padding:22px 20px;
    margin-bottom:15px;

    border-radius:20px;

    box-shadow:0 6px 20px rgba(0,0,0,.15);

    overflow:hidden;

    transition:
        padding .28s ease,
        border-radius .28s ease,
        box-shadow .28s ease;
}

/* سربرگ جمع‌شده */

.header.compact{
    padding:10px 16px;

    border-radius:0 0 14px 14px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.20);
}

/* عنوان */

.header-title{
    font-size:24px;
    font-weight:bold;
    line-height:1.5;

    transition:
        font-size .28s ease,
        line-height .28s ease;
}

.header.compact .header-title{
    font-size:19px;
    line-height:1.3;
}

/* زیرعنوان */

.header-subtitle{
    font-size:13px;
    margin-top:6px;
    opacity:.95;

    transition:
        font-size .28s ease,
        margin .28s ease,
        opacity .28s ease;
}

.header.compact .header-subtitle{
    font-size:11px;
    margin-top:2px;
}

/* نقطه زنده */

.live-dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#ef5350;
    border-radius:50%;
    margin-left:5px;

    animation:
        livePulse 1.2s infinite;
}

@keyframes livePulse{

    0%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.35;
        transform:scale(.75);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}

/* اطلاعات سربرگ */

.header-info{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;

    margin-top:13px;

    max-height:100px;
    opacity:1;

    transition:
        max-height .28s ease,
        opacity .28s ease,
        margin .28s ease;
}

.header.compact .header-info{
    max-height:0;
    opacity:0;
    margin-top:0;
    overflow:hidden;
}

.info-badge{
    background:#fff;
    color:#37474f;

    padding:5px 11px;

    border-radius:20px;

    font-size:11px;
    white-space:nowrap;
}

/* =====================================================
   CONTROLS
   ===================================================== */

.controls{
    background:#fff;

    border-radius:18px;

    padding:15px;

    margin-bottom:15px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);
}

/* دسته‌بندی */

.category-tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:7px;
}

.category-tab{
    border:none;

    background:#eceff1;
    color:#37474f;

    padding:8px 13px;

    border-radius:20px;

    font-family:inherit;
    font-size:12px;

    cursor:pointer;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

.category-tab:hover{
    transform:translateY(-1px);
    background:#e0e0e0;
}

.category-tab.active{
    background:#37474f;
    color:#fff;
}

/* =====================================================
   ACTIONS
   ===================================================== */

.actions{
    display:flex;
    gap:8px;

    margin-top:12px;
}

.action-btn{
    flex:1;

    border:none;

    padding:10px;

    border-radius:12px;

    font-family:inherit;
    font-size:12px;

    cursor:pointer;

    transition:transform .2s ease;
}

.action-btn:hover{
    transform:translateY(-1px);
}

.copy-btn{
    background:#1976d2;
    color:#fff;
}

.refresh-btn{
    background:#eceff1;
    color:#37474f;
}

/* وضعیت بروزرسانی */

.update-status{
    text-align:center;

    color:#78909c;

    font-size:11px;

    margin-top:10px;
}

/* =====================================================
   NEWS
   ===================================================== */

.news-container{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.news-card{
    background:#fff;

    border-radius:16px;

    padding:14px 15px;

    border-right:4px solid #ef5350;

    box-shadow:
        0 2px 9px rgba(0,0,0,.07);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.news-card:hover{
    transform:translateY(-2px);

    box-shadow:
        0 5px 15px rgba(0,0,0,.10);
}

.news-title{
    font-size:16px;

    font-weight:bold;

    line-height:1.8;
}

.news-title a{
    color:#263238;
    text-decoration:none;
}

.news-title a:hover{
    color:#c62828;
}

.news-meta{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:8px;

    flex-wrap:wrap;

    margin-top:7px;

    font-size:11px;

    color:#78909c;
}

.news-source{
    color:#c62828;
    font-weight:bold;
}

.news-category{
    background:#eceff1;

    padding:3px 8px;

    border-radius:12px;

    color:#546e7a;
}

.news-summary{
    color:#607d8b;

    font-size:13px;

    line-height:1.8;

    margin-top:7px;
}

.fresh-badge{
    display:inline-block;

    background:#e8f5e9;
    color:#2e7d32;

    padding:2px 7px;

    border-radius:10px;

    font-size:10px;

    margin-right:5px;
}

/* =====================================================
   LOADING / EMPTY
   ===================================================== */

.loading{
    text-align:center;

    background:#fff;

    border-radius:16px;

    padding:30px 15px;

    color:#607d8b;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.error{
    text-align:center;

    background:#ffebee;

    color:#c62828;

    border-radius:16px;

    padding:20px 15px;

    line-height:1.8;
}

/* =====================================================
   FOOTER
   ===================================================== */

.footer{
    background:#263238;

    color:#cfd8dc;

    text-align:center;

    padding:16px;

    margin-top:20px;

    border-radius:16px;

    font-size:12px;

    line-height:1.9;
}

/* =====================================================
   TOAST
   ===================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    background:#263238;
    color:#fff;

    padding:11px 18px;

    border-radius:25px;

    font-size:12px;

    opacity:0;
    pointer-events:none;

    transition:
        opacity .25s ease,
        transform .25s ease;

    z-index:5000;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

    body{
        padding:7px;
    }

    .header{
        padding:18px 14px;
        border-radius:17px;
    }

    .header.compact{
        padding:8px 12px;
        border-radius:0 0 12px 12px;
    }

    .header-title{
        font-size:20px;
    }

    .header.compact .header-title{
        font-size:17px;
    }

    .header-subtitle{
        font-size:11px;
    }

    .category-tab{
        padding:7px 10px;
        font-size:11px;
    }

    .news-card{
        padding:12px;
    }

    .news-title{
        font-size:14px;
        line-height:1.8;
    }

    .news-summary{
        font-size:12px;
    }

    .actions{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header" id="mainHeader">

        <div class="header-title">
            <span class="live-dot"></span>
            مهم‌ترین اخبار روز
        </div>

        <div class="header-subtitle">
            🇮🇷 ایران و جهان | 🏡 دیار قدمگاه
        </div>

        <div class="header-info">

            <span class="info-badge" id="newsCount">
                📰 در حال دریافت...
            </span>

            <span class="info-badge">
                🗂 ۸ دسته خبری
            </span>

            <span class="info-badge">
                📡 منابع خبری معتبر
            </span>

        </div>

    </header>


    <!-- =================================================
         CONTROLS
         ================================================= -->

    <section class="controls">

        <div class="category-tabs" id="categoryTabs">

            <button
                class="category-tab active"
                data-category="all">
                📋 همه
            </button>

            <button
                class="category-tab"
                data-category="سیاسی">
                🏛 سیاسی
            </button>

            <button
                class="category-tab"
                data-category="اقتصادی">
                💰 اقتصادی
            </button>

            <button
                class="category-tab"
                data-category="ورزشی">
                ⚽ ورزشی
            </button>

            <button
                class="category-tab"
                data-category="فرهنگی و هنری">
                🎭 فرهنگی و هنری
            </button>

            <button
                class="category-tab"
                data-category="اجتماعی">
                👥 اجتماعی
            </button>

            <button
                class="category-tab"
                data-category="علمی و فناوری">
                🔬 علمی و فناوری
            </button>

            <button
                class="category-tab"
                data-category="بین‌الملل">
                🌍 بین‌الملل
            </button>

            <button
                class="category-tab"
                data-category="متفرقه">
                📌 متفرقه
            </button>

        </div>


        <div class="actions">

            <button
                class="action-btn copy-btn"
                id="copyBtn">
                📋 کپی اخبار برای روبیکا
            </button>

            <button
                class="action-btn refresh-btn"
                id="refreshBtn">
                🔄 بروزرسانی اخبار
            </button>

        </div>


        <div
            class="update-status"
            id="updateStatus">
            در حال دریافت آخرین اخبار...
        </div>

    </section>


    <!-- =================================================
         NEWS CONTAINER
         ================================================= -->

    <main
        class="news-container"
        id="newsContainer">

        <div class="loading">
            ⏳ در حال دریافت آخرین اخبار...
        </div>

    </main>


    <!-- =================================================
         FOOTER
         ================================================= -->

    <footer class="footer">

        🏡 دیار قدمگاه

        <br>

        آخرین اخبار ایران و جهان

        <br>

        <span id="footerUpdate">
            بروزرسانی خودکار هر ۱۰ دقیقه
        </span>

    </footer>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   SETTINGS
   ===================================================== */

const NEWS_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news.json";

const SUMMARY_URL =
    "https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";

const NEWS_COUNT_LIMIT = 100;

const REFRESH_INTERVAL = 10 * 60 * 1000;


/* =====================================================
   STATE
   ===================================================== */

let allNews = [];

let allSummaries = [];

let currentCategory = "all";


/* =====================================================
   ELEMENTS
   ===================================================== */

const newsContainer =
    document.getElementById("newsContainer");

const categoryTabs =
    document.querySelectorAll(".category-tab");

const newsCount =
    document.getElementById("newsCount");

const updateStatus =
    document.getElementById("updateStatus");

const refreshBtn =
    document.getElementById("refreshBtn");

const copyBtn =
    document.getElementById("copyBtn");

const toast =
    document.getElementById("toast");

const header =
    document.getElementById("mainHeader");


/* =====================================================
   HEADER SCROLL
   ===================================================== */

let headerTicking = false;

function updateHeader(){

    const scrollY =
        window.scrollY || window.pageYOffset;

    if(scrollY > 60){

        header.classList.add("compact");

    }else{

        header.classList.remove("compact");

    }

    headerTicking = false;
}

window.addEventListener(
    "scroll",
    function(){

        if(!headerTicking){

            window.requestAnimationFrame(
                updateHeader
            );

            headerTicking = true;
        }

    },
    {passive:true}
);


/* =====================================================
   TOAST
   ===================================================== */

let toastTimer;

function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(function(){

            toast.classList.remove("show");

        },2500);
}


/* =====================================================
   NORMALIZE
   ===================================================== */

function normalizeText(text){

    return String(text || "")
        .replace(/ي/g,"ی")
        .replace(/ى/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/\u200c/g," ")
        .replace(/\s+/g," ")
        .trim()
        .toLowerCase();
}


/* =====================================================
   LOAD SUMMARIES
   ===================================================== */

async function loadSummaries(){

    try{

        const response =
            await fetch(
                SUMMARY_URL + "?t=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            throw new Error("summary");

        const data =
            await response.json();

        if(Array.isArray(data)){

            allSummaries = data;

        }else if(Array.isArray(data.news)){

            allSummaries = data.news;

        }else if(Array.isArray(data.summaries)){

            allSummaries = data.summaries;

        }else{

            allSummaries = [];

        }

    }catch(error){

        console.warn(
            "خطا در دریافت خلاصه اخبار:",
            error
        );

        allSummaries = [];
    }
}


/* =====================================================
   FIND SUMMARY
   ===================================================== */

function findSummary(item){

    if(!allSummaries.length)
        return "";

    const itemLink =
        String(
            item.link ||
            item.url ||
            ""
        ).trim();

    const itemTitle =
        normalizeText(
            item.title || ""
        );

    let found =
        allSummaries.find(
            summary => {

                const summaryLink =
                    String(
                        summary.link ||
                        summary.url ||
                        ""
                    ).trim();

                return (
                    itemLink &&
                    summaryLink &&
                    itemLink === summaryLink
                );
            }
        );

    if(found){

        return String(
            found.summary ||
            found.description ||
            ""
        ).trim();
    }


    found =
        allSummaries.find(
            summary => {

                const summaryTitle =
                    normalizeText(
                        summary.title || ""
                    );

                return (
                    itemTitle &&
                    summaryTitle &&
                    itemTitle === summaryTitle
                );
            }
        );


    if(found){

        return String(
            found.summary ||
            found.description ||
            ""
        ).trim();
    }

    return "";
}


/* =====================================================
   DATE
   ===================================================== */

function getNewsDate(item){

    return new Date(
        item.pubDate ||
        item.isoDate ||
        item.date ||
        item.publishedAt ||
        0
    );
}


/* =====================================================
   PERSIAN DATE
   ===================================================== */

function formatPersianDate(date){

    if(
        !date ||
        isNaN(date.getTime())
    ){

        return "";
    }

    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year:"numeric",
                month:"numeric",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(date);

    }catch(error){

        return date.toLocaleString(
            "fa-IR"
        );
    }
}


/* =====================================================
   FRESH
   ===================================================== */

function isFresh(date){

    if(
        !date ||
        isNaN(date.getTime())
    )
        return false;

    const diff =
        Date.now() -
        date.getTime();

    return (
        diff >= 0 &&
        diff <= 60 * 60 * 1000
    );
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   LOAD NEWS
   ===================================================== */

async function loadNews(){

    refreshBtn.disabled = true;

    updateStatus.textContent =
        "⏳ در حال دریافت آخرین اخبار...";

    try{

        const response =
            await fetch(
                NEWS_URL + "?t=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "خطا در دریافت news.json"
            );
        }

        const data =
            await response.json();


        if(Array.isArray(data)){

            allNews = data;

        }else if(Array.isArray(data.news)){

            allNews = data.news;

        }else{

            allNews = [];
        }


        allNews =
            allNews
                .slice()
                .sort(
                    (a,b) =>
                        getNewsDate(b) -
                        getNewsDate(a)
                )
                .slice(
                    0,
                    NEWS_COUNT_LIMIT
                );


        await loadSummaries();


        newsCount.textContent =
            "📰 " +
            allNews.length +
            " خبر";


        renderNews();


        const now =
            new Date();


        updateStatus.textContent =
            "🟢 آخرین دریافت: " +
            formatPersianDate(now);


    }catch(error){

        console.error(error);

        newsContainer.innerHTML = `
            <div class="error">
                ❌ دریافت اخبار با مشکل مواجه شد.
                <br>
                لطفاً چند لحظه بعد دوباره تلاش کنید.
            </div>
        `;

        updateStatus.textContent =
            "🔴 خطا در بروزرسانی اخبار";

    }finally{

        refreshBtn.disabled = false;
    }
}


/* =====================================================
   CATEGORY COUNTS
   ===================================================== */

function updateCategoryCounts(){

    const counts = {};

    allNews.forEach(
        item => {

            const category =
                item.category ||
                "متفرقه";

            counts[category] =
                (counts[category] || 0) + 1;
        }
    );


    categoryTabs.forEach(
        button => {

            const category =
                button.dataset.category;

            const original =
                button.dataset.originalText ||
                button.textContent.trim();


            button.dataset.originalText =
                original;


            if(category === "all"){

                button.textContent =
                    "📋 همه (" +
                    allNews.length +
                    ")";

                return;
            }


            const count =
                counts[category] || 0;


            const icon =
                original.split(" ")[0];


            const title =
                original.substring(
                    original.indexOf(" ") + 1
                );


            button.textContent =
                icon +
                " " +
                title +
                " (" +
                count +
                ")";
        }
    );
}


/* =====================================================
   RENDER NEWS
   ===================================================== */

function renderNews(){

    updateCategoryCounts();


    const filtered =
        currentCategory === "all"
            ? allNews
            : allNews.filter(
                item =>
                    (
                        item.category ||
                        "متفرقه"
                    ) === currentCategory
            );


    if(!filtered.length){

        newsContainer.innerHTML = `
            <div class="loading">
                📭 خبری در این دسته وجود ندارد.
            </div>
        `;

        return;
    }


    newsContainer.innerHTML =
        filtered.map(
            (item,index) => {

                const title =
                    escapeHtml(
                        item.title ||
                        "بدون عنوان"
                    );


                const link =
                    item.link ||
                    item.url ||
                    "#";


                const safeLink =
                    escapeHtml(link);


                const source =
                    escapeHtml(
                        item.source ||
                        item.sourceName ||
                        "منبع خبری"
                    );


                const category =
                    escapeHtml(
                        item.category ||
                        "متفرقه"
                    );


                const date =
                    getNewsDate(item);


                const dateText =
                    formatPersianDate(date);


                const summary =
                    escapeHtml(
                        findSummary(item)
                    );


                const fresh =
                    isFresh(date)
                        ? `<span class="fresh-badge">تازه</span>`
                        : "";


                return `
                    <article
                        class="news-card"
                        data-category="${category}">

                        <div class="news-title">

                            <a
                                href="${safeLink}"
                                target="_blank"
                                rel="noopener noreferrer">

                                ${title}

                            </a>

                        </div>


                        <div class="news-meta">

                            <span class="news-source">
                                🇮🇷 ${source}
                            </span>

                            <span class="news-category">
                                ${category}
                            </span>

                            <span>
                                🕐 ${escapeHtml(dateText)}
                                ${fresh}
                            </span>

                        </div>


                        ${
                            summary
                                ? `
                                <div class="news-summary">
                                    ${summary}
                                </div>
                                `
                                : ""
                        }

                    </article>
                `;
            }
        ).join("");
}


/* =====================================================
   CATEGORY FILTER
   ===================================================== */

categoryTabs.forEach(
    button => {

        button.addEventListener(
            "click",
            function(){

                categoryTabs.forEach(
                    btn =>
                        btn.classList.remove(
                            "active"
                        )
                );


                this.classList.add("active");


                currentCategory =
                    this.dataset.category;


                renderNews();

            }
        );
    }
);


/* =====================================================
   REFRESH
   ===================================================== */

refreshBtn.addEventListener(
    "click",
    async function(){

        await loadNews();

        showToast(
            "✅ اخبار با موفقیت بروزرسانی شد"
        );

    }
);


/* =====================================================
   COPY FOR RUBIKA
   ===================================================== */

copyBtn.addEventListener(
    "click",
    async function(){

        const filtered =
            currentCategory === "all"
                ? allNews
                : allNews.filter(
                    item =>
                        (
                            item.category ||
                            "متفرقه"
                        ) === currentCategory
                );


        if(!filtered.length){

            showToast(
                "خبری برای کپی وجود ندارد"
            );

            return;
        }


        let text =
            "📰 مهم‌ترین اخبار روز\n" +
            "🏡 دیار قدمگاه\n\n";


        filtered
            .slice(0,10)
            .forEach(
                (item,index) => {

                    const title =
                        item.title ||
                        "بدون عنوان";


                    const source =
                        item.source ||
                        item.sourceName ||
                        "";


                    const link =
                        item.link ||
                        item.url ||
                        "";


                    text +=
                        "🔹 " +
                        (index + 1) +
                        ". " +
                        title +
                        "\n";


                    if(source){

                        text +=
                            "📡 " +
                            source +
                            "\n";
                    }


                    if(link){

                        text +=
                            "🔗 " +
                            link +
                            "\n";
                    }


                    text += "\n";
                }
            );


        try{

            await navigator.clipboard.writeText(
                text
            );

            showToast(
                "📋 اخبار برای روبیکا کپی شد"
            );

        }catch(error){

            showToast(
                "❌ کپی کردن انجام نشد"
            );
        }

    }
);


/* =====================================================
   AUTO REFRESH
   ===================================================== */

setInterval(
    async function(){

        await loadNews();

    },
    REFRESH_INTERVAL
);


/* =====================================================
   INITIAL LOAD
   ===================================================== */

loadNews();

</script>
