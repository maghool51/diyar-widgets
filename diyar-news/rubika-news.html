<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#263238"
>

<title>انتخاب اخبار روبیکا | دیار قدمگاه</title>

<style>

* {
    box-sizing: border-box;
}

html {
    direction: rtl;
}

body {
    margin: 0;
    padding: 0;
    background: #f4f6f7;
    color: #263238;
    font-family: Tahoma, Arial, sans-serif;
    line-height: 1.8;
}

button,
select,
input,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.container {
    width: min(1100px, calc(100% - 24px));
    margin: 0 auto;
}

/* =========================
   HEADER
========================= */

.site-header {
    background:
        linear-gradient(
            135deg,
            #263238,
            #37474f
        );
    color: #fff;
    padding: 22px 16px;
    box-shadow:
        0 3px 12px rgba(0,0,0,.16);
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    text-align: center;
}

.header-title {
    font-size: 24px;
    font-weight: bold;
    margin: 0;
}

.header-subtitle {
    margin-top: 5px;
    font-size: 13px;
    opacity: .88;
}

/* =========================
   MAIN
========================= */

main {
    padding: 18px 0 35px;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 16px;
}

.stat {
    background: #fff;
    border-radius: 14px;
    padding: 13px 8px;
    text-align: center;
    box-shadow:
        0 2px 8px rgba(0,0,0,.07);
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
    color: #263238;
}

.stat-label {
    font-size: 11px;
    color: #607d8b;
}

/* =========================
   CONTROL BOX
========================= */

.control-box {
    background: #fff;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 16px;
    box-shadow:
        0 2px 9px rgba(0,0,0,.07);
}

.control-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* =========================
   CATEGORY BUTTONS
========================= */

.category-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 3px;
    -webkit-overflow-scrolling: touch;
}

.category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.category-btn {
    border: 1px solid #cfd8dc;
    background: #fff;
    color: #455a64;
    border-radius: 999px;
    padding: 8px 13px;
    font-size: 12px;
    transition: .2s;
    min-height: 38px;
    white-space: nowrap;
}

.category-btn:hover {
    background: #eceff1;
}

.category-btn.active {
    background: #263238;
    color: #fff;
    border-color: #263238;
}

.category-count {
    opacity: .8;
    margin-right: 3px;
}

/* =========================
   SEARCH
========================= */

.search-box {
    margin-top: 15px;
}

.search-label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 6px;
}

.search-wrap {
    position: relative;
}

#searchInput {
    width: 100%;
    border: 1px solid #cfd8dc;
    border-radius: 11px;
    padding: 11px 42px 11px 38px;
    background: #fff;
    color: #263238;
    outline: none;
    font-size: 13px;
    direction: rtl;
}

#searchInput:focus {
    border-color: #607d8b;
    box-shadow:
        0 0 0 3px rgba(96,125,139,.10);
}

.search-icon {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 16px;
}

.search-clear {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #78909c;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 15px;
    display: none;
}

.search-clear.show {
    display: block;
}

/* =========================
   FILTER / SORT ROW
========================= */

.filter-row {
    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);
    gap: 10px;
    margin-top: 13px;
}

.filter-field label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 5px;
}

.filter-field select {
    width: 100%;
    border: 1px solid #cfd8dc;
    background: #fff;
    border-radius: 9px;
    padding: 9px 10px;
    color: #263238;
    outline: none;
    min-height: 42px;
}

.selected-only-row {
    margin-top: 10px;
}

.selected-only-btn {
    width: 100%;
    border: 1px solid #cfd8dc;
    background: #fff;
    color: #455a64;
    border-radius: 10px;
    padding: 10px 12px;
    min-height: 42px;
    font-size: 12px;
    font-weight: bold;
}

.selected-only-btn.active {
    background: #fff8e1;
    color: #e65100;
    border-color: #ffcc80;
}

/* =========================
   COUNT
========================= */

.count-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 13px;
}

.count-row label {
    font-size: 13px;
    font-weight: bold;
}

#newsCount {
    border: 1px solid #cfd8dc;
    background: #fff;
    border-radius: 9px;
    padding: 8px 12px;
    color: #263238;
    outline: none;
    min-height: 40px;
}

/* =========================
   ACTION BUTTONS
========================= */

.action-row {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 13px;
}

.action-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 13px;
    min-height: 42px;
    font-size: 12px;
    font-weight: bold;
}

.btn-select {
    background: #e8f5e9;
    color: #2e7d32;
}

.btn-clear {
    background: #ffebee;
    color: #c62828;
}

.btn-clear-all {
    background: #fce4ec;
    color: #ad1457;
}

.btn-refresh {
    background: #eceff1;
    color: #37474f;
}

.btn-copy {
    background: #263238;
    color: #fff;
}

.action-btn:active,
.selected-only-btn:active,
.category-btn:active {
    transform: scale(.98);
}

/* =========================
   SELECTION INFO
========================= */

.selection-info {
    margin-top: 12px;
    padding: 11px 12px;
    background: #f5f7f8;
    border-radius: 10px;
    font-size: 12px;
    color: #455a64;
}

.selection-summary-title {
    font-weight: bold;
    color: #263238;
    margin-bottom: 7px;
}

.selection-total {
    margin-bottom: 7px;
}

.category-selection-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.category-selection-item {
    background: #fff;
    border: 1px solid #e0e6e8;
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 10px;
}

/* =========================
   NEWS LIST
========================= */

.news-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.news-card {
    background: #fff;
    border-radius: 15px;
    padding: 13px;
    box-shadow:
        0 2px 8px rgba(0,0,0,.07);
    border: 2px solid transparent;
    transition: .2s;
}

.news-card.selected {
    border-color: #607d8b;
    background: #fafcfd;
}

.news-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.news-checkbox {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    margin-top: 3px;
    accent-color: #263238;
    cursor: pointer;
}

.news-content {
    min-width: 0;
    flex: 1;
}

.news-title {
    font-size: 15px;
    font-weight: bold;
    color: #263238;
    margin: 0;
    line-height: 1.8;
}

.news-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
}

.meta-item {
    background: #f1f3f4;
    color: #546e7a;
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 10px;
}

.news-summary {
    margin-top: 8px;
    font-size: 12px;
    color: #607d8b;
    line-height: 1.9;
}

.news-link {
    display: inline-block;
    margin-top: 8px;
    color: #1565c0;
    font-size: 11px;
    text-decoration: none;
    font-weight: bold;
}

.news-link:hover {
    text-decoration: underline;
}

/* =========================
   EMPTY / LOADING
========================= */

.status-box {
    background: #fff;
    border-radius: 15px;
    padding: 25px 15px;
    text-align: center;
    color: #607d8b;
    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.loading {
    font-size: 14px;
}

.error {
    color: #c62828;
}

/* =========================
   PUBLISHER
========================= */

.publisher-box {
    margin-top: 18px;
}

.field {
    margin-bottom: 12px;
}

.field:last-child {
    margin-bottom: 0;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
}

.field input {
    width: 100%;
    border: 1px solid #cfd8dc;
    border-radius: 9px;
    padding: 9px 10px;
    outline: none;
    direction: rtl;
    min-height: 42px;
}

.field input:focus {
    border-color: #607d8b;
}

/* =========================
   PREVIEW
========================= */

.preview-box {
    margin-top: 18px;
}

.preview-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

#preview {
    width: 100%;
    min-height: 480px;
    resize: vertical;
    border: 1px solid #cfd8dc;
    border-radius: 12px;
    padding: 13px;
    background: #fff;
    color: #263238;
    direction: rtl;
    text-align: right;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.9;
    outline: none;
}

/* =========================
   FOOTER
========================= */

.site-footer {
    text-align: center;
    padding: 20px 10px 30px;
    color: #78909c;
    font-size: 11px;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform:
        translateX(-50%)
        translateY(120px);

    background: #263238;
    color: #fff;

    padding: 10px 16px;
    border-radius: 10px;

    font-size: 12px;
    max-width: calc(100% - 30px);

    box-shadow:
        0 4px 15px rgba(0,0,0,.22);

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .25s,
        transform .25s;

    z-index: 9999;

    text-align: center;
}

.toast.show {
    opacity: 1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .header-title {
        font-size: 28px;
    }

    .news-title {
        font-size: 16px;
    }

    .news-card {
        padding: 15px;
    }

    .action-row {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 420px) {

    .container {
        width: min(
            100% - 14px,
            1100px
        );
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 9px 4px;
    }

    .stat-number {
        font-size: 18px;
    }

    .stat-label {
        font-size: 9px;
    }

    .category-scroll {
        margin-left: -4px;
        margin-right: -4px;
        padding-left: 4px;
        padding-right: 4px;
    }

    .category-buttons {
        flex-wrap: nowrap;
        width: max-content;
    }

    .category-btn {
        padding: 7px 10px;
        font-size: 11px;
    }

    .action-row {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .action-btn {
        width: 100%;
        padding: 10px 8px;
    }

    .filter-row {
        grid-template-columns:
            1fr;
    }

    .news-title {
        font-size: 14px;
    }

}

/* =========================
   VERY SMALL MOBILE
========================= */

@media (max-width: 340px) {

    .stats {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .action-row {
        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>

<header class="site-header">

    <div class="header-inner">

        <h1 class="header-title">
            📰 اخبار روبیکا | دیار قدمگاه
        </h1>

        <div class="header-subtitle">
            انتخاب و آماده‌سازی اخبار برای انتشار در روبیکا
        </div>

    </div>

</header>


<main>

<div class="container">


    <!-- =========================
         STATS
    ========================== -->

    <section class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totalCount"
            >
                ۰
            </div>

            <div class="stat-label">
                کل اخبار
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="categoryCount"
            >
                ۰
            </div>

            <div class="stat-label">
                این دسته
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="selectedCount"
            >
                ۰
            </div>

            <div class="stat-label">
                انتخاب‌شده
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="displayCount"
            >
                ۰
            </div>

            <div class="stat-label">
                در حال نمایش
            </div>

        </div>

    </section>


    <!-- =========================
         CONTROLS
    ========================== -->

    <section class="control-box">

        <div class="control-title">
            🏷 انتخاب دسته اخبار
        </div>


        <div class="category-scroll">

            <div
                class="category-buttons"
                id="categoryButtons"
            >
            </div>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-box">

            <label
                class="search-label"
                for="searchInput"
            >
                🔍 جستجوی خبر
            </label>

            <div class="search-wrap">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="عنوان، منبع یا دسته را جستجو کنید..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="search-clear"
                    id="searchClearBtn"
                    aria-label="پاک کردن جستجو"
                >
                    ✕
                </button>

            </div>

        </div>


        <!-- =========================
             FILTER / SORT
        ========================== -->

        <div class="filter-row">

            <div class="filter-field">

                <label for="sortSelect">
                    📌 مرتب‌سازی
                </label>

                <select id="sortSelect">

                    <option value="newest">
                        🕐 جدیدترین‌ها
                    </option>

                    <option value="oldest">
                        🕰️ قدیمی‌ترین‌ها
                    </option>

                    <option value="selected">
                        ⭐ انتخاب‌شده‌ها در ابتدا
                    </option>

                </select>

            </div>


            <div class="filter-field">

                <label for="newsCount">
                    📋 تعداد نمایش
                </label>

                <select id="newsCount">

                    <option value="5">
                        ۵ خبر
                    </option>

                    <option value="10" selected>
                        ۱۰ خبر
                    </option>

                    <option value="15">
                        ۱۵ خبر
                    </option>

                    <option value="20">
                        ۲۰ خبر
                    </option>

                    <option value="all">
                        همه
                    </option>

                </select>

            </div>

        </div>


        <!-- =========================
             SELECTED ONLY
        ========================== -->

        <div class="selected-only-row">

            <button
                class="selected-only-btn"
                id="selectedOnlyBtn"
                type="button"
            >
                ⭐ نمایش فقط انتخاب‌شده‌ها
            </button>

        </div>


        <!-- =========================
             ACTIONS
        ========================== -->

        <div class="action-row">

            <button
                class="action-btn btn-select"
                id="selectAllBtn"
                type="button"
            >
                ☑️ انتخاب همه این دسته
            </button>


            <button
                class="action-btn btn-clear"
                id="clearAllBtn"
                type="button"
            >
                ⬜ لغو انتخاب این دسته
            </button>


            <button
                class="action-btn btn-clear-all"
                id="clearEverythingBtn"
                type="button"
            >
                🧹 لغو انتخاب همه
            </button>


            <button
                class="action-btn btn-refresh"
                id="refreshBtn"
                type="button"
            >
                🔄 بروزرسانی
            </button>

        </div>


        <!-- =========================
             SELECTION INFO
        ========================== -->

        <div
            class="selection-info"
            id="selectionInfo"
        >
            هیچ خبری انتخاب نشده است.
        </div>

    </section>


    <!-- =========================
         NEWS
    ========================== -->

    <section id="newsContainer">

        <div class="status-box loading">
            ⏳ در حال دریافت اخبار...
        </div>

    </section>


    <!-- =========================
         PUBLISHER SETTINGS
    ========================== -->

    <section class="control-box publisher-box">

        <div class="control-title">
            ✍️ مشخصات منتشرکننده
        </div>


        <div class="field">

            <label for="publisherName">
                نام منتشرکننده
            </label>

            <input
                type="text"
                id="publisherName"
                maxlength="60"
                placeholder="مثلاً ادمین"
            >

        </div>


        <div class="field">

            <label for="publisherRubika">
                لینک روبیکای منتشرکننده
            </label>

            <input
                type="url"
                id="publisherRubika"
                placeholder="https://rubika.ir/..."
                dir="ltr"
            >

        </div>

    </section>


    <!-- =========================
         PREVIEW
    ========================== -->

    <section class="control-box preview-box">

        <div class="preview-title">
            👁️ پیش‌نمایش متن آماده انتشار در روبیکا
        </div>


        <textarea
            id="preview"
            readonly
            spellcheck="false"
        ></textarea>


        <div class="preview-actions">

            <button
                class="action-btn btn-copy"
                id="copyBtn"
                type="button"
            >
                📋 کپی متن روبیکا
            </button>

        </div>

    </section>


</div>

</main>


<footer class="site-footer">

    🏡 دیار قدمگاه
    <br>
    اخبار ایران و جهان

</footer>


<div
    class="toast"
    id="toast"
></div>


<script>

   CONSTANTS

/* =========================================================

let allNews = [];

const categoryButtons =

const selectAllBtn =

    );

const clearAllBtn =
    document.getElementById(
        "clearAllBtn"
    );

const clearEverythingBtn =
    document.getElementById(
        "clearEverythingBtn"

/* =========================================================
   PERSIAN DIGITS
========================================================= */

function toPersianDigits(value) {

    return String(value)
        .replace(
            /\d/g,
            digit =>
                "۰۱۲۳۴۵۶۷۸۹"[digit]
        );

}


/* =========================================================
   TEXT CLEANING
========================================================= */

function decodeHtmlEntities(text) {

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.innerHTML =
        String(text || "");

    return textarea.value;

}


function cleanText(text) {

    return decodeHtmlEntities(
        String(text || "")
    )
        .replace(
            /<[^>]*>/g,
            " "
        )
        .replace(
            /[\r\n\t]+/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


function cleanSummary(text) {

    let result =
        cleanText(text);

    if (!result) {
        return "";
    }

    if (
        result.length >
        MAX_SUMMARY_LENGTH
    ) {

        result =
            result.substring(
                0,
                MAX_SUMMARY_LENGTH
            );

        const lastSpace =
            result.lastIndexOf(" ");

        if (
            lastSpace >
            MAX_SUMMARY_LENGTH * 0.7
        ) {

            result =
                result.substring(
                    0,
                    lastSpace
                );

        }

        result += "…";
    }

    return result;

}


/* =========================================================
   URL SAFETY
========================================================= */

function isSafeHttpUrl(url) {

    try {

        const parsed =
            new URL(
                String(url || "")
            );

        return (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        );

    } catch {

        return false;

    }

}


/* =========================================================
   RUBIKA URL
========================================================= */

function normalizeRubikaUrl(url) {

    const value =
        String(url || "")
            .trim();

    if (!value) {
        return "";
    }

    if (
        !/^https?:\/\//i.test(value)
    ) {
        return "";
    }

    if (
        !/^https?:\/\/(www\.)?rubika\.ir(\/|$)/i.test(
            value
        )
    ) {
        return "";
    }

    return value;

}


/* =========================================================
   PUBLISHER
========================================================= */

function sanitizePublisherName(name) {

    let value =
        cleanText(name);

    if (!value) {
        return DEFAULT_ADMIN_NAME;
    }

    return value.substring(
        0,
        60
    );

}

/* =========================================================
   SELECTION STORAGE
========================================================= */

function loadSelectionSettings() {

    try {

        const raw =
            localStorage.getItem(
                SELECTION_STORAGE_KEY
            );

        if (!raw) {
            return;
        }

        const data =

        if (
            Array.isArray(data)
        ) {

            selectedKeys =
                new Set(
                    data.filter(
                        item =>
                            typeof item ===
                            "string"
                    )
                );

            return;

        }

        if (
            data &&
            Array.isArray(
                data.selectedKeys
            )
        ) {

            selectedKeys =
                new Set(
                    data.selectedKeys.filter(
                        item =>
                            typeof item ===
                            "string"
                    )
                );

        }

    } catch {

        selectedKeys =
            new Set();

    }

}


function saveSelectionSettings() {

    try {

        localStorage.setItem(
            SELECTION_STORAGE_KEY,
            JSON.stringify(
                [...selectedKeys]
            )
        );

    } catch {

        /* localStorage unavailable */

    }

}


/* =========================================================
   NEWS KEY
========================================================= */

function getItemKey(item) {

    const link =
        cleanText(item.link);

    if (link) {
        return "link:" + link;
    }

    const title =
        cleanText(item.title);

    const date =
        cleanText(item.date);

    return (
        "title:" +
        title +
        "|" +
        date
    );

}


/* =========================================================
   DATE VALUE
========================================================= */

function getNewsTime(item) {

    if (!item || !item.date) {
        return 0;
    }

    const time =
        new Date(
            item.date
        ).getTime();

    return Number.isNaN(time)
        ? 0
        : time;

}


/* =========================================================
   SEARCH MATCH
========================================================= */

function matchesSearch(item) {

    const query =
        cleanText(
            searchQuery
        ).toLocaleLowerCase(
            "fa"
        );

    if (!query) {
        return true;
    }

    const title =
        cleanText(
            item.title
        ).toLocaleLowerCase(
            "fa"
        );

    const source =
        cleanText(
            item.source
        ).toLocaleLowerCase(
            "fa"
        );

    const category =
        cleanText(
            item.category
        ).toLocaleLowerCase(
            "fa"
        );

    return (
        title.includes(query) ||
        source.includes(query) ||
        category.includes(query)
    );

}


/* =========================================================
   BASE CATEGORY FILTER
========================================================= */

function getCategoryNews() {

    if (
        currentCategory ===
        "all"
    ) {

        return [
            ...allNews
        ];

    }

    return allNews.filter(
        item =>
            cleanText(
                item.category
            ) ===
            currentCategory
    );

}


/* =========================================================
   SEARCH FILTER
========================================================= */

function getSearchFilteredNews() {

    return getCategoryNews()
        .filter(
            matchesSearch
        );

}


/* =========================================================
   SORT
========================================================= */

function sortNews(news) {

    const result =
        [
            ...news
        ];


    if (
        sortMode ===
        "selected"
    ) {

        result.sort(
            (
                a,
                b
            ) => {

                const aSelected =
                    selectedKeys.has(
                        getItemKey(a)
                    );

                const bSelected =
                    selectedKeys.has(
                        getItemKey(b)
                    );


                if (
                    aSelected !==
                    bSelected
                ) {

                    return bSelected
                        ? 1
                        : -1;

                }


                return (
                    getNewsTime(b) -
                    getNewsTime(a)
                );

            }
        );


        return result;

    }


    if (
        sortMode ===
        "oldest"
    ) {

        result.sort(
            (
                a,
                b
            ) =>
                getNewsTime(a) -
                getNewsTime(b)
        );

    } else {

        result.sort(
            (
                a,
                b
            ) =>
                getNewsTime(b) -
                getNewsTime(a)
        );

    }


    return result;

}

/* =========================================================
   CATEGORY COUNTS
========================================================= */

function getCategoryCount(
    category
) {

    if (
        category === "all"
    ) {

        return allNews.length;

    }

    return allNews.filter(
        item =>
            cleanText(
                item.category
            ) === category
    ).length;

}


/* =========================================================
   SELECTED CATEGORY COUNTS
========================================================= */

function getSelectedCategoryCounts() {

    const counts = {};


    CATEGORY_LIST.forEach(
        category => {

            if (
                category.id ===
                "all"
            ) {
                return;
            }

            counts[
                category.id
            ] = 0;

        }
    );


    allNews.forEach(
        item => {

            const key =
                getItemKey(item);

            if (
                !key ||
                !selectedKeys.has(key)
            ) {
                return;
            }


            const category =
                cleanText(
                    item.category
                );


            if (
                Object.prototype.hasOwnProperty.call(
                    counts,
                    category
                )
            ) {

                counts[category]++;

            }

        }
    );


    return counts;

}

/* =========================================================
   IS NEW NEWS
========================================================= */

function isNewNews(item) {

    if (!item.date) {
        return false;
    }

    const date =
        new Date(
            item.date
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return false;
    }

    const age =
        Date.now() -
        date.getTime();

    return (
        age >= 0 &&
        age <
        6 * 60 * 60 * 1000
    );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatNewsDate(
    value
) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }


    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return "";

    }

}


/* =========================================================
   FORMAT PERSIAN DATE/TIME
========================================================= */

function formatPersianDate(
    date
) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year: "numeric",
                month: "numeric",
                day: "numeric"
            }
        ).format(date);

    } catch {

        return "";

    }

}


function formatPersianTime(
    date
) {

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return "";

    }

}


/* =========================================================

========================================================= */

function renderNews() {

    const displayedNews =
        getDisplayedNews();


    newsContainer.innerHTML = "";


    if (
        !displayedNews.length
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "status-box";


        if (
            selectedOnly &&
            !selectedKeys.size
        ) {

            empty.textContent =
                "⭐ هنوز خبری انتخاب نشده است.";

        } else if (
            searchQuery
        ) {

            empty.textContent =
                "🔍 خبری مطابق جستجوی شما پیدا نشد.";

        } else {

            empty.textContent =
                "ℹ️ در این بخش خبری وجود ندارد.";

        }


        newsContainer.appendChild(
            empty
        );

        return;

    }


    const list =
        document.createElement(
            "div"
        );

    list.className =
        "news-list";


    displayedNews.forEach(
        item => {

            const key =
                getItemKey(item);

            const selected =
                selectedKeys.has(key);


            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "news-card" +
                (
                    selected
                        ? " selected"
                        : ""
                );


            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "news-top";


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "news-checkbox";

            checkbox.checked =
                selected;

            checkbox.setAttribute(
                "aria-label",
                "انتخاب خبر"
            );


            checkbox.addEventListener(
                "change",
                () => {

                    if (
                        checkbox.checked
                    ) {

                        selectedKeys.add(
                            key
                        );

                    } else {

                        selectedKeys.delete(
                            key
                        );

                    }


                    saveSelectionSettings();

                    renderAll();

                }
            );


            top.appendChild(
                checkbox
            );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "news-content";


            const title =
                document.createElement(
                    "h2"
                );

            title.className =
                "news-title";

            setText(
                title,
                item.title
            );


            content.appendChild(
                title
            );


            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "news-meta";


            if (item.source) {

                const source =
                    document.createElement(
                        "span"
                    );

                source.className =
                    "meta-item";

                source.textContent =
                    "📰 " +
                    cleanText(
                        item.source
                    );

                meta.appendChild(
                    source
                );

            }


            if (item.category) {

                const category =
                    document.createElement(
                        "span"
                    );

                category.className =
                    "meta-item";

                category.textContent =
                    "🏷 " +
                    cleanText(
                        item.category
                    );

                meta.appendChild(
                    category
                );

            }


            if (item.date) {

                const date =
                    formatNewsDate(
                        item.date
                    );

                if (date) {

                    const dateElement =
                        document.createElement(
                            "span"
                        );

                    dateElement.className =
                        "meta-item";

                    dateElement.textContent =
                        "🕐 " +
                        date;

                    meta.appendChild(
                        dateElement
                    );

                }

            }


            if (
                isNewNews(item)
            ) {

                const newBadge =
                    document.createElement(
                        "span"
                    );

                newBadge.className =
                    "meta-item";

                newBadge.textContent =
                    "🆕 جدید";

                meta.appendChild(
                    newBadge
                );

            }


            content.appendChild(
                meta
            );


            const summary =
                cleanSummary(
                    item.summary
                );


            if (summary) {

                const summaryElement =
                    document.createElement(
                        "div"
                    );

                summaryElement.className =
                    "news-summary";

                summaryElement.textContent =
                    "📝 " +
                    summary;

                content.appendChild(
                    summaryElement
                );

            }


            if (
                isSafeHttpUrl(
                    item.link
                )
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "news-link";

                link.href =
                    item.link;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.textContent =
                    "🔗 مشاهده متن کامل خبر";

                content.appendChild(
                    link
                );

            }


            top.appendChild(
                content
            );


            card.appendChild(
                top
            );


            list.appendChild(
                card
            );

        }
    );


    newsContainer.appendChild(
        list
    );

}

        "✅ مجموع انتخاب‌شده: " +

        ) +

    ) {

    selectedCategoryItems.forEach(

                toPersianDigits(
                    counts[

    html +=
        "</div>";

     * توجه:
     *
     * این تابع عمداً از getCategoryNews()
     * استفاده می‌کند.
     *
     * بنابراین:
     *
     * جستجو هیچ تأثیری ندارد.
     * تعداد نمایش هیچ تأثیری ندارد.
     *
     * «انتخاب همه این دسته»
     * تمام اخبار دسته فعلی را انتخاب می‌کند.
     */

    const targetNews =
        getCategoryNews();


    targetNews.forEach(
        item => {

            const key =
                getItemKey(item);

            if (key) {

                selectedKeys.add(
                    key
                );

            }

        }
    );


    saveSelectionSettings();

    renderAll();


    if (
        targetNews.length
    ) {

        showToast(
            "✅ " +
            toPersianDigits(
                targetNews.length
            ) +
            " خبر این دسته انتخاب شد."
        );

    } else {

        showToast(
            "ℹ️ در این دسته خبری وجود ندارد."
        );

    }

}


/* =========================================================
   CLEAR CURRENT CATEGORY
========================================================= */

function clearAllNews() {

    /*
     * فقط اخبار دسته فعلی
     * لغو انتخاب می‌شوند.
     *
     * دسته‌های دیگر کاملاً حفظ می‌شوند.
     */

    const targetNews =
        getCategoryNews();


    let removedCount = 0;


    targetNews.forEach(
        item => {

            const key =
                getItemKey(item);

            if (
                key &&
                selectedKeys.has(key)
            ) {

                selectedKeys.delete(
                    key
                );

                removedCount++;

            }

        }
    );


    saveSelectionSettings();

    renderAll();


    if (
        removedCount
    ) {

        showToast(
            "⬜ انتخاب " +
            toPersianDigits(
                removedCount
            ) +
            " خبر این دسته لغو شد."
        );

    } else {

        showToast(
            "ℹ️ خبری از این دسته انتخاب نشده بود."
        );

    }

}


/* =========================================================
   CLEAR ALL SELECTIONS
========================================================= */

function clearEverything() {

    const count =
        selectedKeys.size;


    if (!count) {

        showToast(
            "ℹ️ هیچ خبری انتخاب نشده است."
        );

        return;

    }


    selectedKeys.clear();

    saveSelectionSettings();

    renderAll();


    showToast(
        "🧹 انتخاب همه " +
        toPersianDigits(
            count
        ) +
        " خبر لغو شد."
    );

}


/* =========================================================
   SEARCH
========================================================= */

function updateSearch() {

    searchQuery =
        cleanText(
            searchInput.value
        );


    renderAll();

}


/* =========================================================
   SELECTED ONLY
========================================================= */

function toggleSelectedOnly() {

    selectedOnly =
        !selectedOnly;


    renderAll();


    if (
        selectedOnly
    ) {

        showToast(
            "⭐ فقط خبرهای انتخاب‌شده نمایش داده می‌شوند."
        );

    } else {

        showToast(
            "📋 نمایش همه اخبار فعال شد."
        );

    }

}


/* =========================================================
   COPY FALLBACK
========================================================= */

function fallbackCopy(
    text
) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";

    textarea.style.opacity =
        "0";

    textarea.style.left =
        "-9999px";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    let success =
        false;


    try {

        success =
            document.execCommand(
                "copy"
            );

    } catch {

        success =
            false;

    }


    document.body.removeChild(
        textarea
    );


    return success;

}


/* =========================================================
   COPY RUBIKA TEXT
========================================================= */

async function copyRubikaText() {

    const publishNews =
        getPublishNews();


    const count =
        publishNews.length;


    if (
        !count
    ) {

        showToast(
            "ℹ️ ابتدا حداقل یک خبر را انتخاب کنید."
        );

        return;

    }


    const text =
        createRubikaText();


    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );


            showToast(
                "✅ متن " +
                toPersianDigits(
                    count
                ) +
                " خبر برای انتشار در روبیکا کپی شد."
            );


            return;

        }

    } catch {
        /* fallback */
    }


    if (
        fallbackCopy(text)
    ) {

        showToast(
            "✅ متن " +
            toPersianDigits(
                count
            ) +
            " خبر برای انتشار در روبیکا کپی شد."
        );

    } else {

        showToast(
            "❌ کپی خودکار انجام نشد؛ متن را از پیش‌نمایش کپی کنید."
        );

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews() {

    newsContainer.innerHTML =
        '<div class="status-box loading">⏳ در حال دریافت اخبار...</div>';


    try {

        const response =
            await fetch(
                SUMMARY_URL +
                (
                    SUMMARY_URL.includes("?")
                        ? "&"
                        : "?"
                ) +
                "_=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        let news =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.news
                    )
                        ? data.news
                        : []
                );


        allNews =
            news.filter(
                item =>
                    item &&
                    cleanText(
                        item.title
                    )
            );


        /*
         * فقط انتخاب خبرهایی حفظ می‌شود
         * که هنوز در news-summary.json
         * وجود دارند.
         */

        const validKeys =
            new Set(
                allNews.map(
                    getItemKey
                )
            );


        selectedKeys =
            new Set(
                [...selectedKeys]
                    .filter(
                        key =>
                            validKeys.has(
                                key
                            )
                    )
            );


        saveSelectionSettings();


        buildCategoryButtons();

        renderAll();


        showToast(
            "✅ اخبار بروزرسانی شد."
        );


    } catch (error) {

        console.error(
            "News loading error:",
            error
        );


        newsContainer.innerHTML =
            `
            <div class="status-box error">
                ❌ دریافت اخبار با خطا مواجه شد.
                <br>
                <small>
                    لطفاً چند لحظه بعد دوباره تلاش کنید.
                </small>
            </div>
            `;


        updateStats();

        updatePreview();

    }

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll() {

    buildCategoryButtons();

    renderNews();

    updateStats();

    updatePreview();

}
