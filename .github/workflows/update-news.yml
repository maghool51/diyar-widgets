name: 📰 به‌روزرسانی اخبار دیار قدمگاه

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      # دریافت کد مخزن
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # نصب Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # نصب وابستگی‌ها
      - name: 📦 Install dependencies
        working-directory: diyar-news
        run: npm ci

      # دریافت و پردازش اخبار
      - name: 📰 Fetch news
        working-directory: diyar-news
        run: node fetch-news.js

      # ساخت خلاصه اخبار
      - name: ✨ Generate summaries
        working-directory: diyar-news
        run: node generate-summaries.js

      # بررسی فایل‌های تولیدشده
      - name: 🔎 Check generated files
        working-directory: diyar-news
        run: |
          echo "===== news.json ====="
          ls -lh news.json

          echo "===== news-summary.json ====="
          ls -lh news-summary.json

          echo "===== index.html ====="
          ls -lh index.html

      # Commit و Push
      - name: 💾 Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add diyar-news/index.html
          git add diyar-news/news.json
          git add diyar-news/news-summary.json
          git add diyar-news/news-ticker.html
          git add diyar-news/news.html

          if git diff --cached --quiet; then
            echo "ℹ️ تغییر جدیدی برای Commit وجود ندارد."
          else
            git commit -m "📰 به‌روزرسانی خودکار اخبار"
            git push
          fi
