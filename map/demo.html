<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Diyar Map Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="widget.css">
<style>
  body { font-family:'Vazirmatn',Tahoma,Arial,sans-serif; background:#efe9f2; margin:0; padding:24px 16px; }
  h2 { text-align:center; }
  .row { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
</style>
</head>
<body>
  <h2>تست ویجت — حالت روشن و تیره</h2>
  <div class="row">
    <div id="diyar-widget-light"></div>
    <div id="diyar-widget-dark"></div>
  </div>

  <!-- تنظیمات نمونه به‌جای config.js برای این صفحه‌ی تست -->
  <script>
    window.DiyarMapConfig = {
      containerId: "diyar-widget-light",
      placeName: "کافه دیار (نمونه‌ی روشن)",
      coordinates: { lat: 35.715298, lng: 51.404343 },
      address: "تهران، خیابان ولیعصر",
      image: "https://picsum.photos/seed/light/640/360",
      description: "این یک نمونه‌ی تستی برای بررسی حالت روشن ویجت است.",
      primaryColor: "#6750A4",
      mapZoom: 16,
      buttons: { googleMaps:true, googleNavigation:true, waze:true, neshan:true, balad:true, appleMaps:true },
      features: { showMap:true, showShare:true, showQRCode:true, showDistance:true, showDirection:true, lazyLoad:true, darkMode:"light" },
      labels: { title:"موقعیت و مسیریابی", distancePrefix:"فاصله‌ی شما تا اینجا:", copySuccess:"کپی شد!", copyCoords:"کپی مختصات", copyLink:"کپی لینک", share:"اشتراک‌گذاری", qrTitle:"اسکن برای مسیریابی سریع" }
    };
  </script>
  <script src="widget.js"></script>

  <script>
    // ویجت دوم با پیکربندی مستقل (نمایش استفاده‌ی چندگانه در یک صفحه)
    window.addEventListener("load", function () {
      new window.DiyarMapWidget({
        containerId: "diyar-widget-dark",
        placeName: "کافه دیار (نمونه‌ی تیره)",
        coordinates: { lat: 35.700, lng: 51.400 },
        address: "تهران، میدان ونک",
        image: "https://picsum.photos/seed/dark/640/360",
        description: "این یک نمونه‌ی تستی برای بررسی حالت تیره‌ی ویجت است.",
        primaryColor: "#D0BCFF",
        mapZoom: 15,
        buttons: { googleMaps:true, googleNavigation:true, waze:true, neshan:true, balad:true, appleMaps:true },
        features: { showMap:true, showShare:true, showQRCode:true, showDistance:true, showDirection:true, lazyLoad:false, darkMode:"dark" },
        labels: { title:"موقعیت و مسیریابی", distancePrefix:"فاصله‌ی شما تا اینجا:", copySuccess:"کپی شد!", copyCoords:"کپی مختصات", copyLink:"کپی لینک", share:"اشتراک‌گذاری", qrTitle:"اسکن برای مسیریابی سریع" }
      });
    });
  </script>
</body>
</html>
