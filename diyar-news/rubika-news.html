<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#263238">
<title>مهم‌ترین اخبار روز | دیار قدمگاه</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:10px;
    background:#f1f4f6;
    color:#263238;
    font-family:Tahoma,Arial,sans-serif;
    line-height:1.8;
}

.container{
    width:100%;
    max-width:780px;
    margin:0 auto;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    overflow:hidden;
    padding:20px 14px;
    margin-bottom:8px;
    text-align:center;
    color:#fff;
    background:linear-gradient(135deg,#263238,#455a64);
    border-radius:20px;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
}

.header h1{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.header-subtitle{
    margin-top:4px;
    font-size:14px;
    opacity:.92;
}

.live-light{
    display:inline-block;
    width:10px;
    height:10px;
    margin-left:7px;
    border-radius:50%;
    background:#f44336;
    box-shadow:0 0 8px rgba(244,67,54,.8);
    animation:blink 1.2s infinite;
}

@keyframes blink{
    0%,100%{opacity:1}
    50%{opacity:.25}
}

/* =========================
   CONTROLS
========================= */

.controls{
    background:#fff;
    padding:10px;
    border-radius:18px;
    box-shadow:0 2px 9px rgba(0,0,0,.07);
    margin-bottom:10px;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    margin-bottom:9px;
}

.category-btn{
    border:0;
    border-radius:12px;
    padding:7px 12px;
    background:#eceff1;
    color:#37474f;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.category-btn:hover{
    transform:translateY(-1px);
}

.category-btn.active{
    background:#37474f;
    color:#fff;
}

/* =========================
   ADMIN SETTINGS
========================= */

.admin-settings{
    margin-top:8px;
    padding:12px;
    border-radius:16px;
    background:#f8fafb;
    border:1px solid #e1e7ea;
}

.admin-title{
    margin-bottom:8px;
    color:#37474f;
    font-size:14px;
    font-weight:800;
}

.admin-grid{
    display:grid;
    grid-template-columns:1fr 1.3fr;
    gap:7px;
}

.admin-input{
    width:100%;
    min-width:0;
    padding:10px 11px;
    border:1px solid #cfd8dc;
    border-radius:12px;
    background:#fff;
    color:#263238;
    font-family:inherit;
    font-size:13px;
    outline:none;
}

.admin-input:focus{
    border-color:#607d8b;
    box-shadow:0 0 0 2px rgba(96,125,139,.12);
}

.admin-save{
    width:100%;
    margin-top:8px;
    padding:9px 12px;
    border:0;
    border-radius:12px;
    background:#455a64;
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.admin-save:hover{
    background:#37474f;
}

.admin-preview{
    margin-top:9px;
    padding:8px 10px;
    border-radius:11px;
    background:#fff;
    border:1px dashed #cfd8dc;
    color:#455a64;
    font-size:13px;
}

.admin-preview a{
    color:#1565c0;
    font-weight:800;
    text-decoration:none;
}

.admin-preview a:hover{
    text-decoration:underline;
}

.admin-hint{
    margin-top:5px;
    color:#78909c;
    font-size:11px;
}

/* =========================
   ACTIONS
========================= */

.action-row{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.action-btn{
    flex:1;
    border:0;
    border-radius:13px;
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}

.copy-btn{
    background:#1976d2;
    color:#fff;
}

.copy-btn:hover{
    background:#1565c0;
}

.refresh-btn{
    background:#eceff1;
    color:#37474f;
}

.refresh-btn:hover{
    background:#dfe4e6;
}

.update-info{
    margin-top:8px;
    text-align:center;
    color:#78909c;
    font-size:11px;
}

/* =========================
   NEWS
========================= */

.news-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.news-card{
    position:relative;
    padding:13px 13px 12px;
    background:#fff;
    border-radius:16px;
    border-right:4px solid #ef5350;
    box-shadow:0 2px 8px rgba(0,0,0,.065);
}

.news-title{
    margin:0 0 5px;
    color:#263238;
    font-size:16px;
    font-weight:800;
    line-height:1.8;
}

.news-meta{
    color:#78909c;
    font-size:11px;
    margin-bottom:5px;
}

.news-summary{
    color:#455a64;
    font-size:13px;
    line-height:1.9;
}

.fresh-badge{
    display:inline-block;
    margin-right:5px;
    padding:1px 6px;
    border-radius:7px;
    background:#ffebee;
    color:#d32f2f;
    font-size:10px;
    font-weight:800;
}

.empty{
    padding:30px 15px;
    background:#fff;
    border-radius:16px;
    text-align:center;
    color:#78909c;
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:12px;
    padding:17px 10px;
    background:#263238;
    color:#fff;
    border-radius:18px;
    text-align:center;
    font-size:13px;
    line-height:2;
}

.footer a{
    color:#fff;
    text-decoration:none;
    font-weight:800;
}

.footer a:hover{
    text-decoration:underline;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:50%;
    bottom:20px;
    z-index:9999;
    transform:translateX(50%) translateY(20px);
    min-width:220px;
    max-width:90%;
    padding:11px 15px;
    border-radius:13px;
    background:#263238;
    color:#fff;
    text-align:center;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    box-shadow:0 5px 18px rgba(0,0,0,.2);
}

.toast.show{
    opacity:1;
    transform:translateX(50%) translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:6px;
    }

    .header{
        padding:16px 10px;
        border-radius:17px;
    }

    .header h1{
        font-size:20px;
    }

    .admin-grid{
        grid-template-columns:1fr;
    }

    .action-row{
        flex-direction:column;
    }

    .action-btn{
        width:100%;
    }

    .news-title{
        font-size:15px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition:none !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

    <h1>
        <span class="live-light"></span>
        📰 مهم‌ترین اخبار روز
    </h1>

    <div id="dateText" class="header-subtitle">
        🏡 دیار قدمگاه
    </div>

</header>


<section class="controls">

    <div id="categories" class="categories"></div>


    <!-- مشخصات منتشرکننده -->

    <div class="admin-settings">

        <div class="admin-title">
            ✍️ مشخصات انتشار
        </div>

        <div class="admin-grid">

            <input
                id="adminName"
                class="admin-input"
                type="text"
                maxlength="80"
                autocomplete="name"
                placeholder="نام شما؛ در صورت خالی بودن: ادمین"
            >

            <input
                id="adminRubika"
                class="admin-input"
                type="url"
                maxlength="200"
                inputmode="url"
                autocomplete="url"
                placeholder="لینک آیدی روبیکا، مثلاً https://rubika.ir/username"
            >

        </div>

        <button
            id="saveAdminBtn"
            class="admin-save"
            type="button"
        >
            💾 ذخیره مشخصات
        </button>

        <div id="adminPreview" class="admin-preview"></div>

        <div class="admin-hint">
            نام و لینک فقط روی همین دستگاه ذخیره می‌شود.
        </div>

    </div>


    <div class="action-row">

        <button
            id="copyBtn"
            class="action-btn copy-btn"
            type="button"
        >
            📋 کپی برای روبیکا
        </button>

        <button
            id="refreshBtn"
            class="action-btn refresh-btn"
            type="button"
        >
            🔄 بروزرسانی
        </button>

    </div>


    <div id="updateInfo" class="update-info">
        در حال دریافت اخبار...
    </div>

</section>


<main id="newsList" class="news-list">

    <div class="empty">
        ⏳ در حال دریافت اخبار...
    </div>

</main>


<footer class="footer">

    🏡 دیار قدمگاه
    <br>

    <span id="footerPublisher">
        ✍️ ادمین
    </span>

</footer>

</div>


<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

/*
 * نکته مهم:
 * این لینک عمداً به صفحه ۱۰۰ خبر می‌رود،
 * نه صفحه rubika-news.html
 */
const SUMMARY_URL =
"https://raw.githubusercontent.com/maghool51/diyar-widgets/main/diyar-news/news-summary.json";

const RUBIKA_PAGE_URL =
"https://maghool51.github.io/diyar-widgets/diyar-news/news.html";

const NEWS_COUNT = 10;

const MAX_SUMMARY_LENGTH = 150;

const ADMIN_STORAGE_KEY =
"diyarRubikaPublisherV1";

const DEFAULT_ADMIN_NAME =
"ادمین";

const DEFAULT_ADMIN_RUBIKA =
"";


/* =========================================================
   STATE
========================================================= */

let allNews = [];

let currentCategory = "all";

let publisherName =
DEFAULT_ADMIN_NAME;

let publisherRubika =
DEFAULT_ADMIN_RUBIKA;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function toPersianDigits(value){

    return String(value)
        .replace(/\d/g,function(d){
            return "۰۱۲۳۴۵۶۷۸۹"[Number(d)];
        });

}


/* =========================================================
   SUMMARY
========================================================= */

function cleanSummary(value){

    let text =
        String(value ?? "")
        .replace(/<[^>]*>/g," ")
        .replace(/\s+/g," ")
        .trim();


    if(!text){
        return "";
    }


    if(text.length > MAX_SUMMARY_LENGTH){

        text =
            text.substring(
                0,
                MAX_SUMMARY_LENGTH
            ).trim() + "…";

    }


    return text;

}


/* =========================================================
   DATE / TIME
========================================================= */

function getPersianDate(){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"numeric",
                day:"numeric"
            }
        ).format(new Date());

    }catch{

        return "";

    }

}


function getPersianTime(){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(new Date());

    }catch{

        return "";

    }

}


function formatDate(value){

    if(!value){
        return "";
    }

    try{

        const date =
            new Date(value);

        if(Number.isNaN(date.getTime())){
            return "";
        }

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"numeric",
                day:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(date);

    }catch{

        return "";

    }

}


/* =========================================================
   ADMIN SETTINGS
========================================================= */

function sanitizePublisherName(value){

    const name =
        String(value ?? "")
        .replace(/\s+/g," ")
        .trim();

    return name ||
        DEFAULT_ADMIN_NAME;

}


function normalizeRubikaUrl(value){

    const raw =
        String(value ?? "")
        .trim();

    if(!raw){
        return "";
    }

    try{

        const url =
            new URL(raw);

        const host =
            url.hostname.toLowerCase();


        if(
            url.protocol !== "https:" ||
            ![
                "rubika.ir",
                "www.rubika.ir"
            ].includes(host)
        ){

            return "";

        }


        const path =
            url.pathname
            .replace(/^\/+/,"")
            .replace(/\/+$/,"");


        if(!path){
            return "";
        }


        return (
            "https://rubika.ir/" +
            path +
            (url.search || "")
        );

    }catch{

        return "";

    }

}


function updatePublisherUI(){

    const preview =
        document.getElementById(
            "adminPreview"
        );

    const footer =
        document.getElementById(
            "footerPublisher"
        );

    const nameInput =
        document.getElementById(
            "adminName"
        );

    const rubikaInput =
        document.getElementById(
            "adminRubika"
        );


    if(nameInput){

        nameInput.value =
            publisherName === DEFAULT_ADMIN_NAME
                ? ""
                : publisherName;

    }


    if(rubikaInput){

        rubikaInput.value =
            publisherRubika;

    }


    if(preview){

        preview.innerHTML = "";


        const prefix =
            document.createElement("span");

        prefix.textContent =
            "پیش‌نمایش: ✍️ ";

        preview.appendChild(prefix);


        if(publisherRubika){

            const link =
                document.createElement("a");

            link.href =
                publisherRubika;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";

            link.textContent =
                publisherName;

            preview.appendChild(link);

        }else{

            const name =
                document.createElement("span");

            name.textContent =
                publisherName;

            preview.appendChild(name);

        }

    }


    if(footer){

        footer.innerHTML = "";


        const prefix =
            document.createElement("span");

        prefix.textContent =
            "✍️ ";

        footer.appendChild(prefix);


        if(publisherRubika){

            const link =
                document.createElement("a");

            link.href =
                publisherRubika;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";

            link.textContent =
                publisherName;

            footer.appendChild(link);

        }else{

            const name =
                document.createElement("span");

            name.textContent =
                publisherName;

            footer.appendChild(name);

        }

    }

}


function loadPublisherSettings(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    ADMIN_STORAGE_KEY
                ) || "null"
            );


        if(
            saved &&
            typeof saved === "object"
        ){

            publisherName =
                sanitizePublisherName(
                    saved.name
                );

            publisherRubika =
                normalizeRubikaUrl(
                    saved.rubika
                );

        }

    }catch{

        publisherName =
            DEFAULT_ADMIN_NAME;

        publisherRubika =
            DEFAULT_ADMIN_RUBIKA;

    }


    updatePublisherUI();

}


function savePublisherSettings(){

    const nameInput =
        document.getElementById(
            "adminName"
        );

    const rubikaInput =
        document.getElementById(
            "adminRubika"
        );


    const rawName =
        nameInput
            ? nameInput.value
            : "";


    const rawRubika =
        rubikaInput
            ? rubikaInput.value
            : "";


    const normalizedRubika =
        normalizeRubikaUrl(
            rawRubika
        );


    if(
        rawRubika.trim() &&
        !normalizedRubika
    ){

        showToast(
            "⚠️ لینک باید از rubika.ir باشد."
        );

        if(rubikaInput){
            rubikaInput.focus();
        }

        return;

    }


    publisherName =
        sanitizePublisherName(
            rawName
        );

    publisherRubika =
        normalizedRubika;


    try{

        localStorage.setItem(

            ADMIN_STORAGE_KEY,

            JSON.stringify({

                name:
                    publisherName,

                rubika:
                    publisherRubika

            })

        );

    }catch{}


    updatePublisherUI();


    showToast(
        "✅ مشخصات انتشار ذخیره شد."
    );

}


/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews(){

    const list =
        document.getElementById(
            "newsList"
        );

    const info =
        document.getElementById(
            "updateInfo"
        );


    list.innerHTML = `
        <div class="empty">
            ⏳ در حال دریافت اخبار...
        </div>
    `;


    try{

        const response =
            await fetch(
                SUMMARY_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        let items = [];


        if(Array.isArray(data)){

            items = data;

        }else if(
            Array.isArray(data.news)
        ){

            items = data.news;

        }else if(
            Array.isArray(data.items)
        ){

            items = data.items;

        }


        allNews =
            items
            .map(function(item){

                const normalized = {

                    ...item,

                    title:
                        String(
                            item.title ||
                            item.name ||
                            "بدون عنوان"
                        ).trim(),

                    source:
                        String(
                            item.source ||
                            item.publisher ||
                            "منبع نامشخص"
                        ).trim(),

                    summary:
                        cleanSummary(
                            item.summary ||
                            item.description ||
                            item.content ||
                            ""
                        ),

                    date:
                        item.date ||
                        item.pubDate ||
                        item.publishedAt ||
                        item.published ||
                        item.isoDate ||
                        "",

                    link:
                        item.link ||
                        item.url ||
                        "#"

                };


                // دسته‌بندی فقط یک‌بار، در fetch-news.js، انجام می‌شود؛
                // این‌جا فقط همان مقدار نهایی (از news-summary.json) مصرف
                // می‌شود تا با news.html و news-ticker.html هماهنگ بماند.
                normalized.category =
                    String(
                        item.category || ""
                    ).trim() || "متفرقه";


                return normalized;

            })
            .filter(function(item){

                return item.title;

            });


        allNews.sort(function(a,b){

            const da =
                new Date(a.date).getTime();

            const db =
                new Date(b.date).getTime();


            if(
                Number.isNaN(da) &&
                Number.isNaN(db)
            ){

                return 0;

            }

            if(Number.isNaN(da)){
                return 1;
            }

            if(Number.isNaN(db)){
                return -1;
            }

            return db - da;

        });


        buildCategories();

        renderNews();


        const lastUpdate =
            data.lastUpdatePersian ||
            data.lastUpdate ||
            "";


        info.textContent =
            lastUpdate
                ? "🕐 آخرین بروزرسانی: " +
                  lastUpdate
                : "🕐 اخبار با موفقیت بروزرسانی شد.";


        document.getElementById(
            "dateText"
        ).textContent =
            "🏡 دیار قدمگاه • " +
            getPersianDate();


    }catch(error){

        console.error(
            "News loading error:",
            error
        );


        list.innerHTML = `
            <div class="empty">
                ❌ دریافت اخبار با مشکل مواجه شد.<br>
                لطفاً دوباره بروزرسانی کنید.
            </div>
        `;


        info.textContent =
            "❌ خطا در دریافت اخبار";

    }

}


/* =========================================================
   CATEGORIES
========================================================= */

function buildCategories(){

    const container =
        document.getElementById(
            "categories"
        );


    const counts = {};


    allNews.forEach(function(item){

        const category =
            item.category ||
            "متفرقه";


        counts[category] =
            (counts[category] || 0) + 1;

    });


    const categories = [

        {
            id:"all",
            title:"همه"
        },

        {
            id:"سیاسی",
            title:"سیاسی"
        },

        {
            id:"بین‌الملل",
            title:"بین‌الملل"
        },

        {
            id:"اقتصادی",
            title:"اقتصادی"
        },

        {
            id:"اجتماعی",
            title:"اجتماعی"
        },

        {
            id:"ورزشی",
            title:"ورزشی"
        },

        {
            id:"علمی و فناوری",
            title:"علمی و فناوری"
        },

        {
            id:"فرهنگی و هنری",
            title:"فرهنگی و هنری"
        },

        {
            id:"متفرقه",
            title:"متفرقه"
        }

    ];


    container.innerHTML = "";


    categories.forEach(function(category){

        if(
            category.id !== "all" &&
            !counts[category.id]
        ){

            return;

        }


        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "category-btn" +
            (
                currentCategory === category.id
                    ? " active"
                    : ""
            );


        const count =
            category.id === "all"
                ? allNews.length
                : counts[category.id] || 0;


        button.textContent =
            category.title +
            " (" +
            toPersianDigits(count) +
            ")";


        button.addEventListener(
            "click",
            function(){

                currentCategory =
                    category.id;

                buildCategories();

                renderNews();

            }
        );


        container.appendChild(button);

    });

}


/* =========================================================
   FILTER
========================================================= */

function getVisibleNews(){

    let items =
        allNews;


    if(
        currentCategory !== "all"
    ){

        items =
            allNews.filter(function(item){

                return (
                    item.category ===
                    currentCategory
                );

            });

    }


    return items.slice(
        0,
        NEWS_COUNT
    );

}


/* =========================================================
   NEW NEWS
========================================================= */

function isNewNews(item){

    if(!item.date){
        return false;
    }


    const date =
        new Date(item.date);


    if(Number.isNaN(date.getTime())){
        return false;
    }


    const diff =
        Date.now() -
        date.getTime();


    return (
        diff >= 0 &&
        diff <= 24 * 60 * 60 * 1000
    );

}


/* =========================================================
   RENDER NEWS
========================================================= */

function renderNews(){

    const list =
        document.getElementById(
            "newsList"
        );


    const items =
        getVisibleNews();


    if(!items.length){

        list.innerHTML = `
            <div class="empty">
                📭 خبری در این دسته وجود ندارد.
            </div>
        `;

        return;

    }


    list.innerHTML = "";


    items.forEach(function(item,index){

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "news-card";


        const title =
            document.createElement(
                "h2"
            );


        title.className =
            "news-title";


        title.textContent =
            toPersianDigits(
                (index + 1) +
                ". "
            ) +
            item.title;


        if(isNewNews(item)){

            const badge =
                document.createElement(
                    "span"
                );


            badge.className =
                "fresh-badge";


            badge.textContent =
                "جدید";


            title.appendChild(badge);

        }


        card.appendChild(title);


        const meta =
            document.createElement(
                "div"
            );


        meta.className =
            "news-meta";


        const dateText =
            formatDate(item.date);


        meta.textContent =
            "📰 " +
            item.source +
            "  •  🏷 " +
            item.category +
            (
                dateText
                    ? "  •  🕐 " +
                      dateText
                    : ""
            );


        card.appendChild(meta);


        if(item.summary){

            const summary =
                document.createElement(
                    "div"
                );


            summary.className =
                "news-summary";


            summary.textContent =
                "📝 " +
                item.summary;


            card.appendChild(summary);

        }


        if(
            item.link &&
            item.link !== "#"
        ){

            card.style.cursor =
                "pointer";


            card.addEventListener(
                "click",
                function(){

                    window.open(
                        item.link,
                        "_blank",
                        "noopener"
                    );

                }
            );

        }


        list.appendChild(card);

    });

}

/* =========================================================
   RUBIKA FOOTER
========================================================= */

function rubikaFooter(){

    const NL =

    const lines = [

        "╔══════════════════════════╗",

        "          📖 متن کامل اخبار",

        "",

        "       🔗 مشاهده و مطالعه خبرها:",

        "       " +
        RUBIKA_PAGE_URL,

        "",

        "╚══════════════════════════╝",

        "",

        "✍️ " +
        publisherName

    ];


    /*
     * لینک آیدی منتشرکننده

     */

    if(publisherRubika){

        lines.push(
            publisherRubika
        );

    }


    return lines.join(NL);

}


/* =========================================================
   CREATE RUBIKA TEXT
========================================================= */

function createRubikaText(){

    const NL =
        "\n";


    const items =
        getVisibleNews();


    if(!items.length){

        return [

            rubikaHeader(),

            "",

            "📭 در حال حاضر خبری برای انتشار وجود ندارد.",

            "",

            rubikaFooter()

        ].join(NL);

    }


    const parts = [

        rubikaHeader(),

        ""

    ];


    items.forEach(function(item,index){

        parts.push(

            "🔴 " +
            toPersianDigits(
                index + 1
            ) +
            ". " +
            item.title

        );


        parts.push(

            "   📰 " +
            item.source +
            "  •  🏷 " +
            item.category

        );


        if(item.summary){

            parts.push(

                "   📝 " +
                item.summary

            );

        }


        parts.push("");

        parts.push(
            "──────────────────────────"
        );

        parts.push("");

    });


    parts.push(
        rubikaFooter()
    );


    return parts.join(NL);

}


/* =========================================================
   COPY TO RUBIKA
========================================================= */

async function copyForRubika(){

    const text =
        createRubikaText();


    try{

        if(
            navigator.clipboard &&
            window.ClipboardItem
        ){

            const blob =
                new Blob(
                    [text],
                    {
                        type:"text/plain"
                    }
                );


            const item =
                new ClipboardItem({

                    "text/plain":
                        blob

                });


            await navigator.clipboard.write([
                item
            ]);


            showToast(
                "✅ متن اخبار برای روبیکا کپی شد."
            );

            return;

        }


        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                text
            );


            showToast(
                "✅ متن اخبار برای روبیکا کپی شد."
            );

            return;

        }


        throw new Error(
            "Clipboard unavailable"
        );


    }catch(error){

        try{

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                text;


            textarea.style.position =
                "fixed";

            textarea.style.opacity =
                "0";

            textarea.style.pointerEvents =
                "none";


            document.body.appendChild(
                textarea
            );


            textarea.focus();

            textarea.select();


            const success =
                document.execCommand(
                    "copy"
                );


            textarea.remove();


            if(success){

                showToast(
                    "✅ متن اخبار برای روبیکا کپی شد."
                );

            }else{

                throw new Error(
                    "Copy failed"
                );

            }

        }catch(error2){

            console.error(error2);

            showToast(
                "❌ کپی خودکار انجام نشد؛ متن را دستی انتخاب کنید."
            );

        }

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){
        return;
    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}
