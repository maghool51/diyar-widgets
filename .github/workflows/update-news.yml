name: Update News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: diyar-news

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: diyar-news/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run news script
        run: node fetch-news.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # همیشه آخرین تغییرات remote رو بگیر (بدون rebase)
          git fetch origin main
          git reset --hard origin/main
          
          # فایل‌های جدید رو اضافه کن
          git add index.html news.html news.json news-ticker.html
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "Auto-update news: $(date +'%Y-%m-%d %H:%M:%S')"
          
          # با force push بفرست (تغییرات قبلی رو بازنویسی کن)
          git push --force origin HEAD:main
