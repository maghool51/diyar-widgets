<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Diyar Player</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1db954">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
</head>
<body>
    <!-- App Shell -->
    <div id="app" role="application" aria-label="Diyar Player">
        <!-- Header -->
        <header id="app-header" role="banner">
            <h1>🎵 Diyar Player</h1>
            <div id="header-controls">
                <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">🌙</button>
                <button id="settings-toggle" aria-label="Settings" title="Settings">⚙️</button>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Player Area -->
            <section id="player-area" aria-label="Player">
                <!-- Video container (hidden for audio) -->
                <div id="video-container" style="display:none;">
                    <video id="video-element" controls playsinline preload="metadata"></video>
                </div>

                <!-- Audio visualizer and cover -->
                <div id="audio-visualizer-container">
                    <div id="cover-art">
                        <img id="album-cover" src="assets/default-cover.png" alt="Album cover">
                    </div>
                    <canvas id="visualizer-canvas" aria-hidden="true"></canvas>
                </div>

                <!-- Metadata -->
                <div id="track-info">
                    <div id="track-title">No media loaded</div>
                    <div id="track-artist">—</div>
                </div>

                <!-- Progress -->
                <div id="progress-container" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <span id="current-time">0:00</span>
                    <input type="range" id="seek-slider" min="0" max="1000" value="0" step="1" aria-label="Seek slider">
                    <span id="duration-time">0:00</span>
                </div>

                <!-- Controls -->
                <div id="controls" role="group" aria-label="Playback controls">
                    <button id="shuffle-btn" aria-label="Shuffle" title="Shuffle">🔀</button>
                    <button id="prev-btn" aria-label="Previous" title="Previous">⏮️</button>
                    <button id="play-pause-btn" aria-label="Play" title="Play">▶️</button>
                    <button id="stop-btn" aria-label="Stop" title="Stop">⏹️</button>
                    <button id="next-btn" aria-label="Next" title="Next">⏭️</button>
                    <button id="repeat-btn" aria-label="Repeat" title="Repeat">🔁</button>
                </div>

                <!-- Volume and speed -->
                <div id="extra-controls">
                    <div id="volume-container">
                        <button id="mute-btn" aria-label="Mute" title="Mute">🔊</button>
                        <input type="range" id="volume-slider" min="0" max="100" value="80" step="1" aria-label="Volume">
                    </div>
                    <div id="speed-container">
                        <label for="speed-select">Speed</label>
                        <select id="speed-select" aria-label="Playback speed">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1.0" selected>1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2.0">2.0x</option>
                        </select>
                    </div>
                    <button id="pip-btn" aria-label="Picture-in-Picture" title="Picture-in-Picture">⏺️</button>
                    <button id="fullscreen-btn" aria-label="Fullscreen" title="Fullscreen">⛶</button>
                    <button id="sleep-timer-btn" aria-label="Sleep timer" title="Sleep timer">⏲️</button>
                </div>
            </section>

            <!-- Playlist Sidebar -->
            <aside id="playlist-sidebar" aria-label="Playlist">
                <div id="playlist-header">
                    <h2>Playlist</h2>
                    <div id="playlist-actions">
                        <button id="add-files-btn" aria-label="Add files">📂</button>
                        <button id="add-url-btn" aria-label="Add URL">🔗</button>
                        <button id="clear-playlist-btn" aria-label="Clear playlist">🗑️</button>
                        <button id="export-playlist-btn" aria-label="Export playlist">⬇️</button>
                        <button id="import-playlist-btn" aria-label="Import playlist">⬆️</button>
                    </div>
                </div>
                <div id="playlist-search">
                    <input type="text" id="playlist-search-input" placeholder="Search playlist..." aria-label="Search playlist">
                </div>
                <ul id="playlist-items" role="list" aria-label="Playlist items">
                    <!-- Dynamic items -->
                </ul>
                <div id="playlist-empty" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px;">
                    <p>Playlist is empty</p>
                    <button id="empty-add-files-btn" class="fab">📂 Select Media</button>
                    <p style="font-size: 0.8rem; color: var(--text-secondary);">or paste a URL above</p>
                </div>
            </aside>
        </main>

        <!-- Floating Action Button (always visible on mobile) -->
        <button id="fab-add-files" class="fab" aria-label="Add files" title="Add files">➕</button>

        <!-- Hidden file input -->
        <input type="file" id="file-input" accept="audio/*,video/*" multiple style="display:none;">

        <!-- URL input dialog (hidden) -->
        <div id="url-dialog" role="dialog" aria-label="Add URL" style="display:none;">
            <div id="url-dialog-content">
                <h3>Add URL</h3>
                <input type="url" id="url-input" placeholder="Paste media URL (MP3, AAC, FLAC, WAV, OGG, OPUS, MP4, WEBM, M4A, etc.)">
                <div id="url-dialog-actions">
                    <button id="url-add-btn">Add</button>
                    <button id="url-cancel-btn">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Sleep timer dialog -->
        <div id="sleep-dialog" role="dialog" aria-label="Sleep timer" style="display:none;">
            <div id="sleep-dialog-content">
                <h3>Sleep Timer</h3>
                <p>Stop playback after:</p>
                <div>
                    <button class="sleep-option" data-minutes="5">5 min</button>
                    <button class="sleep-option" data-minutes="10">10 min</button>
                    <button class="sleep-option" data-minutes="15">15 min</button>
                    <button class="sleep-option" data-minutes="30">30 min</button>
                    <button class="sleep-option" data-minutes="60">60 min</button>
                    <button class="sleep-option" data-minutes="0">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Settings dialog -->
        <div id="settings-dialog" role="dialog" aria-label="Settings" style="display:none;">
            <div id="settings-content">
                <h3>Settings</h3>
                <div>
                    <label for="theme-select">Theme</label>
                    <select id="theme-select" aria-label="Theme">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                        <option value="green">Green</option>
                        <option value="golden">Golden</option>
                        <option value="system">System</option>
                    </select>
                </div>
                <button id="settings-close-btn">Close</button>
            </div>
        </div>

        <!-- Toast notifications -->
        <div id="toast" role="alert" aria-live="polite"></div>
    </div>

    <!-- Service Worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered:', reg))
                .catch(err => console.warn('SW registration failed:', err));
        }
    </script>

    <!-- Main script -->
    <script src="script.js" type="module"></script>
</body>
    </html>
