<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ویجت آمار بازدید دیار | Diyar Visitor Widget</title>
  <meta name="description" content="ویجت سبک و زیبای نمایش آمار بازدیدکنندگان با پشتیبانی از راست‌به‌چپ، حالت روشن/تیره و انیمیشن‌های نرم." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#4C6EF5" />

  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css"
  />
  <link rel="stylesheet" href="./visitor.css" />
</head>
<body>
  <!--
    ============================================================
    SVG Sprite — every icon used by the widget is defined once
    here as a <symbol> and referenced elsewhere via <use>. This
    keeps markup lean and lets every icon inherit `currentColor`.
    Standalone copies of the same artwork live in /icons for use
    outside this page (READMEs, design tools, etc.).
    ============================================================
  -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="icon-eye" viewBox="0 0 24 24" fill="none">
        <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
      </symbol>

      <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 9.5H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M8 3V6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M16 3V6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="8" cy="13.5" r="1.1" fill="currentColor"/>
        <circle cx="12" cy="13.5" r="1.1" fill="currentColor"/>
        <circle cx="16" cy="13.5" r="1.1" fill="currentColor"/>
      </symbol>

      <symbol id="icon-globe" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3 12H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12 3C14.5 5.7 15.8 8.8 15.8 12C15.8 15.2 14.5 18.3 12 21C9.5 18.3 8.2 15.2 8.2 12C8.2 8.8 9.5 5.7 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </symbol>

      <symbol id="icon-online" viewBox="0 0 24 24" fill="none">
        <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 13.6394 3.43857 15.1768 4.2 16.5L3 21L7.5 19.8C8.82316 20.5614 10.3606 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="9" cy="12" r="1.1" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.1" fill="currentColor"/>
        <circle cx="15" cy="12" r="1.1" fill="currentColor"/>
      </symbol>

      <symbol id="icon-chart" viewBox="0 0 24 24" fill="none">
        <path d="M4 20V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10 20V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M16 20V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M20.5 8.5L16 13L12.5 9.5L9 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <symbol id="icon-clock" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 7V12L15.5 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>

      <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none">
        <path d="M4 12C4 7.58172 7.58172 4 12 4C15.0637 4 17.7238 5.72916 19.0426 8.27002" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M20 12C20 16.4183 16.4183 20 12 20C8.93627 20 6.27618 18.2708 4.95736 15.73" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M19.5 4.5V8.5H15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 19.5V15.5H8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <main class="diyar-page">
    <div class="diyar-page__backdrop" aria-hidden="true"></div>

    <section class="diyar-page__intro">
      <h1 class="diyar-page__heading">Diyar Visitor Widget</h1>
      <p class="diyar-page__subheading">
        ویجت سبک، ماژولار و بدون وابستگی برای نمایش زیبای آمار بازدیدکنندگان سایت.
      </p>
    </section>

    <!-- Widget mounts here automatically on DOMContentLoaded -->
    <div id="diyar-visitor-widget"></div>

    <p class="diyar-page__note">
      نسخه‌ی نمایشی با داده‌های آزمایشی اجرا می‌شود. برای اتصال به داده‌ی واقعی، فقط کافیست
      تابع <code>fetchVisitorStats</code> در فایل <code>utils.js</code> ویرایش شود.
    </p>
  </main>

  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./theme.js"></script>
  <script src="./animations.js"></script>
  <script src="./visitor.js"></script>
</body>
</html>
