function toPersianDigits(value) {

    return String(value ?? "")
        .replace(
            /\d/g,
            function(digit) {

                return "۰۱۲۳۴۵۶۷۸۹"[digit];

            }
        );
}


/* =========================================================
   ایمن‌سازی HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   نرمال‌سازی متن
   ========================================================= */

function normalizeText(value) {

    return String(value ?? "")

        .replace(
            /ي/g,
            "ی"
        )

        .replace(
            /ى/g,
            "ی"
        )

        .replace(
            /ك/g,
            "ک"
        )

        .replace(
            /ۀ/g,
            "ه"
        )

        .replace(
            /\u200c/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim()
        .toLowerCase();
}

/* =========================================================
   تاریخ
   ========================================================= */

function formatDate(dateString) {

    if (!dateString) {

        return "";
    }


    const date =
        new Date(
            dateString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            dateString
        );
    }


    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return String(
            dateString
        );
    }
}

async function loadNews() {

    const newsList =
        document.getElementById(
            "newsList"
        );


    const updateInfo =
        document.getElementById(
            "updateInfo"
        );


    newsList.innerHTML =
        `
        <div class="status">
            در حال دریافت اخبار و چکیده‌ها...
        </div>
        `;


    try {

        const response =
            await fetch(
                SUMMARY_URL +
                "?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "خطا در دریافت news-summary.json"
            );
        }


        const data =
            await response.json();


        allNews =
            Array.isArray(
                data.news
            )
                ? data.news
                : [];


        buildCategories();


        renderNews();


        if (
            data.lastUpdate
        ) {

            updateInfo.textContent =
                "آخرین بروزرسانی: " +
                formatDate(
                    data.lastUpdate
                );

        } else {

            updateInfo.textContent =
                "تعداد اخبار: " +
                toPersianDigits(
                    allNews.length
                );
        }


    } catch (error) {

        console.error(
            error
        );


        newsList.innerHTML =
            `
            <div class="status">

                ❌ دریافت اخبار با مشکل روبه‌رو شد.

                <br><br>

                لطفاً دوباره بروزرسانی کنید.

            </div>
            `;


        updateInfo.textContent =
            "خطا در دریافت اطلاعات";
    }
}

                category.label;


            if (
                category.value ===
                currentCategory
            ) {

                button.classList.add(
                    "active"
                );
            }


            button.addEventListener(
                "click",
                function() {

                    currentCategory =
                        category.value;


                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    renderNews();
                }
            );


            container.appendChild(
                button
            );

        }
    );
}


/* =========================================================
   اخبار قابل نمایش
   ========================================================= */

function getVisibleNews() {

    let filteredNews;


    if (
        currentCategory ===
        "all"
    ) {

        filteredNews =
            allNews;

    } else {

        filteredNews =
            allNews.filter(
                function(news) {

                    return (
                        smartCategory(
                            news
                        ) ===
                        currentCategory
                    );
                }
            );
    }


    return filteredNews.slice(
        0,
        NEWS_COUNT
    );
}


/* =========================================================
   نمایش اخبار
   ========================================================= */

function renderNews() {

    const container =
        document.getElementById(
            "newsList"
        );


    const news =
        getVisibleNews();


    if (!news.length) {

        container.innerHTML =
            `
            <div class="status">
                خبری برای نمایش وجود ندارد.
            </div>
            `;

        return;
    }


    container.innerHTML =
        news.map(
            function(item, index) {

                const title =
                    escapeHTML(
                        item.title
                    );


                const source =
                    escapeHTML(
                        item.source ||
                        "منبع نامشخص"
                    );


                const category =
                    escapeHTML(
                        smartCategory(
                            item
                        )
                    );


                const date =
                    escapeHTML(
                        formatDate(
                            item.date
                        )
                    );


                const link =
                    escapeHTML(
                        item.link ||
                        "#"
                    );


                const flag =
                    escapeHTML(
                        item.flag ||
                        "📰"
                    );


                const summary =
                    String(
                        item.summary ||
                        ""
                    ).trim();


                let summaryHTML =
                    "";


                if (summary) {

                    summaryHTML =
                        `
                        <div class="summary">

                            <span class="summary-label">
                                📝 چکیده:
                            </span>

                            ${escapeHTML(
                                summary
                            )}

                        </div>
                        `;
                }


                return `

                <article class="news-card">


                    <div>

                        <span class="news-index">

                            ${toPersianDigits(
                                index + 1
                            )}

                        </span>

                        ${flag}

                    </div>


                    <div class="news-title">

                        ${title}

                    </div>


                    <div class="meta">

                        📰 ${source}

                        <br>

                        🏷 ${category}

                        ${
                            date
                                ? "<br>📅 " + date
                                : ""
                        }

                    </div>


                    ${summaryHTML}


                    <a
                        class="read-link"
                        href="${link}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        🔗 مطالعه متن کامل خبر

                    </a>


                </article>

                `;

            }
        ).join("");
}


/* =========================================================
   ساخت متن مخصوص روبیکا
   ========================================================= */

function createRubikaText() {

    const news =
        getVisibleNews();


    if (!news.length) {

        return "";
    }


    let text =
        "📰 مهم‌ترین اخبار روز | دیار قدمگاه\n\n";


    news.forEach(
        function(item, index) {

            const category =
                smartCategory(
                    item
                );


            text +=
                "🔴 " +
                toPersianDigits(
                    index + 1
                ) +
                ". " +
                String(
                    item.title ||
                    ""
                ).trim() +
                "\n";


            text +=
                "📰 " +
                String(
                    item.source ||
                    "منبع نامشخص"
                ).trim() +
                " | 🏷 " +
                category +
                "\n";


            /*
             * چکیده فقط در صورت وجود
             */

            const summary =
                String(
                    item.summary ||
                    ""
                ).trim();


            if (summary) {

                text +=
                    "📝 " +
                    summary +
                    "\n";
            }


            text += "\n";

        }
    );


    /*
     * فقط یک لینک در انتهای پیام
     */

    text +=
        "ــــــــــــــــــــــــــــ\n" +
        "📰 مشاهده متن کامل اخبار:\n" +
        RUBIKA_PAGE_URL +
        "\n\n" +
        "🏡 دیار قدمگاه\n" +
        "✍️ معقول";


    return text;
}


/* =========================================================
   کپی برای روبیکا
   ========================================================= */

async function copyForRubika() {

    const text =
        createRubikaText();


    if (!text) {

        showToast(
            "خبری برای کپی وجود ندارد."
        );

        return;
    }


    try {

        await navigator
            .clipboard
            .writeText(
                text
            );


        showToast(
            "✅ متن اخبار و چکیده‌ها کپی شد."
        );


    } catch (error) {

        console.error(
            error
        );


        /*
         * روش جایگزین برای مرورگرهای قدیمی
         */

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.left =
            "-9999px";


        textarea.style.top =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();


        textarea.select();


        let copied =
            false;


        try {

            copied =
                document.execCommand(
                    "copy"
                );

        } catch {

            copied =
                false;
        }


        textarea.remove();


        if (copied) {

            showToast(
                "✅ متن اخبار و چکیده‌ها کپی شد."
            );

        } else {

            showToast(
                "❌ کپی خودکار انجام نشد."
            );
        }
    }
}


/* =========================================================
   پیام موقت
   ========================================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function() {

                toast.style.display =
                    "none";

            },
            2500
        );
}


/* =========================================================
   رویدادها
   ========================================================= */

document
    .getElementById(
        "copyBtn"
    )
    .addEventListener(
        "click",
        copyForRubika
    );


document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        loadNews
    );


/* =========================================================
   شروع برنامه
   ========================================================= */

loadNews();

</script>
