========================================================= */

function toPersianDigits(value) {

    return String(value ?? "")
        .replace(
            /\d/g,
            d => "۰۱۲۳۴۵۶۷۸۹"[d]
        );
}


/* =========================================================
   ایمن‌سازی HTML
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   نرمال‌سازی فارسی
========================================================= */

function normalizeText(value) {

    return String(value ?? "")

        .replace(/ي/g, "ی")
        .replace(/ى/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/ۀ/g, "ه")

        .replace(/\u200c/g, " ")

        .replace(/\s+/g, " ")

        .trim()
        .toLowerCase();
}

/* =========================================================
   تاریخ
========================================================= */

function formatDate(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(value);
    }

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return String(value);
    }
}


/* =========================================================
   دریافت اخبار
========================================================= */

async function loadNews() {

    const newsList =
        document.getElementById(
            "newsList"
        );

    const updateInfo =
        document.getElementById(
            "updateInfo"
        );


    newsList.innerHTML =
        `
        <div class="status">
            📰 در حال دریافت اخبار و چکیده‌ها...
        </div>
        `;


    try {

        const response =
            await fetch(
                SUMMARY_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "news-summary.json unavailable"
            );
        }


        const data =
            await response.json();


        allNews =
            Array.isArray(data.news)
                ? data.news
                : [];


        buildCategories();

        renderNews();


        if (data.lastUpdate) {

            updateInfo.textContent =
                "آخرین بروزرسانی: " +
                formatDate(
                    data.lastUpdate
                );

        } else {

            updateInfo.textContent =
                "تعداد اخبار: " +
                toPersianDigits(
                    allNews.length
                );
        }


    } catch (error) {

        console.error(error);


        newsList.innerHTML =
            `
            <div class="status">

                ❌ دریافت اخبار با مشکل روبه‌رو شد.

                <br><br>

                لطفاً دوباره روی «بروزرسانی» بزنید.

            </div>
            `;


        updateInfo.textContent =
            "خطا در دریافت اخبار";
    }
}


/* =========================================================
   دسته‌ها
========================================================= */

function buildCategories() {

    const container =
        document.getElementById(
            "categories"
        );


    container.innerHTML = "";


    const categories = [

        ["all", "📰 همه"],

        ["سیاسی", "🏛 سیاسی"],

        ["اقتصادی", "💰 اقتصادی"],

        ["اجتماعی", "👥 اجتماعی"],

        ["بین‌الملل", "🌍 بین‌الملل"],

        ["ورزشی", "⚽ ورزشی"],

        ["علمی و فناوری", "💻 فناوری"],

        ["متفرقه", "📌 متفرقه"]

    ];


    categories.forEach(
        function(category) {

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className =
                "category-btn";


            button.dataset.category =
                category[0];


            button.textContent =
                category[1];


            if (
                category[0] ===
                currentCategory
            ) {

                button.classList.add(
                    "active"
                );
            }


            button.addEventListener(
                "click",
                function() {

                    currentCategory =
                        category[0];


                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    renderNews();
                }
            );


            container.appendChild(
                button
            );
        }
    );
}


/* =========================================================
   اخبار قابل نمایش
========================================================= */

function getVisibleNews() {

    let filtered;


    if (
        currentCategory ===
        "all"
    ) {

        filtered =
            allNews;

    } else {

        filtered =
            allNews.filter(
                item =>
                    smartCategory(item) ===
                    currentCategory
            );
    }


    return filtered.slice(
        0,
        NEWS_COUNT
    );
}


/* =========================================================
   نمایش اخبار روی صفحه
========================================================= */

function renderNews() {

    const container =
        document.getElementById(
            "newsList"
        );


    const news =
        getVisibleNews();


    if (!news.length) {

        container.innerHTML =
            `
            <div class="status">
                خبری برای این دسته وجود ندارد.
            </div>
            `;

        return;
    }


    container.innerHTML =
        news.map(
            function(item, index) {

                const title =
                    escapeHTML(
                        item.title
                    );


                const source =
                    escapeHTML(
                        item.source ||
                        "منبع نامشخص"
                    );


                const category =
                    escapeHTML(
                        smartCategory(
                            item
                        )
                    );


                const link =
                    escapeHTML(
                        item.link ||
                        "#"
                    );


                const summary =
                    String(
                        item.summary ||
                        ""
                    ).trim();


                let summaryHTML =
                    "";


                if (summary) {

                    summaryHTML =
                        `
                        <div class="summary">

                            📝
                            ${escapeHTML(
                                summary
                            )}

                        </div>
                        `;
                }


                return `

                <article class="news-card">


                    <span class="news-number">

                        ${toPersianDigits(
                            index + 1
                        )}

                    </span>


                    <div class="news-title">

                        ${title}

                    </div>


                    <div class="meta">

                        📰 ${source}
                        &nbsp; | &nbsp;
                        🏷 ${category}

                    </div>


                    ${summaryHTML}


                    <a
                        class="read-link"
                        href="${link}"
                        target="_blank"
                        rel="noopener noreferrer">

                        🔗 مطالعه متن کامل خبر

                    </a>


                </article>

                `;

            }
        ).join("");
}

        function(item, index) {

            const title =
                String(
                    item.title ||
                    ""
                ).trim();


            const source =
                String(
                    item.source ||
                    "منبع نامشخص"
                ).trim();


            const category =
                smartCategory(
                    item
                );


            const summary =
                String(
                    item.summary ||
                    ""
                ).trim();


            /*
             * عنوان
             */

            text +=
                "🔴 " +
                toPersianDigits(
                    index + 1
                ) +
                " | " +
                title +
                "\n\n";


            /*
             * منبع و دسته
             */

            text +=
                "🗞️ " +
                source +
                "  |  🏷 " +
                category +
                "\n";


            /*
             * چکیده
             */

            if (summary) {

                text +=
                    "\n📝 " +
                    summary +
                    "\n";
            }


            /*
             * جداکننده
             */

            text +=
                "\n━━━━━━━━━━━━━━\n\n";
        }
    );


    /*
     * انتهای پیام
     */

    text +=
        "📖 برای مطالعه متن کامل اخبار:\n\n" +
        "🔗 " +
        RUBIKA_PAGE_URL +
        "\n\n" +
        "🏡 دیار قدمگاه\n" +
        "✍️ معقول";


    return text;
}


/* =========================================================
   کپی
========================================================= */

async function copyForRubika() {

    const text =
        createRubikaText();


    if (!text) {

        showToast(
            "خبری برای کپی وجود ندارد."
        );

        return;
    }


    try {

        await navigator
            .clipboard
            .writeText(
                text
            );


        showToast(
            "✅ متن زیبای اخبار برای روبیکا کپی شد."
        );


    } catch (error) {

        console.error(error);


        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        textarea.style.top =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let copied =
            false;


        try {

            copied =
                document.execCommand(
                    "copy"
                );

        } catch {

            copied =
                false;
        }


        textarea.remove();


        if (copied) {

            showToast(
                "✅ متن برای روبیکا کپی شد."
            );

        } else {

            showToast(
                "❌ کپی خودکار انجام نشد."
            );
        }
    }
}


/* =========================================================
   Toast
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function() {

                toast.style.display =
                    "none";

            },
            2500
        );
}


/* =========================================================
   رویدادها
========================================================= */

document
    .getElementById(
        "copyBtn"
    )
    .addEventListener(
        "click",
        copyForRubika
    );


document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        loadNews
    );


/* =========================================================
   شروع
========================================================= */

loadNews();
