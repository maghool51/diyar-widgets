<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دیار قدمگاه - پلیر حرفه‌ای</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#7C5CFF">
    <meta name="description" content="پلیر صوتی و تصویری حرفه‌ای با طراحی مدرن و امکانات کامل">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="app-container" role="application" aria-label="پلیر دیار قدمگاه">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-area" id="logoArea" role="banner">
                    <img id="logoImg" src="assets/images/de9630bd-5d33-40ce-beed-7729e121c01f.png" alt="دیار قدمگاه" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
                    <span class="logo-text" id="logoFallback" style="display:none;">دیار قدمگاه</span>
                </div>
                <button class="mobile-playlist-toggle" id="mobilePlaylistToggle" aria-label="لیست پخش" title="لیست پخش">📋</button>
            </div>
            <div class="header-center">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-box" id="searchBox" placeholder="جستجو در لیست پخش ..." aria-label="جستجو">
            </div>
            <div class="header-right">
                <span class="header-clock" id="clockDisplay">--:--</span>
                <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم" title="تغییر تم">🌙</button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <div class="main-layout">
            <!-- SIDEBAR (Desktop) -->
            <aside class="sidebar" role="complementary" aria-label="لیست پخش">
                <div class="sidebar-header">
                    <h3>📋 لیست پخش <span class="badge" id="playlistCount">0</span></h3>
                    <div class="sidebar-actions">
                        <button id="addFilesBtn" aria-label="افزودن فایل" title="افزودن فایل">➕</button>
                        <button id="clearPlaylistBtn" aria-label="پاک کردن لیست" title="پاک کردن لیست">🗑</button>
                    </div>
                </div>
                <div class="playlist-container" id="playlistContainer" role="list">
                    <div class="empty-state" id="emptyPlaylist">
                        <div class="icon">🎵</div>
                        <p>هیچ فایلی در لیست پخش نیست.<br>فایل‌های صوتی یا تصویری را اضافه کنید.</p>
                    </div>
                </div>
                <!-- File Input -->
                <input type="file" id="fileInput" multiple accept="audio/*,video/*,.mp3,.aac,.m4a,.flac,.wav,.ogg,.opus,.amr,.mp4,.webm,.mkv,.avi,.mov,.mpeg" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;">
                <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="ریزش فایل">
                    <div class="dz-icon">📁</div>
                    <div class="dz-text">فایل‌ها را اینجا بکشید و رها کنید</div>
                    <div class="dz-sub">یا کلیک کنید تا انتخاب کنید</div>
                </div>
            </aside>

            <!-- CONTENT AREA -->
            <main class="content-area" role="main">
                <section class="player-section" aria-label="پخش کننده">
                    <!-- Visualizer / Album Art / Video Container -->
                    <div class="visualizer-wrap" id="visualizerWrap">
                        <canvas id="visualizerCanvas"></canvas>
                        <div class="vis-overlay"></div>
                        <!-- Album Art (shown for audio) -->
                        <div class="album-art-container" id="albumArtContainer">
                            <div class="album-bg" id="albumBg"></div>
                            <div class="album-cover" id="albumCover">
                                <img id="albumCoverImg" src="" alt="کاور آلبوم" style="display:none;">
                                <div class="default-cover" id="defaultCover">🎵</div>
                            </div>
                        </div>
                        <!-- Video Container (shown for video) -->
                        <div class="video-container" id="videoContainer">
                            <video id="videoPlayer" controls></video>
                        </div>
                    </div>

                    <!-- Now Playing -->
                    <div class="now-playing" id="nowPlaying">
                        <div class="cover" id="nowCover">🎵</div>
                        <div class="meta">
                            <div class="track" id="nowTrack">هیچ فایلی انتخاب نشده</div>
                            <div class="artist" id="nowArtist">—</div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="controls" role="toolbar" aria-label="کنترل‌های پخش">
                        <button id="shuffleBtn" aria-label="تصادفی" title="تصادفی">🔀</button>
                        <button id="prevBtn" aria-label="قبلی" title="قبلی">⏮</button>
                        <button id="rewindBtn" aria-label="۱۰ ثانیه عقب" title="۱۰ ثانیه عقب">⏪</button>
                        <button class="primary" id="playBtn" aria-label="پخش/مکث" title="پخش/مکث">▶</button>
                        <button id="forwardBtn" aria-label="۱۰ ثانیه جلو" title="۱۰ ثانیه جلو">⏩</button>
                        <button id="nextBtn" aria-label="بعدی" title="بعدی">⏭</button>
                        <button id="repeatBtn" aria-label="تکرار" title="تکرار">🔁</button>
                    </div>

                    <!-- Progress -->
                    <div class="progress-wrap">
                        <span class="time current" id="currentTime">0:00</span>
                        <div class="progress-track" id="progressTrack" role="slider" aria-label="موقعیت پخش" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <div class="buffer-fill" id="bufferFill"></div>
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time total" id="totalTime">0:00</span>
                    </div>

                    <!-- Bottom Controls -->
                    <div class="bottom-controls">
                        <div class="bottom-left">
                            <div class="vol-wrap">
                                <button id="muteBtn" aria-label="بی صدا" title="بی صدا">🔊</button>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="بلندی صدا">
                            </div>
                            <button id="eqToggle" aria-label="یکسان‌ساز" title="یکسان‌ساز">🎛</button>
                        </div>
                        <div class="bottom-center">
                            <button class="speed-btn" id="speedBtn" aria-label="سرعت پخش" title="سرعت پخش">1.0x</button>
                            <button id="queueToggle" aria-label="صف پخش" title="صف پخش">📋</button>
                        </div>
                        <div class="bottom-right">
                            <button id="favBtn" aria-label="علاقه‌مندی" title="علاقه‌مندی">❤</button>
                            <button id="downloadBtn" aria-label="دانلود" title="دانلود">⬇</button>
                            <button id="pipBtn" aria-label="تصویر در تصویر" title="تصویر در تصویر">📺</button>
                            <button id="fullscreenBtn" aria-label="تمام صفحه" title="تمام صفحه">⛶</button>
                        </div>
                    </div>
                </section>

                <!-- QUEUE PANEL -->
                <div class="queue-panel" id="queuePanel" role="dialog" aria-label="صف پخش">
                    <div class="queue-header">
                        <span>📋 صف پخش</span>
                        <button id="clearQueueBtn">پاک کردن صف</button>
                    </div>
                    <div id="queueList"><div class="queue-empty">صف پخش خالی است</div></div>
                </div>

                <!-- EQUALIZER MODAL -->
                <div class="eq-modal" id="eqModal" role="dialog" aria-label="یکسان‌ساز">
                    <div class="eq-header">
                        <span>🎛 یکسان‌ساز</span>
                        <select id="eqPreset">
                            <option value="flat">Flat</option>
                            <option value="rock">Rock</option>
                            <option value="pop">Pop</option>
                            <option value="jazz">Jazz</option>
                            <option value="classical">Classical</option>
                            <option value="movie">Movie</option>
                            <option value="bass">Bass Boost</option>
                            <option value="treble">Treble Boost</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div class="eq-bands" id="eqBands"></div>
                </div>
            </main>
        </div>

        <!-- FOOTER -->
        <footer class="app-footer">
            <span>🎵 دیار قدمگاه · پلیر حرفه‌ای</span>
            <div class="footer-links">
                <span id="footerStatus">⏸ متوقف</span>
                <span class="dot">·</span>
                <span id="footerMeta">—</span>
            </div>
        </footer>
    </div>

    <!-- MOBILE PLAYLIST DRAWER -->
    <div class="playlist-drawer-overlay" id="playlistDrawerOverlay"></div>
    <div class="playlist-drawer" id="playlistDrawer">
        <div class="drawer-header">
            <span class="drawer-title">📋 لیست پخش</span>
            <button class="drawer-close" id="drawerCloseBtn">✕</button>
        </div>
        <div class="drawer-body" id="drawerBody">
            <!-- playlist items rendered here -->
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>
    <div class="drag-ghost" id="dragGhost" style="display:none;"></div>

    <!-- SCRIPTS -->
    <script src="script.js"></script>
</body>
</html>
