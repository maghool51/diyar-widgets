<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دیار قدمگاه - پلیر حرفه‌ای</title>
    <style>
        /* ============================================================
           CSS VARIABLES & RESET
           ============================================================ */
        :root {
            --primary: #7C5CFF;
            --primary-dark: #5a3fd9;
            --primary-light: #9b80ff;
            --primary-glow: rgba(124, 92, 255, 0.4);
            --gold: #d4a843;
            --gold-light: #f0d080;
            --bg-dark: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #6a6a6a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 18px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --blur: 20px;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(124, 92, 255, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(212, 168, 67, 0.08) 0%, transparent 60%);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* ============================================================
           APP CONTAINER
           ============================================================ */
        .app-container {
            width: 100%;
            max-width: 1480px;
            height: 96vh;
            max-height: 920px;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .app-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent, rgba(255, 255, 255, 0.02));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            min-height: 68px;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .logo-area img {
            height: 42px;
            width: auto;
            filter: drop-shadow(0 0 12px rgba(124, 92, 255, 0.3));
            transition: var(--transition);
        }
        .logo-area img:hover {
            filter: drop-shadow(0 0 20px rgba(124, 92, 255, 0.5));
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.15);
        }

        .header-center {
            flex: 1;
            max-width: 440px;
            min-width: 160px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 8px 16px 8px 44px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            backdrop-filter: blur(6px);
        }
        .search-box:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(124, 92, 255, 0.1);
        }
        .search-box::placeholder {
            color: var(--text-muted);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-clock {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text-primary);
            transform: rotate(20deg);
        }

        /* ============================================================
           MAIN LAYOUT
           ============================================================ */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        /* ============================================================
           SIDEBAR (Playlist) - Desktop
           ============================================================ */
        .sidebar {
            width: 340px;
            min-width: 280px;
            background: rgba(0, 0, 0, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            transition: width 0.3s ease, transform 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 10px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sidebar-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .sidebar-header .badge {
            background: var(--primary);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 50px;
            font-weight: 600;
        }

        .sidebar-actions {
            display: flex;
            gap: 6px;
        }

        .sidebar-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-actions button:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text-primary);
        }

        .playlist-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 6px 12px 6px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            border: 1px solid transparent;
            margin-bottom: 2px;
            background: transparent;
            width: 100%;
            text-align: right;
            color: var(--text-secondary);
        }
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .playlist-item.active {
            background: rgba(124, 92, 255, 0.15);
            border-color: rgba(124, 92, 255, 0.2);
            color: var(--text-primary);
        }
        .playlist-item.active .playlist-index {
            color: var(--primary-light);
        }

        .playlist-index {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 24px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .playlist-cover {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .playlist-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .playlist-info {
            flex: 1;
            min-width: 0;
        }
        .playlist-info .title {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-info .sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-duration {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            margin-right: auto;
            padding-right: 8px;
        }

        .playlist-item .remove-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
            opacity: 0;
        }
        .playlist-item:hover .remove-btn {
            opacity: 1;
        }
        .playlist-item .remove-btn:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .playlist-item.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }
        .playlist-item.drag-over {
            border-color: var(--primary);
            background: rgba(124, 92, 255, 0.08);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-muted);
            text-align: center;
            gap: 12px;
        }
        .empty-state .icon {
            font-size: 3rem;
            opacity: 0.3;
        }
        .empty-state p {
            font-size: 0.9rem;
            max-width: 200px;
        }

        /* ============================================================
           CONTENT AREA (Player)
           ============================================================ */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 20px;
            min-width: 0;
        }

        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 0 12px;
            min-height: 280px;
            position: relative;
        }

        /* Visualizer / Album Art Container */
        .visualizer-wrap {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .visualizer-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .visualizer-wrap .vis-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, transparent 40%, rgba(0, 0, 0, 0.3) 100%);
        }

        /* Album Art (shown for audio) */
        .album-art-container {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .album-art-container .album-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.6);
            transform: scale(1.1);
        }
        .album-art-container .album-cover {
            position: relative;
            width: 60%;
            max-width: 200px;
            aspect-ratio: 1/1;
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            z-index: 2;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }
        .album-art-container .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .album-art-container .album-cover .default-cover {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
        }
        /* spinning animation for audio */
        .album-art-container.spin .album-cover {
            animation: spin 20s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Video container (shown for video) */
        .video-container {
            position: absolute;
            inset: 0;
            display: none;
            background: #000;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Now Playing Info */
        .now-playing {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .now-playing .cover {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .now-playing .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .now-playing .meta {
            flex: 1;
            min-width: 0;
        }
        .now-playing .meta .track {
            font-size: 1.05rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .now-playing .meta .artist {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 4px 0;
        }

        .controls button {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .controls button:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text-primary);
            transform: scale(1.05);
        }
        .controls button:active {
            transform: scale(0.92);
        }
        .controls button.primary {
            background: var(--primary);
            color: #fff;
            width: 48px;
            height: 48px;
            font-size: 1.3rem;
            box-shadow: 0 4px 20px rgba(124, 92, 255, 0.3);
        }
        .controls button.primary:hover {
            background: var(--primary-light);
            box-shadow: 0 4px 30px rgba(124, 92, 255, 0.5);
            transform: scale(1.06);
        }
        .controls button.active {
            color: var(--gold);
        }

        /* Progress */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0 2px;
            width: 100%;
        }
        .progress-wrap .time {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 44px;
        }
        .progress-wrap .time.current {
            text-align: left;
        }
        .progress-wrap .time.total {
            text-align: right;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.10);
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }
        .progress-track:hover {
            height: 6px;
        }
        .progress-track .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            width: 0%;
            position: relative;
            transition: width 0.05s linear;
        }
        .progress-track .progress-fill::after {
            content: '';
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-light);
            box-shadow: 0 0 20px rgba(124, 92, 255, 0.5);
            opacity: 0;
            transition: var(--transition);
        }
        .progress-track:hover .progress-fill::after {
            opacity: 1;
        }
        .progress-track .buffer-fill {
            position: absolute;
            inset: 0;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            width: 0%;
            pointer-events: none;
        }

        /* Bottom Controls */
        .bottom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 6px 0 0;
            margin-top: 4px;
        }

        .bottom-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-left .vol-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-left .vol-wrap input[type="range"] {
            width: 72px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            outline: none;
            transition: var(--transition);
        }
        .bottom-left .vol-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-light);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(124, 92, 255, 0.3);
        }
        .bottom-left .vol-wrap input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-light);
            cursor: pointer;
            border: none;
        }

        .bottom-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bottom-center .speed-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        .bottom-center .speed-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .bottom-center .speed-btn.active {
            border-color: var(--primary);
            color: var(--primary-light);
        }

        .bottom-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bottom-right button {
            background: rgba(255, 255, 255, 0.03);
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bottom-right button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .bottom-right button.active {
            color: var(--gold);
        }

        /* ============================================================
           QUEUE PANEL
           ============================================================ */
        .queue-panel {
            position: absolute;
            left: 20px;
            bottom: 80px;
            width: 320px;
            max-height: 360px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow);
            padding: 12px 14px;
            overflow-y: auto;
            display: none;
            z-index: 50;
        }
        .queue-panel.open {
            display: block;
            animation: fadeSlideUp 0.25s ease;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .queue-panel .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .queue-panel .queue-header button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition);
        }
        .queue-panel .queue-header button:hover {
            color: #ff6b6b;
        }
        .queue-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .queue-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .queue-item .qidx {
            font-size: 0.65rem;
            color: var(--text-muted);
            min-width: 20px;
        }
        .queue-item .qname {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .queue-item .qdel {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 4px;
        }
        .queue-item .qdel:hover {
            color: #ff6b6b;
        }
        .queue-empty {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
            padding: 20px 0;
        }

        /* ============================================================
           EQUALIZER MODAL
           ============================================================ */
        .eq-modal {
            position: absolute;
            right: 20px;
            bottom: 80px;
            width: 340px;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow);
            padding: 16px 18px;
            display: none;
            z-index: 50;
        }
        .eq-modal.open {
            display: block;
            animation: fadeSlideUp 0.25s ease;
        }
        .eq-modal .eq-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .eq-modal .eq-header select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }
        .eq-modal .eq-header select option {
            background: #1a1a1a;
        }
        .eq-modal .eq-bands {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            height: 120px;
            align-items: flex-end;
            padding: 4px 0;
        }
        .eq-modal .eq-band {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .eq-modal .eq-band input[type="range"] {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 14px;
            height: 80px;
            background: transparent;
            outline: none;
            cursor: pointer;
        }
        .eq-modal .eq-band input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-light);
            cursor: pointer;
        }
        .eq-modal .eq-band input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-light);
            cursor: pointer;
            border: none;
        }
        .eq-modal .eq-band .eq-label {
            font-size: 0.55rem;
            color: var(--text-muted);
        }
        .eq-modal .eq-band .eq-val {
            font-size: 0.55rem;
            color: var(--text-secondary);
            min-width: 20px;
            text-align: center;
        }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            max-width: 90%;
        }
        .toast {
            padding: 10px 22px;
            border-radius: 50px;
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            animation: toastIn 0.35s ease, toastOut 0.35s ease 2.6s forwards;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success {
            border-color: var(--primary);
        }
        .toast.error {
            border-color: #ff6b6b;
        }
        .toast.warning {
            border-color: var(--gold);
        }
        .toast .toast-icon {
            font-size: 1.1rem;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(20px) scale(0.92);
            }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .app-footer {
            padding: 6px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.15);
            flex-wrap: wrap;
            gap: 4px;
        }
        .app-footer .footer-links {
            display: flex;
            gap: 12px;
        }
        .app-footer .footer-links span {
            cursor: default;
        }
        .app-footer .footer-links .dot {
            color: var(--text-muted);
        }

        /* ============================================================
           DROP ZONE
           ============================================================ */
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 30px 20px;
            text-align: center;
            color: var(--text-muted);
            transition: var(--transition);
            cursor: pointer;
            margin: 6px 0;
        }
        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(124, 92, 255, 0.05);
            color: var(--text-primary);
        }
        .drop-zone .dz-icon {
            font-size: 2.4rem;
            margin-bottom: 6px;
        }
        .drop-zone .dz-text {
            font-size: 0.85rem;
        }
        .drop-zone .dz-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .drop-zone input[type="file"] {
            display: none;
        }

        /* ============================================================
           DRAG GHOST
           ============================================================ */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            background: rgba(124, 92, 255, 0.15);
            border: 1px solid var(--primary);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            color: var(--text-primary);
            font-size: 0.8rem;
            backdrop-filter: blur(8px);
            transform: translate(-50%, -50%);
            opacity: 0.8;
        }

        /* ============================================================
           MOBILE PLAYLIST DRAWER
           ============================================================ */
        .playlist-drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .playlist-drawer-overlay.open {
            display: block;
            opacity: 1;
        }
        .playlist-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 70vh;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px 20px 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .playlist-drawer.open {
            transform: translateY(0);
        }
        .playlist-drawer .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        .playlist-drawer .drawer-header .drawer-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .playlist-drawer .drawer-header .drawer-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: var(--transition);
        }
        .playlist-drawer .drawer-header .drawer-close:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .playlist-drawer .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 20px;
        }
        .playlist-drawer .drawer-body .playlist-item {
            /* same as sidebar */
        }
        .playlist-drawer .drawer-body .empty-state {
            padding: 30px 20px;
        }

        /* ============================================================
           THEME OVERRIDES
           ============================================================ */
        body.theme-light .app-container {
            background: rgba(245, 245, 245, 0.85);
            border-color: rgba(0, 0, 0, 0.06);
        }
        body.theme-light {
            --bg-dark: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #444;
            --text-muted: #888;
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-glass: rgba(0, 0, 0, 0.04);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }
        body.theme-light .app-header {
            background: rgba(255, 255, 255, 0.5);
        }
        body.theme-light .sidebar {
            background: rgba(255, 255, 255, 0.3);
        }
        body.theme-light .playlist-item:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        body.theme-light .playlist-item.active {
            background: rgba(124, 92, 255, 0.08);
        }
        body.theme-light .controls button {
            color: var(--text-secondary);
        }
        body.theme-light .controls button:hover {

        }
        body.theme-light .search-box {

        }
        body.theme-light .search-box:focus {

        }
        body.theme-light .queue-panel {

        }
        body.theme-light .eq-modal {

        body.theme-light .toast {

        }
        body.theme-light .drop-zone {

        }
        body.theme-light .drop-zone.dragover {

        }

        body.theme-green .app-container {
            border-color: rgba(11, 138, 111, 0.15);
        }
        body.theme-green .logo-text {
            background: linear-gradient(135deg, #10b08a, #0b8a6f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.theme-green .controls button.primary {
            background: #0b8a6f;
        }
        body.theme-green .controls button.primary:hover {
            background: #10b08a;
        }

        body.theme-golden .app-container {
            border-color: rgba(212, 168, 67, 0.15);
        }
        body.theme-golden .logo-text {
            background: linear-gradient(135deg, #f0d080, #d4a843);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.theme-golden .controls button.primary {
            background: var(--gold);
            box-shadow: 0 4px 20px rgba(212, 168, 67, 0.3);
        }
        body.theme-golden .controls button.primary:hover {
            background: var(--gold-light);
            box-shadow: 0 4px 30px rgba(212, 168, 67, 0.5);
        }
        body.theme-golden .progress-track .progress-fill {
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
        }
        body.theme-golden .progress-track .progress-fill::after {

        }
        body.theme-golden .playlist-item.active {
            border-color: rgba(212, 168, 67, 0.2);

        }
        body.theme-golden .playlist-item.active .playlist-index {
            color: var(--gold);
        }
        body.theme-golden .eq-band input[type="range"]::-webkit-slider-thumb {
            background: var(--gold);
        }
        body.theme-golden .eq-band input[type="range"]::-moz-range-thumb {
            background: var(--gold);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */

<body>
    <div class="app-container" role="application" aria-label="پلیر دیار قدمگاه">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-area" id="logoArea" role="banner">
                    <img id="logoImg" src="logo.png" alt="دیار قدمگاه" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
                    <span class="logo-text" id="logoFallback" style="display:none;">دیار قدمگاه</span>
                </div>
                <button class="mobile-playlist-toggle" id="mobilePlaylistToggle" aria-label="لیست پخش" title="لیست پخش">📋</button>
            </div>
            <div class="header-center">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-box" id="searchBox" placeholder="جستجو در لیست پخش ..." aria-label="جستجو">
            </div>
            <div class="header-right">
                <span class="header-clock" id="clockDisplay">--:--</span>
                <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم" title="تغییر تم">🌙</button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <div class="main-layout">
            <!-- SIDEBAR (Desktop) -->
            <aside class="sidebar" role="complementary" aria-label="لیست پخش">
                <div class="sidebar-header">
                    <h3>📋 لیست پخش <span class="badge" id="playlistCount">0</span></h3>
                    <div class="sidebar-actions">
                        <button id="addFilesBtn" aria-label="افزودن فایل" title="افزودن فایل">➕</button>
                        <button id="clearPlaylistBtn" aria-label="پاک کردن لیست" title="پاک کردن لیست">🗑</button>
                    </div>
                </div>
                <div class="playlist-container" id="playlistContainer" role="list">
                    <div class="empty-state" id="emptyPlaylist">
                        <div class="icon">🎵</div>
                        <p>هیچ فایلی در لیست پخش نیست.<br>فایل‌های صوتی یا تصویری را اضافه کنید.</p>
                    </div>

    <script>
        (function() {
            'use strict';

            // --- DOM refs for new UI elements ---
            var albumArtContainer = document.getElementById('albumArtContainer');
            var albumBg = document.getElementById('albumBg');
            var albumCoverImg = document.getElementById('albumCoverImg');
            var defaultCover = document.getElementById('defaultCover');
            var videoContainer = document.getElementById('videoContainer');
            var videoPlayer = document.getElementById('videoPlayer');
            var mobileToggle = document.getElementById('mobilePlaylistToggle');
            var drawerOverlay = document.getElementById('playlistDrawerOverlay');
            var playlistDrawer = document.getElementById('playlistDrawer');
            var drawerClose = document.getElementById('drawerCloseBtn');
            var drawerBody = document.getElementById('drawerBody');

            // --- Store original audio element reference ---
            var originalAudio = null;

            // --- Helper to get current item ---
            function getCurrentItem() {
                if (typeof state !== 'undefined' && state.currentIndex >= 0 && state.playlist && state.playlist[state
                        .currentIndex]) {
                    return state.playlist[state.currentIndex];
                }
                return null;
            }

            // --- Update album art / video display ---
            function updateMediaDisplay() {
                var item = getCurrentItem();
                if (!item) {
                    // Show visualizer only
                    albumArtContainer.style.display = 'none';
                    videoContainer.style.display = 'none';
                    document.querySelector('.visualizer-wrap canvas').style.display = 'block';
                    return;
                }

                var canvas = document.querySelector('.visualizer-wrap canvas');
                if (item.type === 'video') {
                    // Show video, hide album art and canvas
                    albumArtContainer.style.display = 'none';
                    videoContainer.style.display = 'flex';
                    canvas.style.display = 'none';
                    // Set video source if needed
                    if (videoPlayer.src !== item.path) {
                        videoPlayer.src = item.path;
                        videoPlayer.load();
                    }
                    // Sync playback
                    if (typeof audioEl !== 'undefined' && audioEl) {
                        if (state.isPlaying) {
                            videoPlayer.play().catch(function() {});
                        } else {
                            videoPlayer.pause();
                        }
                        videoPlayer.currentTime = audioEl.currentTime || 0;
                    }
                } else {
                    // Audio: show album art
                    videoContainer.style.display = 'none';
                    canvas.style.display = 'block';
                    albumArtContainer.style.display = 'flex';

                    // Set cover image
                    var coverUrl = item.cover || '';
                    if (coverUrl && coverUrl.indexOf('data:') === 0) {
                        albumCoverImg.src = coverUrl;
                        albumCoverImg.style.display = 'block';
                        defaultCover.style.display = 'none';
                        albumBg.style.backgroundImage = 'url(' + coverUrl + ')';
                    } else {
                        albumCoverImg.style.display = 'none';
                        defaultCover.style.display = 'flex';
                        albumBg.style.backgroundImage = 'url(default-cover.png)';
                    }

                    // Spin animation
                    if (state.isPlaying) {
                        albumArtContainer.classList.add('spin');
                    } else {
                        albumArtContainer.classList.remove('spin');
                    }
                }
            }

            // --- Override play/pause to update UI ---
            var originalTogglePlay = window.togglePlay;
            if (typeof window.togglePlay === 'function') {
                window.togglePlay = function() {
                    originalTogglePlay.apply(this, arguments);
                    setTimeout(updateMediaDisplay, 100);
                };
            }

            // --- Override playIndex to update UI ---
            var originalPlayIndex = window.playIndex;
            if (typeof window.playIndex === 'function') {
                window.playIndex = function(index) {
                    originalPlayIndex.apply(this, arguments);
                    setTimeout(updateMediaDisplay, 200);
                };
            }

            // --- Listen to state changes (if possible) ---
            // We'll use a MutationObserver or simple interval to detect changes
            var lastItemId = null;
            setInterval(function() {
                var item = getCurrentItem();
                var id = item ? item.id : null;
                if (id !== lastItemId) {
                    lastItemId = id;
                    updateMediaDisplay();
                    // Also update video player if video
                    if (item && item.type === 'video' && videoPlayer.src !== item.path) {
                        videoPlayer.src = item.path;
                        videoPlayer.load();
                    }
                }
                // Sync video playback
                if (item && item.type === 'video' && typeof audioEl !== 'undefined' && audioEl) {
                    if (Math.abs(videoPlayer.currentTime - audioEl.currentTime) > 0.5) {
                        videoPlayer.currentTime = audioEl.currentTime || 0;
                    }
                    if (state.isPlaying && videoPlayer.paused) {
                        videoPlayer.play().catch(function() {});
                    } else if (!state.isPlaying && !videoPlayer.paused) {
                        videoPlayer.pause();
                    }
                }
            }, 500);

            // --- Mobile playlist drawer ---
            function openDrawer() {
                drawerOverlay.classList.add('open');
                playlistDrawer.classList.add('open');
                // Copy playlist items from sidebar to drawer
                var sidebarItems = document.querySelector('.sidebar .playlist-container');
                if (sidebarItems) {
                    drawerBody.innerHTML = sidebarItems.innerHTML;
                    // Re-bind events (simple approach: clone events)
                    drawerBody.querySelectorAll('.playlist-item').forEach(function(el, idx) {
                        el.addEventListener('click', function() {
                            // Find corresponding item in sidebar and click it
                            var sidebarItem = document.querySelector('.sidebar .playlist-item[data-index="' +
                                idx + '"]');
                            if (sidebarItem) sidebarItem.click();
                            closeDrawer();
                        });
                        var rm = el.querySelector('.remove-btn');
                        if (rm) {
                            rm.addEventListener('click', function(e) {
                                e.stopPropagation();
                                var idx = parseInt(this.parentElement.dataset.index);
                                var sidebarRm = document.querySelector(
                                    '.sidebar .playlist-item[data-index="' + idx + '"] .remove-btn');
                                if (sidebarRm) sidebarRm.click();
                                // Refresh drawer after removal
                                setTimeout(function() {
                                    var sidebarItems2 = document.querySelector(
                                        '.sidebar .playlist-container');
                                    if (sidebarItems2) drawerBody.innerHTML = sidebarItems2.innerHTML;
                                }, 100);
                            });
                        }
                    });
                }
            }

            function closeDrawer() {
                drawerOverlay.classList.remove('open');
                playlistDrawer.classList.remove('open');
            }

            if (mobileToggle) {
                mobileToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (playlistDrawer.classList.contains('open')) {
                        closeDrawer();
                    } else {
                        openDrawer();
                    }
                });
            }

            if (drawerClose) {
                drawerClose.addEventListener('click', closeDrawer);
            }

            if (drawerOverlay) {
                drawerOverlay.addEventListener('click', closeDrawer);
            }

            // --- Also add playlist count to drawer header ---
            var originalRenderPlaylist = window.renderPlaylist;
            if (typeof window.renderPlaylist === 'function') {
                window.renderPlaylist = function() {
                    originalRenderPlaylist.apply(this, arguments);
                    // Update drawer if open
                    if (playlistDrawer.classList.contains('open')) {
                        var sidebarItems = document.querySelector('.sidebar .playlist-container');
                        if (sidebarItems) drawerBody.innerHTML = sidebarItems.innerHTML;
                    }
                };
            }

            // --- Override updateNowPlaying to show album art in small cover ---
            var originalUpdateNowPlaying = window.updateNowPlaying;
            if (typeof window.updateNowPlaying === 'function') {
                window.updateNowPlaying = function(item) {
                    originalUpdateNowPlaying.apply(this, arguments);
                    // update media display
                    updateMediaDisplay();
                };
            }

            // --- Initial call ---
            setTimeout(updateMediaDisplay, 500);

            // --- Also handle theme toggle for drawer ---
            var origThemeToggle = document.getElementById('themeToggle');
            if (origThemeToggle) {
                origThemeToggle.addEventListener('click', function() {
                    setTimeout(function() {
                        // Update drawer background if open
                        if (playlistDrawer.classList.contains('open')) {
                            // already handled by CSS
                        }
                    }, 50);
                });
            }

            console.log('UI enhancements loaded successfully.');
        })();
    </script>
