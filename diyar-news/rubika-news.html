/* =====================================================
   اعداد فارسی
===================================================== */

function toPersianDigits(value) {

    return String(value ?? "")
        .replace(
            /\d/g,
            d => "۰۱۲۳۴۵۶۷۸۹"[d]
        );
}


/* =====================================================
   تبدیل اعداد فارسی به انگلیسی
===================================================== */

function toEnglishDigits(value) {

    return String(value ?? "")
        .replace(/[۰-۹]/g, d =>
            "۰۱۲۳۴۵۶۷۸۹".indexOf(d)
        )
        .replace(/[٠-٩]/g, d =>
            "٠١٢٣٤٥٦٧٨٩".indexOf(d)
        );
}


/* =====================================================
   پاک‌سازی متن
===================================================== */

function normalizeText(value) {

    return String(value ?? "")

        .replace(/ي/g, "ی")
        .replace(/ى/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/ۀ/g, "ه")

        .replace(/\u200c/g, " ")

        .replace(/\s+/g, " ")

        .trim()
        .toLowerCase();
}


/* =====================================================
   ایمن‌سازی HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =====================================================
   تاریخ
===================================================== */

function formatDate(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return String(value);
    }

    try {

        return new Intl.DateTimeFormat(
            "fa-IR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);

    } catch {

        return String(value);
    }
}


/* =====================================================
   دریافت اخبار
===================================================== */

async function loadNews() {

    const newsList =
        document.getElementById(
            "newsList"
        );

    const updateInfo =
        document.getElementById(
            "updateInfo"
        );


    newsList.innerHTML =
        `
        <div class="status">
            📰 در حال دریافت اخبار و چکیده‌ها...
        </div>
        `;


    try {

        const response =
            await fetch(
                SUMMARY_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "news-summary.json unavailable"
            );
        }


        const data =
            await response.json();


        /*
         * پشتیبانی از چند ساختار احتمالی JSON
         */

        if (
            Array.isArray(data)
        ) {

            allNews = data;

        } else if (
            Array.isArray(data.news)
        ) {

            allNews = data.news;

        } else if (
            Array.isArray(data.items)
        ) {

            allNews = data.items;

        } else {

            allNews = [];
        }


        buildCategories();

        renderNews();


        if (data.lastUpdate) {

            updateInfo.textContent =
                "آخرین بروزرسانی: " +
                formatDate(
                    data.lastUpdate
                );

        } else {

            updateInfo.textContent =
                "تعداد اخبار: " +
                toPersianDigits(
                    allNews.length
                );
        }


    } catch (error) {

        console.error(error);


        newsList.innerHTML =
            `
            <div class="status">

                ❌ دریافت اخبار با مشکل روبه‌رو شد.

                <br><br>

                لطفاً دوباره روی «بروزرسانی» بزنید.

            </div>
            `;


        updateInfo.textContent =
            "خطا در دریافت اخبار";
    }
}


/* =====================================================
   ساخت دسته‌ها
===================================================== */

function buildCategories() {

    const container =
        document.getElementById(
            "categories"
        );


    container.innerHTML = "";


    const categories = [

        ["all", "📰 همه"],
        ["سیاسی", "🏛 سیاسی"],
        ["اقتصادی", "💰 اقتصادی"],
        ["اجتماعی", "👥 اجتماعی"],
        ["بین‌الملل", "🌍 بین‌الملل"],
        ["ورزشی", "⚽ ورزشی"],
        ["علمی و فناوری", "💻 فناوری"],
        ["متفرقه", "📌 متفرقه"]

    ];


    categories.forEach(
        function(category) {

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className =
                "category-btn";


            button.textContent =
                category[1];


            if (
                category[0] ===
                currentCategory
            ) {

                button.classList.add(
                    "active"
                );
            }


            button.addEventListener(
                "click",
                function() {

                    currentCategory =
                        category[0];


                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    renderNews();
                }
            );


            container.appendChild(
                button
            );
        }
    );
}


/* =====================================================
   اخبار قابل نمایش
===================================================== */

function getVisibleNews() {

    let filtered;


    if (
        currentCategory ===
        "all"
    ) {

        filtered =
            allNews;

    } else {

        filtered =
            allNews.filter(
                item =>
                    smartCategory(item) ===
                    currentCategory
            );
    }


    return filtered.slice(
        0,
        NEWS_COUNT
    );
}


/* =====================================================
   نمایش روی صفحه
===================================================== */

function renderNews() {

    const container =
        document.getElementById(
            "newsList"
        );


    const news =
        getVisibleNews();


    if (!news.length) {

        container.innerHTML =
            `
            <div class="status">
                خبری برای این دسته وجود ندارد.
            </div>
            `;

        return;
    }


    container.innerHTML =
        news.map(
            function(item, index) {

                const title =
                    escapeHTML(
                        item.title
                    );


                const source =
                    escapeHTML(
                        item.source ||
                        "منبع نامشخص"
                    );


                const category =
                    escapeHTML(
                        smartCategory(
                            item
                        )
                    );


                const link =
                    escapeHTML(
                        item.link ||
                        "#"
                    );


                const summary =
                    String(
                        item.summary ||
                        ""
                    ).trim();


                const summaryHTML =
                    summary
                        ? `
                        <div class="summary">
                            📝 ${escapeHTML(summary)}
                        </div>
                        `
                        : "";


                return `

                <article class="news-card">

                    <div class="news-title">

                        <span class="news-number">
                            🔴 ${toPersianDigits(index + 1)}.
                        </span>

                        ${title}

                    </div>


                    <div class="meta">

                        📰 ${source}
                        &nbsp; | &nbsp;
                        🏷 ${category}

                    </div>


                    ${summaryHTML}


                    <a
                        class="read-link"
                        href="${link}"
                        target="_blank"
                        rel="noopener noreferrer">

                        🔗 مطالعه متن کامل خبر

                    </a>

                </article>

                `;

            }
        ).join("");
}


/* =====================================================
   حذف فاصله‌های اضافی چکیده
===================================================== */

function cleanSummary(text) {

    return String(text || "")

        .replace(/\s+/g, " ")

        .replace(
            /^(📝|خلاصه:|چکیده:)\s*/i,
            ""
        )

        .trim();
}

   ساخت متن مخصوص روبیکا

                ).trim();

                smartCategory(item);

            /*
             * عنوان خبر
             */

            text +=

                "🔴 " +
                toPersianDigits(
                    index + 1
                ) +
                ". " +
                title +
                "\n";


            /*
             * منبع و دسته
             */

            text +=

                "📰 " +
                source +
                " | 🏷 " +
                category +
                "\n";


            /*
             * چکیده فقط در صورت وجود
             */

            if (summary) {

                text +=
                    "📝 " +
                    summary +
                    "\n";
            }


            /*
             * جداکننده کوتاه
             */

            if (
                index <
                news.length - 1
            ) {

                text +=
                    "──────────\n";
            }
        }
    );


    /*
     * انتهای پیام
     */

    text +=

        "\n" +
        "━━━━━━━━━━━━\n" +
        "📖 مشاهده متن کامل اخبار:\n" +
        RUBIKA_PAGE_URL +
        "\n\n" +
        "🏡 دیار قدمگاه\n" +
        "✍️ معقول";


    return text;
}


/* =====================================================
   کپی برای روبیکا
===================================================== */

async function copyForRubika() {

    const text =
        createRubikaText();


    if (!text) {

        showToast(
            "خبری برای کپی وجود ندارد."
        );

        return;
    }


    try {

        await navigator
            .clipboard
            .writeText(
                text
            );


        showToast(
            "✅ متن فشرده و زیبای اخبار کپی شد."
        );


    } catch (error) {

        console.error(error);


        /*
         * روش جایگزین برای مرورگرهای قدیمی
         */

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success =
            false;


        try {

            success =
                document.execCommand(
                    "copy"
                );

        } catch {

            success =
                false;
        }


        textarea.remove();


        if (success) {

            showToast(
                "✅ متن برای روبیکا کپی شد."
            );

        } else {

            showToast(
                "❌ کپی خودکار انجام نشد."
            );
        }
    }
}


/* =====================================================
   پیام Toast
===================================================== */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function() {

                toast.style.display =
                    "none";

            },
            2500
        );
}


/* =====================================================
   رویداد دکمه‌ها
===================================================== */

document
    .getElementById(
        "copyBtn"
    )
    .addEventListener(
        "click",
        copyForRubika
    );


document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        loadNews
    );


/* =====================================================
   شروع برنامه
===================================================== */

loadNews();

</script>
